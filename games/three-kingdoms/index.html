<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国塔防 · 群雄逐鹿</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0703; color: #f3e9d2;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #hud {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px; background: linear-gradient(180deg,#3d2612,#1a1006);
    border-bottom: 2px solid #8a6a2f; flex-shrink: 0;
  }
  .stat { background:#1a1006; border:1px solid #6b5426; border-radius:6px; padding:6px 10px; font-size:14px; }
  .stat b { color:#ffd54a; font-size:16px; margin-left:4px; }
  #hud button {
    font-family: inherit; cursor: pointer; color:#fff; border:1px solid #e6b800;
    background: linear-gradient(180deg,#b8741a,#8a5212); border-radius:6px; padding:7px 12px; font-size:13px;
  }
  #hud button.on { background: linear-gradient(180deg,#2f8f3c,#1f6a2a); }
  #hint { margin-left:auto; font-size:12px; color:#cfb37a; }
  #synergyLine { flex-basis:100%; font-size:12px; color:#9ad0ff; min-height:14px; }
  #envTip { flex-basis:100%; font-size:11.5px; color:#b9d7a8; min-height:13px; }
  #envStat { cursor:help; }
  .envBox { border-color:#4a6a3a !important; }
  /* ---------- 主公技条 ---------- */
  #cmdBar { position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    display:flex; align-items:flex-end; gap:10px; pointer-events:none; z-index:6; }
  #moraleWrap { pointer-events:none; text-align:center; }
  #moraleLabel { font-size:10px; letter-spacing:3px; color:#c9b98f; margin-bottom:3px; text-shadow:0 1px 3px #000; }
  #moraleBar { position:relative; width:96px; height:20px; background:rgba(10,7,3,.82);
    border:1px solid #8a6a2f; border-radius:5px; overflow:hidden; }
  #moraleFill { position:absolute; inset:0 auto 0 0; width:25%;
    background:linear-gradient(180deg,#ff8a3a,#c04a10); transition:width .18s linear; }
  #moraleTxt { position:relative; display:block; line-height:20px; font-size:11px; font-weight:bold;
    color:#fff; text-shadow:0 1px 2px #000; }
  #cmdBtns { display:flex; gap:7px; pointer-events:auto; }
  .cmdBtn { position:relative; width:74px; min-height:56px; overflow:hidden;
    background:linear-gradient(180deg,rgba(58,42,20,.94),rgba(22,15,7,.94));
    border:1px solid #6b5426; border-radius:8px; cursor:pointer; padding:5px 4px 4px;
    font-family:inherit; color:#f3e9d2; text-align:center; line-height:1.25;
    box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .cmdBtn .cmdName { font-size:11.5px; font-weight:bold; display:block; }
  .cmdBtn .cmdKey { position:absolute; top:2px; left:4px; font-size:9px; color:#ffd54a; font-weight:bold; }
  .cmdBtn .cmdCost { display:block; font-size:10px; color:#ffb066; margin-top:1px; }
  .cmdBtn .cmdSweep { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.66);
    pointer-events:none; transition:height .1s linear; }
  .cmdBtn .cmdCdTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:bold; color:#fff; text-shadow:0 1px 4px #000; pointer-events:none; }
  .cmdBtn.ready { border-color:#ffd54a; box-shadow:0 0 10px rgba(255,213,74,.45),0 3px 10px rgba(0,0,0,.5); }
  .cmdBtn.ready:hover { background:linear-gradient(180deg,rgba(96,68,28,.96),rgba(40,26,10,.96)); }
  .cmdBtn.poor { opacity:.55; }
  .cmdBtn.aiming { border-color:#ff8a3a; box-shadow:0 0 14px rgba(255,138,58,.8); animation:aimPulse .8s infinite alternate; }
  @keyframes aimPulse { from{transform:translateY(0)} to{transform:translateY(-3px)} }
  body.mobile #cmdBar { bottom:4px; gap:5px; }
  body.mobile .cmdBtn { width:60px; min-height:50px; }
  body.mobile #moraleBar { width:66px; }
  .pickLabel { font-size:11px; letter-spacing:4px; color:#8a7a52; margin:12px 0 4px; }
  #mapDesc { font-size:12px; color:#c9b98f; min-height:32px; line-height:1.5; margin-top:4px; }
  #wrap { flex:1; min-height:0; display:flex; }
  #canvasBox { flex:1; min-width:0; position:relative; background:#0c0a04; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #canvasBox { touch-action:none; -webkit-tap-highlight-color:transparent; }
  #mobileBar { display:none; }

  #side {
    width: 290px; flex-shrink:0; display:flex; flex-direction:column;
    background: linear-gradient(180deg,#2a1c0e,#120c06); border-left:2px solid #8a6a2f; overflow:hidden;
  }
  .tabs { display:flex; }
  .tabs button {
    flex:1; padding:10px; font-family:inherit; font-size:14px; cursor:pointer; color:#d8c9a3;
    background:#1a1208; border:none; border-bottom:3px solid transparent;
  }
  .tabs button.cur { color:#ffd54a; border-bottom-color:#ffd54a; background:#2a1c0e; }
  #shop { flex:1; overflow:auto; padding:8px; }
  .card {
    display:flex; gap:8px; align-items:center; width:100%; text-align:left; cursor:pointer;
    background:#1c1208; border:1px solid #5a4420; border-radius:8px; padding:7px; margin-bottom:6px;
    color:inherit; font-family:inherit;
  }
  .card:hover { border-color:#e6b800; }
  .card.active { border-color:#ffd700; box-shadow:0 0 0 2px rgba(255,215,0,.3); }
  .card canvas { width:48px; height:48px; background:#14100a; border-radius:6px; flex-shrink:0; }
  .card .nm { font-weight:bold; font-size:13px; }
  .card .ds { font-size:11px; color:#c9b98f; line-height:1.3; }
  .card .cost { margin-left:auto; color:#ffd54a; font-weight:bold; font-size:13px; white-space:nowrap; }
  #detail { border-top:2px solid #6b5426; padding:10px; min-height:190px; overflow:auto; max-height:44vh; }
  #detail h3 { color:#ffd54a; font-size:15px; margin-bottom:6px; }
  #detail .row { font-size:13px; color:#d8c9a3; margin:3px 0; }
  #detail .row b { color:#ffd54a; }
  .lvPips { display:inline-flex; gap:3px; vertical-align:middle; margin-left:6px; }
  .lvPips .pip { width:9px; height:9px; border-radius:2px; border:1px solid #6b5426; background:#241608; display:inline-block; transform:rotate(45deg); }
  .lvPips .pip.on { background:#ffd54a; border-color:#ffe9a0; box-shadow:0 0 6px rgba(255,213,74,.7); }
  .lvPips .pip.ult.on { background:#ff8a00; border-color:#ffd54a; box-shadow:0 0 9px rgba(255,138,0,.9); }
  .tagLine { display:flex; flex-wrap:wrap; gap:4px; margin:5px 0 7px; }
  .tagLine.sm { margin:2px 0 3px; }
  .tg { font-size:10px; color:#9ad0ff; border:1px solid #35618a; background:rgba(60,120,180,.14);
    border-radius:4px; padding:1px 5px; letter-spacing:1px; }
  .specBox { font-size:11.5px; line-height:1.55; color:#d8c9a3; background:rgba(107,63,160,.16);
    border-left:3px solid #8a5cff; border-radius:0 5px 5px 0; padding:6px 8px; margin:6px 0; }
  .specBox b { color:#c9a6ff; }
  .specBox.hint { background:rgba(255,255,255,.04); border-left-color:#6b5426; color:#b8a884; }
  .specBox.hint b { color:#e6b800; }
  .attrs { margin:7px 0; display:flex; flex-direction:column; gap:2px; }
  .arow { display:flex; align-items:baseline; gap:6px; font-size:12.5px; color:#b8a884;
    padding:3px 7px; background:rgba(255,255,255,.035); border-radius:4px; }
  .arow span:first-child { flex:1; }
  .arow b { color:#ffd54a; font-size:13px; }
  .arow.hi { background:rgba(255,213,74,.1); }
  .arow.hi b { color:#ffe9a0; }
  .arow .gain { color:#7CFF7C; font-size:11.5px; font-weight:bold; }
  .arow .same { color:#8a8578; font-size:11.5px; }
  .card .dps { float:right; font-size:10.5px; color:#7CFF7C; font-weight:normal; }
  .pbtn { width:100%; margin-top:6px; padding:8px; font-family:inherit; font-size:13px; cursor:pointer;
    border-radius:6px; border:1px solid #e6b800; color:#fff; text-align:center; }
  .pbtn.up { background:linear-gradient(180deg,#2f8f3c,#1f6a2a); }
  .pbtn.sk { background:linear-gradient(180deg,#6b3fa0,#3d2460); }
  .pbtn.sell { background:linear-gradient(180deg,#a44,#7a2b2b); }
  .pbtn.spec { background:linear-gradient(180deg,#1a3a5a,#0e2038); text-align:left; line-height:1.5; }
  .pbtn:disabled { opacity:.4; cursor:not-allowed; }
  #relics { display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px; }
  .relicTag { background:#241608; border:1px solid #6b5426; border-radius:5px; padding:3px 7px; font-size:11px; color:#ffd54a; }
  #overlay {
    position:fixed; inset:0; background:rgba(6,4,2,.88); display:flex; align-items:center; justify-content:center; z-index:20;
  }
  #overlay .box {
    text-align:center; padding:38px 46px; border:3px solid #e6b800; border-radius:14px;
    background:linear-gradient(180deg,#3a2410,#160e06); max-width:680px;
  }
  #overlay h1 { font-size:42px; letter-spacing:8px; color:#ffd54a; text-shadow:0 2px 0 #7a2b2b; margin-bottom:12px; }
  #overlay p { color:#d8c9a3; line-height:1.85; margin-bottom:16px; font-size:14px; }
  #overlay button {
    font-family:inherit; font-size:18px; letter-spacing:4px; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,#c0392b,#7a1f16); border:2px solid #ffd700; border-radius:8px; padding:12px 40px;
  }
  #banner {
    position:absolute; left:50%; top:14%; transform:translateX(-50%);
    pointer-events:none; font-size:28px; font-weight:bold; color:#ffd54a;
    text-shadow:0 2px 0 #000, 0 0 16px #c0392b; opacity:0; transition:opacity .2s; text-align:center;
  }
  #waveSummary {
    position:absolute; right:14px; top:14px; pointer-events:none; opacity:0; transition:opacity .3s;
    background:rgba(10,6,2,.82); border:1px solid #8a6a2f; border-radius:8px; padding:10px 14px;
    font-size:13px; color:#e8d9b0; line-height:1.7; max-width:220px;
  }
  #waveSummary b { color:#ffd54a; }
  #pauseOverlay {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,3,1,.6); font-size:34px; letter-spacing:6px; color:#ffd54a;
    text-shadow:0 2px 0 #000; z-index:5;
  }
  #relicModal {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,3,1,.82); z-index:15;
  }
  #relicModal .box { background:linear-gradient(180deg,#2a1c0e,#150d05); border:2px solid #ffd700; border-radius:12px; padding:26px 30px; max-width:720px; text-align:center; }
  #relicModal h2 { color:#ffd54a; font-size:22px; letter-spacing:3px; margin-bottom:14px; }
  #relicCards { display:flex; gap:14px; }
  .relicCard { flex:1; background:#1c1208; border:2px solid #6b5426; border-radius:10px; padding:16px 12px; cursor:pointer; }
  .relicCard:hover { border-color:#ffd700; box-shadow:0 0 12px rgba(255,215,0,.4); }
  .relicCard .rn { color:#ffd54a; font-size:15px; font-weight:bold; margin-bottom:8px; }
  .relicCard .rd { color:#d8c9a3; font-size:12.5px; line-height:1.5; }
  #modePick { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
  #modePick button {
    font-family:inherit; cursor:pointer; color:#fff; border:2px solid #6b5426; border-radius:8px;
    background:#1a1006; padding:8px 18px; font-size:14px;
  }
  #modePick button.sel { border-color:#9ad0ff; background:linear-gradient(180deg,#1a4a6b,#0e2c44); box-shadow:0 0 12px rgba(154,208,255,.3); }
  #modeDesc { color:#c9b98f; font-size:12px; margin-bottom:10px; min-height:16px; }
  #diffPick { display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
  #diffPick button {
    font-family:inherit; cursor:pointer; color:#fff; border:2px solid #6b5426; border-radius:8px;
    background:#1a1006; padding:8px 18px; font-size:14px;
  }
  #diffPick button.sel { border-color:#ffd700; background:linear-gradient(180deg,#8a5212,#5a3410); }
  #bestRecord { color:#9ad0ff; font-size:13px; margin-bottom:10px; }
  /* ---- 军府（局外养成）面板 ---- */
  .renownGain { margin:14px 0 6px; color:#ffd54a; font-size:20px; font-weight:700; letter-spacing:2px; text-shadow:0 0 12px rgba(255,213,74,.45); }
  .renownGain span { color:#c9b98f; font-size:13px; font-weight:400; letter-spacing:0; }
  #techBox { max-width:1080px; text-align:left; }
  #techBox h1 { text-align:center; }
  .metaBar { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:14px;
    background:linear-gradient(180deg,#2a1e10,#160e06); border:1px solid #6b5220; border-radius:10px; padding:10px 14px; }
  .metaBar b { color:#ffd54a; font-size:22px; }
  .metaBar span { color:#c9b98f; font-size:13px; }
  .techGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .techCol { background:rgba(0,0,0,.28); border:1px solid #4a3820; border-radius:10px; padding:10px 9px; }
  .techCol h3 { text-align:center; font-size:16px; letter-spacing:4px; margin-bottom:9px; padding-bottom:6px; border-bottom:1px solid #4a3820; }
  .techNode { border:1px solid #55401f; border-radius:8px; padding:8px 9px; margin-bottom:8px; cursor:pointer;
    background:linear-gradient(180deg,#241a0e,#140d05); transition:transform .1s, box-shadow .15s; }
  .techNode:hover { transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .techNode.max { border-color:#ffd54a; box-shadow:inset 0 0 12px rgba(255,213,74,.16); cursor:default; }
  .techNode.locked { opacity:.45; cursor:not-allowed; }
  .techNode.poor { opacity:.72; }
  .techNode .tn { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; }
  .techNode .tl { font-size:11px; color:#9ad0ff; letter-spacing:1px; }
  .techNode .td { font-size:11.5px; color:#d8c9a3; margin:4px 0 5px; line-height:1.5; }
  .techNode .tc { font-size:12px; color:#ffd54a; }
  .techNode .tc.no { color:#c96b6b; }
  .pipRow { display:flex; gap:3px; margin-top:4px; }
  .pip { flex:1; height:4px; border-radius:2px; background:#3a2a14; }
  .pip.on { background:#ffd54a; }
  .achGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .achCell { border:1px solid #4a3820; border-radius:8px; padding:7px 9px; background:rgba(0,0,0,.25); font-size:12px; }
  .achCell.on { border-color:#7fe08a; background:linear-gradient(180deg,#16301c,#0c1a10); }
  .achCell b { display:block; font-size:13px; color:#c9b98f; margin-bottom:3px; }
  .achCell.on b { color:#7fe08a; }
  .achCell i { font-style:normal; color:#8a7a5a; }
  .achCell.on i { color:#a8c8a8; }
  .achToast { position:fixed; right:18px; top:80px; z-index:60; pointer-events:none; display:flex; flex-direction:column; gap:8px; }
  .achToast div { background:linear-gradient(180deg,#1d3524,#0d1a11); border:2px solid #7fe08a; border-radius:10px;
    padding:9px 15px; color:#dff5e2; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.55); animation:achIn .35s ease-out; }
  .achToast div b { color:#7fe08a; display:block; font-size:14px; letter-spacing:1px; }
  @keyframes achIn { from{ opacity:0; transform:translateX(50px) } to{ opacity:1; transform:none } }
  @media (max-width:900px){ .techGrid, .achGrid { grid-template-columns:repeat(2,1fr); } }
  #overlay .box { max-height:92vh; overflow:auto; }
  #resultBox { text-align:left; }
  #resultBox h1, #resultBox p { text-align:center; }
  .gradeWrap { display:flex; flex-direction:column; align-items:center; margin:6px 0 16px; }
  .gradeBadge {
    width:78px; height:78px; line-height:78px; text-align:center; font-size:44px; font-weight:bold;
    border-radius:50%; border:3px solid currentColor; letter-spacing:0;
    box-shadow:0 0 22px currentColor, inset 0 0 18px rgba(255,255,255,.12);
    animation: gradePop .5s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes gradePop { from{transform:scale(.3) rotate(-14deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .gradeBadge.gS{color:#ffd54a} .gradeBadge.gA{color:#7CFF7C} .gradeBadge.gB{color:#7ecbff}
  .gradeBadge.gC{color:#e0a45a} .gradeBadge.gD{color:#c96060}
  .gradeTxt { font-size:12px; color:#c9b98f; letter-spacing:3px; margin-top:6px; }
  .statGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 18px; margin-bottom:12px; }
  .sRow, .rankRow { display:flex; justify-content:space-between; gap:10px; font-size:13px;
    color:#c9b98f; padding:4px 8px; background:rgba(255,255,255,.035); border-radius:5px; }
  .sRow b, .rankRow b { color:#ffd54a; }
  .rankRow { margin-bottom:4px; }
  .secTitle { color:#e6b800; font-size:12px; letter-spacing:3px; margin:12px 0 6px; border-bottom:1px solid #6b5426; padding-bottom:4px; }
  .relicLine { font-size:12.5px; color:#9ad0ff; margin-bottom:10px; line-height:1.6; }
  .btnRow { display:flex; gap:12px; justify-content:center; margin-top:6px; }
  #overlay button.ghost { background:linear-gradient(180deg,#3a2a14,#1c1408); border-color:#8a6a2f; font-size:14px; letter-spacing:2px; padding:12px 20px; }
  /* ---------- 移动端：侧栏变底部抽屉 + 触控快捷条 ---------- */
  @media (max-width: 900px), (pointer: coarse) and (max-width: 1100px) {
    #hud { padding:5px 7px; gap:5px; }
    .stat { font-size:11px; padding:4px 7px; }
    .stat b { font-size:13px; }
    #hud button { padding:7px 9px; font-size:12px; min-height:38px; }
    #hint { display:none; }
    #preview { display:none; }
    #wrap { flex-direction:column; }
  #side {
      width:100%; border-left:none; border-top:2px solid #8a6a2f;
      max-height:46vh; flex-shrink:0;
    }
    #canvasBox { flex:1; min-height:34vh; }
    #shop { max-height:26vh; }
    #detail { max-height:34vh; min-height:0; }
    .card { padding:9px 7px; }
    .card canvas { width:40px; height:40px; }
    .pbtn { padding:12px 8px; font-size:14px; }   /* 触控热区 ≥44px */
    #overlay .box { padding:22px 18px; max-width:94vw; }
    #overlay h1 { font-size:30px; letter-spacing:5px; }
    #overlay p { font-size:13px; }
    .statGrid { grid-template-columns:1fr; }
    #relicCards { flex-direction:column; }
    #mobileBar {
      display:flex; gap:5px; padding:5px 7px; overflow-x:auto; flex-shrink:0;
      background:#150e06; border-top:1px solid #6b5426;
    }
    #mobileBar button {
      flex:0 0 auto; min-width:58px; min-height:46px; font-family:inherit; font-size:12px; cursor:pointer;
      color:#f3e9d2; background:linear-gradient(180deg,#3a2a14,#1c1408);
      border:1px solid #6b5426; border-radius:7px; padding:5px 8px; line-height:1.35;
    }
    #mobileBar button.on { border-color:#ffd700; background:linear-gradient(180deg,#8a5212,#5a3410); }
    #mobileBar button small { display:block; font-size:10px; color:#ffd54a; }
  }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat">金币 <b id="gold">700</b></div>
    <div class="stat">生命 <b id="lives">25</b></div>
    <div class="stat">波次 <b id="wave">0/25</b></div>
    <div class="stat">击杀 <b id="kills">0</b></div>
    <div class="stat">连斩 <b id="streak">0</b></div>
    <div class="stat" id="envStat">天候 <b id="envTxt">🌞昼 ☀晴</b></div>
    <button id="nextWave">空格 下一波</button>
    <button id="speed">速度 1x</button>
    <button id="musicBtn">音乐 开</button>
    <button id="pauseBtn">P 暂停</button>
    <div class="stat" id="preview" style="max-width:260px">下一波 <b id="previewTxt">-</b></div>
    <span id="hint">1-9/0 建筑　Q技能　T目标　F升级/专精　D出售　P暂停</span>
    <div id="synergyLine"></div>
    <div id="envTip"></div>
  </div>
  <div id="wrap">
    <div id="canvasBox">
      <canvas id="game" width="1200" height="720"></canvas>
      <div id="banner"></div>
      <div id="waveSummary"></div>
      <div id="pauseOverlay">已暂停 · 按 P 继续</div>
      <div id="cmdBar">
        <div id="moraleWrap">
          <div id="moraleLabel">士气</div>
          <div id="moraleBar"><i id="moraleFill"></i><span id="moraleTxt">30 / 120</span></div>
        </div>

const CELL=60, COLS=20, ROWS=12;

// ---- 高分屏自适应：等比缩放 + letterbox，避免拉伸变形与模糊 ----
const view={scale:1, ox:0, oy:0, dpr:1};
function resizeCanvas(){
  const box=canvas.parentElement;
  const cw=Math.max(320, box.clientWidth), ch=Math.max(240, box.clientHeight);
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  const s=Math.min(cw/W, ch/H);
  view.dpr=dpr; view.scale=s;
  view.ox=(cw-W*s)/2; view.oy=(ch-H*s)/2;
}
window.addEventListener('resize', ()=>{ resizeCanvas(); if(state!=='playing') requestAnimationFrame(draw); });

// ---- 双线路地图：南北两路在中路汇合，再共同奔向江东 ----
// ================= 地图：数据驱动的多战场 =================
// 每张图给出两条完整行军路线（格坐标），以及地形生成种子与配色。
// 路径长度不同天然改变难度，用 hpMul 做补偿；terrain 决定高地/密林/泥沼的分布。
const P=(x,y)=>({x,y});
const MAPS={
  jiangdong:{
    id:'jiangdong', name:'江东合流', short:'江东',
    desc:'南北双线于中路汇合直扑江东城 · 标准战场，路径最短、火力密度要求最高',
    lanes:{
      a:[P(-1,1),P(9,1),P(9,5),P(14,5),P(14,8),P(20,8)],
      b:[P(-1,10),P(9,10),P(9,5),P(14,5),P(14,8),P(20,8)]
    },
    seed:17, hpMul:1.00, hill:0.12, forest:0.10, marsh:0.10,
    grass:['#3f5c2a','#476a30','#3a5426'], soil:'#8a6a3a'
  },
  hulao:{
    id:'hulao', name:'虎牢蜿蜒', short:'虎牢',
    desc:'两条盘曲折返的长径，末段才汇合 · 路径更长，给了纵深布防的空间，敌军更硬',
    lanes:{
      a:[P(-1,1),P(5,1),P(5,6),P(10,6),P(10,2),P(15,2),P(15,8),P(20,8)],
      b:[P(-1,10),P(3,10),P(3,7),P(8,7),P(8,10),P(15,10),P(15,8),P(20,8)]
    },
    seed:53, hpMul:1.18, hill:0.16, forest:0.08, marsh:0.16,
    grass:['#4a4a28','#55552e','#414124'], soil:'#96794a'
  },
  changban:{
    id:'changban', name:'长坂螺旋', short:'长坂',
    desc:'双螺旋折返最长径 · 泥沼遍地、高地稀少，是耐力与经济的考验',
    lanes:{
      a:[P(-1,5),P(3,5),P(3,1),P(8,1),P(8,5),P(13,5),P(13,1),P(17,1),P(17,8),P(20,8)],
      b:[P(-1,11),P(2,11),P(2,8),P(7,8),P(7,11),P(12,11),P(12,8),P(17,8),P(20,8)]

function buildPolyline(wps){
  const points=wps.map(w=>({x:w.x*CELL+CELL/2,y:w.y*CELL+CELL/2}));
  const segLens=[]; let total=0;
  for(let i=1;i<points.length;i++){ const a=points[i-1],b=points[i],len=Math.hypot(b.x-a.x,b.y-a.y); segLens.push(len); total+=len; }
  return {points,segLens,total};
}
let PATHS={a:buildPolyline(MAPS.jiangdong.lanes.a), b:buildPolyline(MAPS.jiangdong.lanes.b)};
function posAt(lane,d){
  const P=PATHS[lane]; let x=d;
  for(let i=0;i<P.segLens.length;i++){
    if(x<=P.segLens[i]){ const t=x/P.segLens[i],a=P.points[i],b=P.points[i+1]; return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}; }
    x-=P.segLens[i];
  }
  return P.points[P.points.length-1];
}
function dirAt(lane,d){
  const P=PATHS[lane]; let x=d;
  for(let i=0;i<P.segLens.length;i++){
    if(x<=P.segLens[i]){ const a=P.points[i],b=P.points[i+1]; return {x:b.x-a.x,y:b.y-a.y}; }
    x-=P.segLens[i];
  }
  return {x:1,y:0};
}
function fillPathCells(wps,set){
  for(let i=0;i<wps.length-1;i++){
    const a=wps[i],b=wps[i+1];
    const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
    for(let c=x0;c<=x1;c++) for(let r=y0;r<=y1;r++) if(c>=0&&c<COLS&&r>=0&&r<ROWS) set.add(c+','+r);
  }
}
let pathSet=new Set();
let deco=[];

// ---------- 地形 ----------
// 高地/密林长在可建造格上（改变塔的属性）；泥沼长在土路上（改变敌军移动）。
// 每格三选一，互斥，由地图种子决定，同一张图每局一致，换图则整体改观。
const TERRAIN={
  plain: {id:'plain', name:'平地',  color:null,      desc:'无加成'},
  hill:  {id:'hill',  name:'高地',  color:'#9a8a4a', desc:'其上的塔 射程 ×1.18 · 伤害 ×1.08',  rangeMul:1.18, dmgMul:1.08},
  forest:{id:'forest',name:'密林',  color:'#2c4a2a', desc:'其上的塔 暴击 +14% · 射程 ×0.90，且敌军拆塔时不会优先选中', rangeMul:0.90, critAdd:0.14, cover:true},
  marsh: {id:'marsh', name:'泥沼',  color:'#4b4530', desc:'土路泥泞段 · 经过的敌军移速 ×0.72', speedMul:0.72}
};
let terrainGrid=[];          // terrainGrid[r][c] = 'plain'|'hill'|'forest'|'marsh'
function hash2(a,b,seed){
  let h=(a*73856093)^(b*19349663)^(seed*83492791);
  h=(h^(h>>>13))>>>0; h=(h*1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967296;
}
function terrainAt(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS) return 'plain';
  return (terrainGrid[r]&&terrainGrid[r][c])||'plain';
}
function terrainOfPoint(x,y){ return terrainAt(Math.floor(x/CELL), Math.floor(y/CELL)); }
function terrainCount(){
  const m={plain:0,hill:0,forest:0,marsh:0};
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) m[terrainAt(c,r)]++;
  return m;
}

function loadMap(id){
  if(!MAPS[id]) id='jiangdong';
  mapId=id; curMap=MAPS[id];
  PATHS={a:buildPolyline(curMap.lanes.a), b:buildPolyline(curMap.lanes.b)};
  pathSet=new Set();
  fillPathCells(curMap.lanes.a,pathSet); fillPathCells(curMap.lanes.b,pathSet);

  const sd=curMap.seed;
  terrainGrid=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      const onPath=pathSet.has(c+','+r);
      const n=hash2(c,r,sd);
      if(onPath) row.push(n<curMap.marsh?'marsh':'plain');
      else if(n<curMap.hill) row.push('hill');
      else if(n<curMap.hill+curMap.forest) row.push('forest');
      else row.push('plain');
    }
    terrainGrid.push(row);
  }
  // 装饰物：密林格加密植被，高地加岩石，让地形一眼可辨
  deco=[];
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    if(pathSet.has(c+','+r)) continue;
    const tr=terrainAt(c,r);
    if(tr==='forest'){
      deco.push({t:'tree',x:c*CELL+15,y:r*CELL+20});
      deco.push({t:'tree',x:c*CELL+42,y:r*CELL+42});
      deco.push({t:'bush',x:c*CELL+30,y:r*CELL+52});
      continue;
    }
    if(tr==='hill'){ deco.push({t:'rock',x:c*CELL+18,y:r*CELL+42}); deco.push({t:'rock',x:c*CELL+44,y:r*CELL+24}); continue; }
    const n=(c*17+r*11+sd)%9;
    if(n===0) deco.push({t:'tree',x:c*CELL+14,y:r*CELL+18});
    if(n===2) deco.push({t:'tree',x:c*CELL+46,y:r*CELL+44});
    if(n===4) deco.push({t:'rock',x:c*CELL+16,y:r*CELL+46});
    if(n===7) deco.push({t:'bush',x:c*CELL+44,y:r*CELL+14});
  }
}
loadMap('jiangdong');

const ICE_TOWERS=new Set(['ice']);
const THUNDER_TOWERS=new Set(['thunder']);

// 轮转序列按地图种子错开，所以三张图的天气节奏各不相同。
function envForWave(n){
  if(n<=3) return {weather:WEATHER.clear, night:false};
  const w=WEATHER[WEATHER_CYCLE[(Math.floor((n-4)/3)+curMap.seed)%WEATHER_CYCLE.length]];
  const night=Math.floor((n-4)/4)%2===1;
  return {weather:w, night:night};
}
// 返回本波环境是否发生了变化，交给 startWave 合并进同一条横幅（避免两条横幅互相覆盖）
function refreshEnv(){
  if(envLocked){ updateEnvHud(); return false; }
  const prev=env.weather&&env.weather.id, prevN=env.night;
  env=envForWave(wave);
  updateEnvHud();
  return (prev!==env.weather.id||prevN!==env.night);
}
function envLabel(){ return (env.night?'夜战·':'')+env.weather.icon+env.weather.name; }
function updateEnvHud(){
  const el=document.getElementById('envTxt'); if(!el) return;
  el.textContent=(env.night?'🌙夜 ':'🌞昼 ')+env.weather.icon+env.weather.name;
  el.title=env.weather.tip;

}
// 环境对某座塔各维度的合成系数
function envRangeMul(){ return (env.weather.rangeMul||1)*(env.night?NIGHT.rangeMul:1); }
function envRateMul(){ return (env.weather.rateMul||1); }
function envCritAdd(){ return (env.weather.critAdd||0)+(env.night?NIGHT.critAdd:0); }
function envDmgMul(key){
  let m=env.weather.dmgMul||1;
  if(FIRE_TOWERS.has(key)) m*=env.weather.fireMul||1;
  if(ICE_TOWERS.has(key)) m*=env.weather.iceMul||1;
  if(THUNDER_TOWERS.has(key)) m*=env.weather.thunderMul||1;
  return m;
}
function envEnemySpeedMul(){ return (env.weather.enemySpeedMul||1)*(env.night?NIGHT.enemySpeedMul:1)*META.speed; }

const TECH_BY_ID={}; TECH_TREE.forEach(b=>b.nodes.forEach(n=>{ n.branch=b.branch; n.color=b.color; TECH_BY_ID[n.id]=n; }));

function defaultMeta(){ return {renown:0, earned:0, tech:{}, ach:{}, mapWins:{}, runs:0, wins:0, kills:0, bestWave:0, save:null}; }
let meta=defaultMeta();
function loadMeta(){
  try{ const o=JSON.parse(localStorage.getItem(META_KEY)); if(o&&typeof o==='object') meta=Object.assign(defaultMeta(),o); }
  catch(e){ meta=defaultMeta(); }
  meta.tech=meta.tech||{}; meta.ach=meta.ach||{}; meta.mapWins=meta.mapWins||{};
  return meta;
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }
function techLv(id){ return meta.tech[id]||0; }
function techCost(id){ const n=TECH_BY_ID[id]; if(!n) return Infinity; const lv=techLv(id); return lv>=n.max?Infinity:n.cost(lv); }
function techLocked(id){
  const n=TECH_BY_ID[id]; if(!n||!n.req) return null;
  for(const k in n.req){ if(techLv(k)<n.req[k]) return TECH_BY_ID[k].name+' Lv.'+n.req[k]; }
  return null;
}
function buyTech(id){
  const n=TECH_BY_ID[id]; if(!n) return false;
  if(techLv(id)>=n.max || techLocked(id)) return false;
  const c=techCost(id); if(meta.renown<c) return false;
  meta.renown-=c; meta.tech[id]=techLv(id)+1; saveMeta(); computeMeta(); return true;
}
function refundTech(){   // 洗点：全额退还，鼓励玩家针对不同地图重构筑
  let back=0;
  for(const id in meta.tech){ const n=TECH_BY_ID[id]; if(!n) continue; for(let i=0;i<meta.tech[id];i++) back+=n.cost(i); }
  meta.renown+=back; meta.tech={}; saveMeta(); computeMeta(); return back;
}
// 把科技等级折算成一组乘区，战斗代码只读这个对象
let META={dmg:1,range:1,rate:1,crit:0,morale:0,cmdCd:1,heroCd:1,rally:0,gold:0,goldMul:1,farm:1,up:1,lives:0,heal:0,speed:1,relic:0};
function computeMeta(){
  const L=techLv;
  META={
    dmg:1+0.03*L('forge'), range:1+0.025*L('eagle'), rate:1+0.025*L('drill'), crit:0.015*L('pierce'),
    morale:12*L('banner'), cmdCd:1-0.06*L('edict'), heroCd:1-0.05*L('soul'), rally:1.2*L('diehard'),
    gold:70*L('treasury'), goldMul:1+0.04*L('tax'), farm:1+0.15*L('tuntian'), up:1-0.04*L('craft'),
    lives:2*L('wall'), heal:L('heal'), speed:1-0.02*L('resolve'), relic:L('fate'),
    fort:1+0.12*L('rampart'), fix:1-0.06*L('rampart')
  };
  return META;
}
// 声望结算：波次为主、击杀为辅，胜利与高评级给厚奖，难度/无尽有系数。
// 目的是让「打困难打到 20 波失败」也明显优于「简单模式躺赢」。
const GRADE_RENOWN={S:90, A:55, B:30, C:12, D:0};
function renownFor(win, finalWave, killCount, grade, diff, mode){
  const dm = diff==='hard'?1.45 : diff==='easy'?0.65 : 1;
  const mm = mode==='endless'?1.15:1;
  let v = finalWave*4 + killCount*0.35 + (win?130:0) + (GRADE_RENOWN[grade]||0);
  return Math.max(1, Math.round(v*dm*mm));
}

let synergy={dmgMul:1,cdMul:1,rateMul:1,fireMul:1,active:[]};

function cityPoint(){ return PATHS.a.points[PATHS.a.points.length-1]; }

function isBuildable(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS&&!pathSet.has(c+','+r); }
function cellCenter(c,r){ return {x:c*CELL+CELL/2,y:r*CELL+CELL/2}; }
function towerAt(c,r){ const p=cellCenter(c,r); return towers.find(t=>Math.abs(t.x-p.x)<CELL/2&&Math.abs(t.y-p.y)<CELL/2); }
// 无尽模式：超过战役终点后额外叠一层指数成长，越打越硬
function endlessMul(n){
  if(gameMode!=='endless') return 1;
  return Math.pow(1.055, Math.max(0, n-1));
}
function hpFor(type,n){ const e=ENEMY[type]; return Math.round(e.hp*Math.pow(e.boss?1.08:1.14,n-1)*DIFFICULTY[difficulty].hpMul*curMap.hpMul*endlessMul(n)); }
function shieldFor(type,n){ const e=ENEMY[type]; if(!e.shield) return 0; return Math.round(e.shield*Math.pow(1.12,n-1)*DIFFICULTY[difficulty].hpMul*curMap.hpMul*endlessMul(n)); }
function rewardFor(type,n){ return Math.round(ENEMY[type].reward*(1+0.07*(n-1))*RELIC.gold*META.goldMul); }

function globalDmgMul(t){
  let m = DEFS[t.key].cat==='hero' ? RELIC.dmg*synergy.dmgMul : RELIC.dmg;
  if(FIRE_KEYS.has(t.key)) m*=synergy.fireMul;      // 火攻之谋同时惠及建筑塔火塔
  return m;
}
function globalRateMul(t){ return DEFS[t.key].cat==='hero' ? RELIC.rate*synergy.rateMul : RELIC.rate; }

// ---- 鼓楼光环：覆盖范围内的所有攻击型塔，可叠加，直接进入属性管线 ----
function auraOn(t){
  if(!t || t.x==null) return {dmg:0, rate:0, n:0};
  let dmg=0, rate=0, n=0;
  for(const a of towers){
    const h=DEFS[a.key];
    if(h.kind!=='aura' || a===t) continue;
    if(Math.hypot(a.x-t.x, a.y-t.y) > rngOf(a)) continue;
    const sp=specOf(a);
    const lv=1+(a.level-1)*0.25;                       // 鼓楼升级放大光环
    dmg+=((sp&&sp.auraDmg)||h.aura.dmg)*lv;
    rate+=((sp&&sp.auraRate)||h.aura.rate)*lv;

// 塔脚下的地形（建塔时固化，卖掉重建才会变）
function terrainOf(t){ return TERRAIN[t.terrain||'plain']||TERRAIN.plain; }
function dmgOf(t){
  const base=DEFS[t.key].damage;
  let val = t.level>=4 ? base*Math.pow(1.58,3)*2.4 : base*Math.pow(1.58,t.level-1);
  const sp=specOf(t); if(sp&&sp.dmgMul) val*=sp.dmgMul;
  val*=globalDmgMul(t);
  val*=(1+auraOn(t).dmg);
  val*=(terrainOf(t).dmgMul||1);
  val*=envDmgMul(t.key);
  val*=rallyDmgMul();
  val*=META.dmg;
  return Math.round(val);
}
function rngOf(t){
  const base=DEFS[t.key].range;
  let val = t.level>=4 ? base*Math.pow(1.13,3)*1.4 : base*(1+0.13*(t.level-1));
  const sp=specOf(t); if(sp&&sp.rangeMul) val*=sp.rangeMul;
  if(DEFS[t.key].kind==='ranged') val*=RELIC.range;
  val*=(terrainOf(t).rangeMul||1);
  val*=envRangeMul();
  val*=META.range;
  return Math.round(val);
}
function rateOf(t){
  const sp=specOf(t); let r=DEFS[t.key].rate*globalRateMul(t);
  if(sp&&sp.rateMul) r*=sp.rateMul;
  r*=(1+auraOn(t).rate);
  r*=envRateMul();
  r*=rallyRateMul();
  r*=META.rate;
  return r;
}
// 暴击率 = 基础 + 地形（密林）+ 环境（雾/夜）
function critOf(t){ return CRIT_CHANCE+(terrainOf(t).critAdd||0)+envCritAdd()+META.crit; }
function upCost(t){ return Math.round((t.level>=3 ? DEFS[t.key].cost*2.4 : DEFS[t.key].cost*0.85*t.level)*META.up); }
function sellOf(t){ return Math.round(t.invested*0.7); }

/* ================= M5 · 攻城 / 护卫 / 择路 =================
   设计目标：让「摆满高台弓箭塔」这种一劳永逸的布阵失效。
   - 井阑会停下来拆掉威胁最大的那座塔（塔有耐久，会被打瘫、可花钱修复）
   - 虎卫贴着首领走，替首领分摊伤害，逼玩家先破阵
   - 斥候按火力密度选路，并在近处横向绕开威胁最高的塔
*/
let siegeShots=[], threat={a:[],b:[],aSum:0,bSum:0,t:0}, wreckWarnT=0;
const THREAT_STEP=44;             // 威胁采样步长（像素）

// 塔的“威胁值”＝理论 DPS；辅助塔按一个小常数计，免得井阑完全无视鼓楼粮仓
function threatOf(t){
  if(t.wreck) return 0;
  const k=DEFS[t.key].kind;
  if(k==='aura') return 60+t.level*24;
  if(k==='econ') return 24;
  return dmgOf(t)*rateOf(t);
}
// 每 0.4s 重算一次两条路的威胁分布：某点的威胁＝所有能打到它的塔的 DPS 之和
function computeThreat(){
  for(const lane of ['a','b']){
    const P=PATHS[lane], n=Math.max(2,Math.ceil(P.total/THREAT_STEP)), arr=[];
    let sum=0;
    for(let i=0;i<n;i++){
      const p=posAt(lane, i*THREAT_STEP);
      let v=0;
      for(const t of towers){
        if(t.wreck) continue;
        if(Math.hypot(t.x-p.x,t.y-p.y)<=rngOf(t)) v+=threatOf(t);
      }
      arr.push(v); sum+=v;
    }
    threat[lane]=arr; threat[lane==='a'?'aSum':'bSum']=Math.round(sum/n);
  }
  threat.t=gameTime;
}
function threatAt(lane,dist){
  const arr=threat[lane]; if(!arr||!arr.length) return 0;
  return arr[Math.max(0,Math.min(arr.length-1, Math.round(dist/THREAT_STEP)))]||0;
}
// 火力更薄的那条路（斥候/井阑出生时用）
function safestLane(){
  if(!threat.a.length) return Math.random()<0.5?'a':'b';
  // 差距太小就掷硬币，免得两条路一模一样时全挤一条；差距明显时才刻意避开火力
  const hi=Math.max(threat.aSum,threat.bSum);
  if(Math.abs(threat.aSum-threat.bSum) < Math.max(4, hi*0.15)) return Math.random()<0.5?'a':'b';
  return threat.aSum<threat.bSum?'a':'b';
}

// ---- 塔耐久 ----
function towerMaxHp(t){
  const h=DEFS[t.key];
  const base=110+h.cost*0.40+(h.kind==='econ'||h.kind==='aura'?0:20);
  return Math.round(base*(1+0.34*(t.level-1))*META.fort);
}
function refreshTowerHp(t, full){
  const old=t.maxHp||0, ratio=old>0?t.hp/old:1;
  t.maxHp=towerMaxHp(t);
  t.hp=full?t.maxHp:Math.min(t.maxHp, Math.max(1, Math.round(t.maxHp*ratio)));
}
function towerDown(t){ return !!t.wreck; }
function repairCost(t){
  if(t.wreck) return Math.round((DEFS[t.key].cost*0.5+40+t.level*22)*META.fix);
  const miss=1-t.hp/t.maxHp;
  return Math.max(1, Math.round(miss*(DEFS[t.key].cost*0.34+30)*META.fix));
}
function canRepair(t){ return t.wreck || t.hp<t.maxHp-0.5; }
function repairTower(t){

// 塔被打：先掉耐久 → 打瘫（停止工作）→ 继续挨打则彻底损毁
function damageTower(t, dmg, srcE){

// 井阑的选择：射程内威胁最大的塔（已瘫的不再理会，除非没别的目标）
function siegePick(e, r){
  let best=null, bv=-1;
  for(const t of towers){
    const d=Math.hypot(t.x-e.pos.x, t.y-e.pos.y);
    if(d>r) continue;
    if(t.immuneUntil>gameTime) continue;
    const v=(t.wreck?5:threatOf(t)+40)-d*0.05;
    if(v>bv){ bv=v; best=t; }
  }
  return best;
}
// 绕行：向远离最高威胁塔的方向做横向位移，最多 ±30px
function flankOffset(e, dt){
  let worst=null, wv=0;
  for(const t of towers){
    if(t.wreck) continue;
    const d=Math.hypot(t.x-e.pos.x,t.y-e.pos.y);
    if(d>rngOf(t)+40) continue;
    const v=threatOf(t)/Math.max(40,d);
    if(v>wv){ wv=v; worst=t; }
  }
  const dir=dirAt(e.lane, e.dist);
  const nx=-dir.y, ny=dir.x;                       // 路径法线
  let want=0;
  if(worst){
    const rel=(worst.x-e.pos.x)*nx+(worst.y-e.pos.y)*ny;
    want=(rel>0?-1:1)*30;
  }
  e.off=(e.off||0)+(want-(e.off||0))*Math.min(1,dt*1.8);
  return {nx,ny,off:e.off};
}
function skillDmg(t){ return Math.round(dmgOf(t)* (2.8 + Math.min(t.level,3)*0.7)); }
function skillCdOf(t){ return DEFS[t.key].skillCd*synergy.cdMul*RELIC.heroCd*META.heroCd; }

// ================= 主公技 · 君令 =================

function newStats(){
  return {goldEarned:0, goldSpent:0, towersBuilt:0, bestStreak:0, skillsCast:0,
          totalDamage:0, leaked:0, crits:0, grade:'-', finalWave:0, duration:0,
          cmdCast:0, cmdBy:{}, heroBuilt:0, bldBuilt:0, moraleGained:0, lifeRestored:0, barricadeBlocked:0, meteorHits:0};
}
function earn(n){ n=Math.round(n); gold+=n; stats.goldEarned+=n; }
function spend(n){ n=Math.round(n); gold-=n; stats.goldSpent+=n; }

function ensureAudio(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
}
function beep(freq, dur, type, vol, slide){
  if(!musicOn||!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur);
  g.gain.setValueAtTime(vol||0.06, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
function noise(dur, vol){
  if(!musicOn||!actx) return;
  const n=actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
  const d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource(); s.buffer=n;
  const g=actx.createGain(); g.gain.value=vol||0.08;
  s.connect(g); g.connect(actx.destination); s.start();
}
function sfx(k){
  if(k==='place') beep(220,0.12,'triangle',0.07,440);
  else if(k==='shoot') beep(880,0.05,'square',0.03);
  else if(k==='hit') { beep(180,0.06,'sawtooth',0.04); noise(0.05,0.04); }
  else if(k==='skill') { beep(392,0.2,'sawtooth',0.08,196); beep(523,0.25,'triangle',0.06); }
  else if(k==='die') beep(140,0.18,'sawtooth',0.05,60);
  else if(k==='wave') beep(330,0.15,'triangle',0.07,660);
  else if(k==='lose') beep(110,0.5,'sawtooth',0.08,55);
  else if(k==='relic') { beep(660,0.15,'triangle',0.08,880); setTimeout(()=>beep(880,0.2,'triangle',0.06),120); }
  else if(k==='win') { beep(523,0.2,'triangle',0.08); setTimeout(()=>beep(659,0.2,'triangle',0.08),160); setTimeout(()=>beep(784,0.35,'triangle',0.08),320); }
}
function startMusic(){
  ensureAudio();
  if(musicNodes) return;
  const master=actx.createGain(); master.gain.value=0.045; master.connect(actx.destination);
  const notes=[262,294,330,392,440,392,330,294,262,330,392,523,440,392,330,294];
  let step=0;
  const tick=()=>{
    if(!musicOn||state!=='playing'||paused||relicOpen) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.value=notes[step%notes.length];
    g.gain.setValueAtTime(0.9, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.38);
    o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+0.4);
    if(step%2===0){
      const b=actx.createOscillator(), bg=actx.createGain();
      b.type='sine'; b.frequency.value=notes[step%notes.length]/2;
      bg.gain.setValueAtTime(0.7, actx.currentTime);
      bg.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.28);
      b.connect(bg); bg.connect(master); b.start(); b.stop(actx.currentTime+0.3);
    }
    step++;
  };
  const id=setInterval(tick, 340);
  musicNodes={id, master};
  tick();
}
function stopMusic(){ if(musicNodes){ clearInterval(musicNodes.id); musicNodes=null; } }

// ---- 词缀：中后期为部分敌军附加词缀，制造难度梯度 ----
const AFFIXES={
  swift:  {id:'swift',  name:'疾行', color:'#7ecbff', spdMul:1.35, hpMul:0.9},
  hardy:  {id:'hardy',  name:'锐甲', color:'#c0c8d0', armor:0.28, spdMul:0.92},
  vital:  {id:'vital',  name:'雄壮', color:'#7CFF7C', hpMul:1.55, spdMul:0.9}
};
function affixFor(n,i){
  if(n<12) return null;
  const chance=Math.min(0.34, (n-11)*0.035);
  if(((i*7+n*13)%100)/100 >= chance) return null;
  const pool=n>=18?['swift','hardy','vital']:['swift','hardy'];
  return AFFIXES[pool[(i+n)%pool.length]];
}
// 每种新敌军的首次登场波次，决定难度梯度与"逼玩家换阵"的节奏
const DEBUT={raven:6, healer:8, bomber:11, splitter:13, stealth:15, regen:17, summoner:19, scout:9, guard:12, siege:14};
function buildWave(n){
  const q=[]; let gap=0;
  const count=Math.min(8+n*2, 60);
  for(let i=0;i<count;i++){
    let type='soldier';
    if(n>=3 && i%4===2) type='archer';
    if(n>=4 && i%5===1) type='cavalry';
    if(n>=5 && i%8===5) type='shieldman';
    if(n>=7 && i%6===3) type='heavy';
    if(n>=9 && i%9===2) type='assassin';
    if(n>=6 && i%7===4) type='kite';
    if(n>=10 && i%7===4) type='chariot';
    if(n>=8 && i%11===7) type='elite';
    if(n>=11 && i%9===6) type='treb';
    // ---- 扩展敌军：错开模数插入，避免与老敌军抢同一个坑 ----
    if(n>=DEBUT.raven    && i%6===0 && i>0) type='raven';
    if(n>=DEBUT.healer   && i%10===4) type='healer';
    if(n>=DEBUT.bomber   && i%8===3)  type='bomber';
    if(n>=DEBUT.splitter && i%9===8)  type='splitter';
    if(n>=DEBUT.stealth  && i%11===5) type='stealth';
    if(n>=DEBUT.regen    && i%12===9) type='regen';
    if(n>=DEBUT.summoner && i%13===11)type='summoner';
    if(n>=DEBUT.scout    && i%7===6)  type='scout';
    if(n>=DEBUT.guard    && i%10===9) type='guard';
    if(n>=DEBUT.siege    && i%14===12)type='siege';
    const lane=(i%2===0)?'a':'b';
    q.push({type,gap,lane,affix:affixFor(n,i)}); gap=Math.max(0.3, 0.56-n*0.008);
  }
  if(n>=21){ for(let i=0;i<Math.floor((n-19)*1.5);i++) q.push({type:'elite',gap:0.45,lane:i%2?'a':'b',affix:AFFIXES.hardy}); }
  if(n>=26){ for(let i=0;i<Math.floor((n-24)*1.2);i++) q.push({type:'regen',gap:0.4,lane:i%2?'b':'a',affix:AFFIXES.vital}); }
  if(gameMode==='endless'){
    // 无尽：每 5 波轮换一位 Boss，每 15 波多带一位
    if(n%5===0){
      const cyc=['boss','caocao','simayi'][Math.floor(n/5-1)%3];
      q.push({type:cyc,gap:0.8,lane:'a'});
      if(n%15===0) q.push({type:'caocao',gap:0.6,lane:'b'});
    }
    return q;
  }
  const finalW=FINAL_WAVE;
  if(n%5===0 && n!==finalW && n!==25) q.push({type:'boss',gap:0.7,lane:'a'});
  if(n===25){ q.push({type:'caocao',gap:0.6,lane:'b'}); q.push({type:'boss',gap:0.8,lane:'a'}); }
  if(n===finalW){ q.push({type:'simayi',gap:0.8,lane:'a'}); q.push({type:'caocao',gap:0.6,lane:'b'}); }
  return q;
}
function startWave(){
  const envChanged=refreshEnv();
  waveActive=true; spawnQueue=buildWave(wave); spawnTimer=0; sfx('wave');
  waveTotal=spawnQueue.length; waveSpawned=0;
  waveStartKills=kills; waveStartGold=gold; waveStartLives=lives;
  const names={3:'弓兵来袭',4:'铁骑冲阵',5:'盾卫压阵',6:'鸦兵越野',7:'重甲压境',8:'医官随军',9:'刺客潜行',
    10:'战车碾来',11:'爆破兵冲阵',13:'鬼兵分裂',15:'吕布出阵 · 潜行者',17:'玄甲回盾',19:'妖道召兵',
    20:'吕布再临',25:'曹操亲征',30:'司马懿 · 终局'};
  showBanner('第 '+wave+' 波'+(names[wave]?' · '+names[wave]:'')
    +(envChanged?('　【天候转变 '+envLabel()+'】'+env.weather.tip):''));
  if(envChanged){ sfx('skill'); shake=Math.min(shake+3,10); }
  updateHud(); updatePreview();
}
function updatePreview(){
  const el=document.getElementById('previewTxt'); if(!el) return;
  if(waveActive || (gameMode==='campaign' && wave>FINAL_WAVE)){ el.textContent='战斗中'; return; }
  const q=buildWave(wave), counts={}, order=[];
  for(const s of q){ if(!counts[s.type]){ counts[s.type]=0; order.push(s.type); } counts[s.type]++; }
  el.textContent=order.map(t=>ENEMY[t].name+'×'+counts[t]).join(' ');
}
function onWaveClear(){
  waveActive=false;
  gainMorale(MORALE_PER_WAVE);
  const cleared=wave;
  const earnedGold=25+wave*6;
  earn(earnedGold);
  // ---- 粮仓产出：按等级放大，计入结算统计 ----
  let farm=0;
  for(const t of towers){
    const h=DEFS[t.key]; if(!h.income) continue;
    if(t.wreck){ addNum({x:t.x,y:t.y-16},'停产','#ff8a5a'); continue; }   // 被打瘫的粮仓不产出
    const sp=specOf(t);
    const base=(sp&&sp.income)||h.income;
    const g=Math.round(base*(1+(t.level-1)*0.45)*META.farm);
    farm+=g; t.produced=(t.produced||0)+g;
    addNum({x:t.x,y:t.y-16}, '+'+g, '#ffd700');
  }
  if(farm){ earn(farm); stats.farmGold=(stats.farmGold||0)+farm; }
  // ---- 军府·医官署：每清 5 波回血，让长局不再是单向掉血 ----
  if(META.heal>0 && cleared%5===0){
    lives+=META.heal; stats.healed=(stats.healed||0)+META.heal;
    showBanner('医官署 · 恢复 '+META.heal+' 点生命');
    addNum(cityPoint(), '+'+META.heal+'♥', '#7fe08a');
  }
  lastClearWeather=env.weather.id;
  const dKills=kills-waveStartKills, dLives=waveStartLives-lives, dGold=(gold-waveStartGold);
  showSummary('第 '+cleared+' 波战报<br>击杀 <b>'+dKills+'</b> · 吸金 <b>+'+dGold+'</b>'
    +(farm?'（粮仓 +'+farm+'）':'')+'<br>掉血 <b>'+dLives+'</b>');
  wave++;
  streak=0;
  updateHud();
  if(gameMode==='campaign' && wave>FINAL_WAVE){ endGame(true); return; }
  waveDelay=2.4;
  updatePreview();
  checkAch(false, null);
  snapshotRun();
  // 无尽模式每 5 波都给遗物，避免后期强度断层
  if(cleared%5===0 && (gameMode==='endless' || cleared<FINAL_WAVE)) openRelicDraft();
}

function openRelicDraft(){
  let pool=RELIC_POOL.filter(r=>!relicsPicked.includes(r.id));
  // 无尽模式池子抽空后允许重复叠加，保证后期仍有成长
  if(pool.length<3 && gameMode==='endless') pool=pool.concat(RELIC_POOL.filter(r=>r.id!=='hearts'||true));
  const pick=[]; const src=pool.slice();
  while(pick.length<3 && src.length){ pick.push(src.splice(Math.floor(Math.random()*src.length),1)[0]); }
  if(pick.length===0) return;
  relicOpen=true;
  const box=document.getElementById('relicCards');
  box.innerHTML=pick.map(r=>'<div class="relicCard" data-id="'+r.id+'"><div class="rn">'+r.name+'</div><div class="rd">'+r.desc+'</div></div>').join('');
  box.querySelectorAll('.relicCard').forEach(el=>el.onclick=()=>chooseRelic(el.dataset.id));
  document.getElementById('relicModal').style.display='flex';
}
function chooseRelic(id){
  if(!RELIC_POOL.some(r=>r.id===id)) return;
  relicsPicked.push(id);
  if(id==='hearts') lives+=4;
  if(id==='harvest') earn(150);
  RELIC=relicMul();
  document.getElementById('relicModal').style.display='none';
  relicOpen=false; sfx('relic'); showBanner('获得遗物 · '+RELIC_POOL.find(r=>r.id===id).name);
  renderRelics(); updateHud();
}

function spawnEnemy(type,lane,affix,atDist){
  const t=ENEMY[type]; lane=lane||(Math.random()<0.5?'a':'b');
  // M5：斥候与攻城器械出生时挑火力薄弱的那条路
  if((t.flank||t.siege) && !atDist && towers.length) lane=safestLane();
  const sh=shieldFor(type,wave);
  const hp=hpFor(type,wave);
  const af=affix||null;
  const d0=atDist||0;
  const e={
    type, lane, dist:d0, pos:posAt(lane,d0),
    hp:hp*(af&&af.hpMul||1), maxHp:hp*(af&&af.hpMul||1), shield:sh, maxShield:sh,
    speed:t.speed*(af&&af.spdMul||1), reward:Math.round(rewardFor(type,wave)*(af?1.5:1)),
    radius:t.radius, boss:!!t.boss, fly:!!t.fly, affix:af, armor:(af&&af.armor)||0,
    dash:!!t.dash, dashT:1.5+Math.random()*2, dashUntil:0,
    slowUntil:0, stunUntil:0, burnUntil:0, burnDps:0, rageUntil:0, bsT:6,
    dead:false, face:1, flash:0, kb:0, spawnT:0.35,
    // ---- 扩展行为状态 ----
    healT:Math.random()*1.5, summonT:3+Math.random()*2, regenT:0, lastHitAt:-99,
    stealthT:(t.stealth?t.stealth.off:0), hidden:false,
    poison:0, poisonT:0, charmUntil:0, charmVuln:0, charmImmuneUntil:0,
    phase:1, phaseLock:0, invulUntil:0
  };
  // 鸦兵：无视土路，从入口直线飞向江东城
  if(t.straight){
    const gy=PATHS[lane].points[0].y;
    e.straight=true;
    e.pos={x:-30, y:gy};
    e.target={x:W+30, y:cityPoint().y};
    e.total=Math.hypot(e.target.x-e.pos.x, e.target.y-e.pos.y);
  }
  enemies.push(e);
  if(e.boss){
    showBanner('⚔ ' + t.name + ' 登场 ⚔'); shake=Math.max(shake,12); addHitstop(0.12); sfx('skill');
    addRing(e.pos,'#ff2d55',180); burst(e.pos.x,e.pos.y,30,'#ff2d55',180,0.8);
    bossBar=e;
    if(t.phases) showBanner('⚔ ' + t.name + ' · 第一阶段 ⚔');
  }
  return e;
}

function acquire(t){
  const r=rngOf(t); const mode=t.targetMode||'first'; let best=null, bestVal=null;
  for(const e of enemies){
    if(e.dead) continue;
    if(e.hidden) continue;               // 潜行者隐身期间不可被锁定
    const dx=e.pos.x-t.x, dy=e.pos.y-t.y;
    if(dx*dx+dy*dy>r*r) continue;
    let val;
    if(mode==='last') val=-e.dist;
    else if(mode==='strong') val=e.maxHp;
    else if(mode==='weak') val=-e.hp;
    else val=e.dist;
    if(!best||val>bestVal){ best=e; bestVal=val; }
  }
  return best;
}
function cycleTarget(t){
  const i=TARGET_MODES.indexOf(t.targetMode||'first');
  t.targetMode=TARGET_MODES[(i+1)%TARGET_MODES.length];
  showBanner('目标模式: '+TARGET_LABEL[t.targetMode]);
  renderDetail();
}

function applyDmg(e, dmg, key, crit, ignoreShield, src, knock){
  if(e.dead || dmg<=0) return;
  if(e.invulUntil>gameTime){ addNum(e.pos,'免疫','#7ecbff'); return; }   // Boss 阶段转换无敌
  let d=dmg;
  // ---- M5 护卫结阵：虎卫替核心挡下一部分伤害，核心另有减伤 ----
  if(e.guards && e.guards.length){
    const g=e.guards.find(x=>!x.dead);
    if(g){
      const ed=ENEMY[g.type].escort;
      const part=d*ed.share;
      d=(d-part)*(1-ed.armor);
      applyDmg(g, part, key, false, ignoreShield, src);
      if(Math.random()<0.25) addNum(e.pos,'结阵','#ffd54a');
    }
  }
  // 护甲：词缀护甲减去毒泉"腐蚀"叠加的破甲层，下限 0
  const armorEff=Math.max(0, (e.armor||0) - (e.poisonArmor||0));
  if(armorEff) d*=(1-armorEff);
  if(e.charmUntil>gameTime && e.charmVuln) d*=(1+e.charmVuln);   // 惑中目标增伤
  e.lastHitAt=gameTime;                                          // 玄甲护盾再生的脱战计时
  if(e.shield>0){
    const eff=ignoreShield?d:d*0.5;
    if(eff>=e.shield){ d=ignoreShield?(eff-e.shield):((eff-e.shield)*2); e.shield=0;
      addRing(e.pos,'#7ecbff',e.radius+22); burst(e.pos.x,e.pos.y,10,'#7ecbff',110,0.4); }
    else { e.shield-=eff; d=0; }
  }
  e.hp-=d;
  stats.totalDamage+=Math.max(0,d);
  if(src){ src.dmgDealt=(src.dmgDealt||0)+Math.max(0,d); }
  // ---- 命中反馈：闪白 + 击退 + 数字 ----
  const shown=Math.round(d);
  if(shown>=1){
    e.flash=Math.max(e.flash||0, crit?0.22:0.13);
    if(knock){ e.dist=Math.max(0, e.dist-knock); e.kb=Math.max(e.kb||0, knock); }
    if(crit) addHitstop(e.boss?0.07:0.045);
    addNum(e.pos, crit?('暴击 '+shown):shown, crit?'#ff5252':'#ffe082', crit);
  }
  else if(e.shield>0) addNum(e.pos, '护', '#7ecbff');
  const def=DEFS[key];
  if(def&&def.slow){ e.slowUntil=gameTime+1.6; }
  if(def&&def.burn){ e.burnUntil=gameTime+2.4; e.burnDps=8+((def.burn)||6); }
  if(e.hp<=0){
    e.dead=true; earn(e.reward); kills++; streak++; streakT=2.5;
    if(ENEMY[e.type].siege) stats.siegeKills=(stats.siegeKills||0)+1;
    gainMorale(e.boss?MORALE_PER_BOSS:(ENEMY[e.type].hp>=400?MORALE_PER_ELITE:MORALE_PER_KILL));
    if(src) src.kills=(src.kills||0)+1;
    if(streak>stats.bestStreak) stats.bestStreak=streak;
    if(streak>=10 && streak%5===0){ const bonus=Math.floor(streak/5); earn(bonus); addNum(e.pos,'连斩 +'+bonus,'#ffd700'); }
    sfx('die'); shake=Math.min(shake+(e.boss?10:4), 16);
    if(e.boss) addHitstop(0.15); else if((ENEMY[e.type].hp||0)>=400) addHitstop(0.07);
    burst(e.pos.x,e.pos.y, e.boss?34:12, e.boss?'#d4af37':'#8a2020', e.boss?150:90, 0.55);
    burst(e.pos.x,e.pos.y, e.boss?18:6, '#ffd54a', e.boss?190:110, 0.4);
    if(e.boss){ addRing(e.pos,'#ffd54a',200); showBanner(ENEMY[e.type].name+' 授首'); }
    // 鬼兵：死亡分裂为小鬼，从死亡处继续前进
    const sd=ENEMY[e.type].split;
    if(sd && !e.noSplit){
      stats.splits=(stats.splits||0)+1;
      for(let i=0;i<sd.n;i++){
        const c=spawnEnemy(sd.type, e.lane, e.affix, Math.max(0, e.dist-14-i*18));
        c.noSplit=true;
      }
      addRing(e.pos,'#a06ad0',70); burst(e.pos.x,e.pos.y,16,'#a06ad0',130,0.5);
    }
  }
}
function splash(origin, dmg, radius, key, ignoreShield, src){
  for(const e of enemies){
    if(e.dead) continue;
    if(Math.hypot(e.pos.x-origin.x, e.pos.y-origin.y)<=radius) applyDmg(e, Math.round(dmg), key, false, ignoreShield, src);
  }
}
function addNum(pos,val,color,big){
  numbers.push({x:pos.x+(Math.random()*18-9),y:pos.y-20,val,color,life:0.85,max:0.85,
    vx:(Math.random()*30-15), vy:-58-Math.random()*22, big:!!big});
}
function addRing(pos,color,maxR){ rings.push({x:pos.x,y:pos.y,r:8,maxR:maxR||30,life:0.45,color}); }
function burst(x,y,n,col,spd,life){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(spd||80)*(0.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:life||0.45,max:life||0.45,col,sz:2+Math.random()*3});
  }
}
// 方向性命中火花：沿冲击方向 ang 喷一束锥形火星，命中读作"迸溅"而非一团雾
function sparks(x,y,ang,n,col,spd,spread){
  const sp=spread==null?0.6:spread;
  for(let i=0;i<n;i++){
    const a=ang+(Math.random()*2-1)*sp, s=(spd||220)*(0.45+Math.random()*0.9);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:0.20+Math.random()*0.18,max:0.4,col,sz:1+Math.random()*2});
  }
}

// ---- 毒泉：可叠加的中毒层，每层持续伤害；"腐蚀"专精额外叠加破甲 ----
function applyPoison(src, e){
  if(!src||e.dead) return;
  const sp=specOf(src);
  const max=(sp&&sp.poisonMax)||5;
  const perDps=(sp&&sp.poisonDps)||1.2;
  e.poison=Math.min(max, (e.poison||0)+1);
  e.poisonT=gameTime+4.5;
  e.poisonDps=e.poison*perDps*Math.max(1,dmgOf(src)*0.32);
  e.poisonSrc=src;
  if(sp&&sp.poisonArmor) e.poisonArmor=Math.min(0.5, e.poison*sp.poisonArmor);
  if(e.poison===max) addNum(e.pos,'毒'+e.poison,'#8aff6a');
}
// ---- 貂蝉：魅惑，命中概率使敌人沿路径倒退 ----
function applyCharm(src, e){
  if(!src||e.dead||e.boss) return;
  const sp=specOf(src);
  const pct=(sp&&sp.charmPct)||0.25;
  const vuln=(sp&&sp.charmVuln)||0;
  const targets=(sp&&sp.charmAoe)
    ? enemies.filter(x=>!x.dead&&!x.boss&&Math.hypot(x.pos.x-e.pos.x,x.pos.y-e.pos.y)<=sp.charmAoe)
    : [e];
  for(const x of targets){
    // 递减抗性：一次魅惑结束后 3.2s 内免疫，避免堆貂蝉把敌人永久锁在出生点
    if(x.charmImmuneUntil>gameTime) continue;
    if(Math.random()>=pct) continue;
    x.charmUntil=gameTime+2.2;
    x.charmImmuneUntil=gameTime+2.2+3.2;
    x.charmVuln=vuln;
    addNum(x.pos,'惑','#ff9ad0');
    burst(x.pos.x,x.pos.y,5,'#ff9ad0',70,0.35);
    stats.charms=(stats.charms||0)+1;
  }
}
// ---- 周瑜：落点留下持续燃烧的地面区域 ----
function dropGround(src, pos){
  if(!src) return;
  const sp=specOf(src);
  const rMul=(sp&&sp.groundR)||1, lMul=(sp&&sp.groundLife)||1, dMul=(sp&&sp.groundDmg)||1;
  // 同点已有火海则续期，避免刷屏
  for(const g of grounds){
    if(Math.hypot(g.x-pos.x,g.y-pos.y)<40*rMul){ g.life=Math.max(g.life, 3.0*lMul); return; }
  }
  grounds.push({x:pos.x,y:pos.y,r:62*rMul,life:3.0*lMul,max:3.0*lMul,tick:0,
    dmg:Math.round(dmgOf(src)*0.11*dMul),key:src.key,src,col:'#ff6a00'});
}

const CRIT_CHANCE=0.10, CRIT_MUL=2.0;
function rollCrit(t){ return Math.random()<(t?critOf(t):CRIT_CHANCE); }
function attack(t, target){
  const h=DEFS[t.key], sp=specOf(t);
  const crit=rollCrit(t);
  const dmg=Math.round(dmgOf(t)*(crit?CRIT_MUL:1));
  if(crit) stats.crits++;
  const ignoreShield=!!(sp&&sp.shieldBreak);
  const kb=h.knock||(h.kind==='melee'?7:4);
  t.anim=1; t.aim=Math.atan2(target.pos.y-t.y,target.pos.x-t.x);
  t.face=target.pos.x>=t.x?1:-1;
  t.shots=(t.shots||0)+1;
  sfx('shoot');
  // ---- 孙尚香：直线贯穿，不走投射物 ----
  if(h.line){
    t.flashT=0.12;
    lineShot(t, t.aim, dmg, false);
    return;
  }
  // ---- 雷台：连锁闪电，逐跳衰减 ----
  if(h.chain){
    t.flashT=0.12;
    const maxHops=(sp&&sp.chain)||h.chain;
    const fall=(sp&&sp.chainFall)||h.chainFall;
    const hit=new Set(); let cur=target, cd=dmg, from={x:t.x,y:t.y-12};
    for(let i=0;i<maxHops && cur;i++){
      hit.add(cur);
      applyDmg(cur, Math.round(cd), t.key, i===0&&crit, ignoreShield, t, kb);
      bolts.push({x1:from.x,y1:from.y,x2:cur.pos.x,y2:cur.pos.y,life:0.2,max:0.2});
      burst(cur.pos.x,cur.pos.y,5,'#9ad0ff',90,0.28);
      from={x:cur.pos.x,y:cur.pos.y};
      cd*=fall;
      let next=null, nd=1e9;
      for(const e of enemies){
        if(e.dead||e.hidden||hit.has(e)) continue;
        const d=Math.hypot(e.pos.x-from.x, e.pos.y-from.y);
        if(d<nd && d<=130){ nd=d; next=e; }
      }
      cur=next;
    }
    t.chainHits=(t.chainHits||0)+hit.size;
    return;
  }
  if(h.kind==='ranged'){
    // 枪口/箭口火光
    t.flashT=0.12;
    projectiles.push({x:t.x,y:t.y-10,target,speed:h.shot==='arrow'||h.shot==='bolt'?560:320,dmg,crit,
      splash:(sp&&sp.splash)||h.splash||0, splashPct:h.splashPct||0, splashMul:(sp&&sp.splashMul)||1,
      pierce:(sp&&sp.pierce)||0, ignoreShield, kind:h.shot,key:t.key,src:t,knock:kb,dead:false,
      poison:!!h.poison, charm:!!h.charm, ground:!!h.ground,
      trail:[]});
  } else {
    applyDmg(target,dmg,t.key,crit,ignoreShield,t,kb);
    swings.push({x:t.x,y:t.y,a:t.aim,kind:h.shot,life:0.28,color:h.color});
    burst(target.pos.x,target.pos.y,crit?11:5,h.color,crit?120:70,0.28);
    sparks(target.pos.x,target.pos.y-8, t.aim, crit?13:6, crit?'#fff0c0':'#ffe6a8', crit?320:220, crit?0.8:0.55);
    if(crit){ addRing(target.pos,'#ff5252',44); addRing(target.pos,'#fff2c0',24); shake=Math.min(shake+2.5,14);
      parts.push({x:target.pos.x,y:target.pos.y-8,vx:0,vy:0,life:0.11,max:0.11,col:'#ffffff',sz:7}); }
    const splashR=(sp&&sp.splash)||h.splash, splashMul=(sp&&sp.splashMul)||1;
    if(splashR) splash(target.pos, dmg*h.splashPct*splashMul, splashR*splashMul, t.key, ignoreShield, t);
    if(h.shot==='roar') addRing(t,h.color,90);
    if(h.multi){
      const r=rngOf(t);
      const extra=1+((sp&&sp.multiExtra)||0);
      const oth=enemies.filter(e=>!e.dead&&e!==target&&Math.hypot(e.pos.x-t.x,e.pos.y-t.y)<=r).slice(0,extra);
      for(const o of oth) applyDmg(o, Math.round(dmg*0.65), t.key,false,ignoreShield,t,kb*0.6);
    }
  }
}

      lineShot(t, ang, Math.round(sd*0.5), true);

// ---- 直线贯穿：沿角度扫描一条带宽 26 的射线，命中沿途全部敌人 ----
function lineBestAngle(t){
  let best=0, bestN=-1;
  for(let a=0;a<Math.PI*2;a+=Math.PI/18){
    let n=0;
    for(const e of enemies){
      if(e.dead||e.hidden) continue;
      const dx=e.pos.x-t.x, dy=e.pos.y-t.y, d=Math.hypot(dx,dy);
      if(d>rngOf(t)*1.4) continue;
      const off=Math.abs(Math.sin(Math.atan2(dy,dx)-a))*d;
      if(off<30) n++;
    }
    if(n>bestN){ bestN=n; best=a; }
  }
  return best;
}
function lineShot(t, ang, dmg, isSkill){
  const sp=specOf(t);
  const flat=!!(sp&&sp.lineFlat), pierceShield=!!(sp&&sp.shieldBreak);
  const len=rngOf(t)*1.35;
  const hits=[];
  for(const e of enemies){
    if(e.dead||e.hidden) continue;
    const dx=e.pos.x-t.x, dy=e.pos.y-t.y, d=Math.hypot(dx,dy);
    if(d>len) continue;
    const proj=dx*Math.cos(ang)+dy*Math.sin(ang);
    if(proj<0) continue;
    const off=Math.abs(-dx*Math.sin(ang)+dy*Math.cos(ang));
    if(off>26+e.radius*0.5) continue;
    hits.push({e,d});
  }
  hits.sort((a,b)=>a.d-b.d);
  hits.forEach((h,i)=>{
    const fall=flat?1:Math.pow(0.86,i);
    applyDmg(h.e, Math.round(dmg*fall), t.key, false, pierceShield, t, 5);
    burst(h.e.pos.x,h.e.pos.y,5,'#ff9ab0',80,0.3);
  });
  beams.push({x:t.x,y:t.y-8,a:ang,len,life:isSkill?0.35:0.22,max:isSkill?0.35:0.22,
    col:isSkill?'#ff6a8a':'#ffd0dc', w:isSkill?9:5});
  return hits.length;
}

// ---- 三阶段 Boss：司马懿 ----
// P1 龟甲阵（回盾 + 召虎贲）→ P2 鹰视狼顾（瞬移突进 + 隐身）→ P3 冢虎（狂暴光环 + 吸血 + 召精锐）
const BOSS_PHASES=[
  {at:1.00, name:'龟甲阵',   color:'#7ecbff', cd:6.5},
  {at:0.66, name:'鹰视狼顾', color:'#8a5cff', cd:5.0},
  {at:0.33, name:'冢虎',     color:'#ff2d55', cd:3.6}
];
function updateBossPhases(e, dt){
  if(e.phaseLock>0){ e.phaseLock-=dt; if(e.phaseLock<=0){ e.invulUntil=0; } }
  const r=e.hp/e.maxHp;
  let want=1;
  for(let i=0;i<BOSS_PHASES.length;i++) if(r<=BOSS_PHASES[i].at) want=i+1;
  if(want>e.phase){
    e.phase=want;
    const ph=BOSS_PHASES[want-1];
    // 阶段转换演出：短暂无敌 + 定身 + 全屏震动 + 多重冲击环
    e.phaseLock=1.5; e.invulUntil=gameTime+1.5; e.stunUntil=gameTime+1.2;
    e.bsT=0.9;
    e.speed*=1.22;
    stats.bossPhases=Math.max(stats.bossPhases||0, want);
    showBanner('⚔ 司马懿 · 第'+['一','二','三'][want-1]+'阶段 · '+ph.name+' ⚔');
    shake=16; addHitstop(0.13); sfx('skill'); sfx('relic');
    for(let i=0;i<4;i++) setTimeout(()=>{ if(!e.dead){ addRing(e.pos, ph.color, 120+i*70); } }, i*110);
    burst(e.pos.x,e.pos.y,56,ph.color,240,1.0);
    burst(e.pos.x,e.pos.y,28,'#ffffff',300,0.7);
    if(want===2){ e.maxShield=Math.round(e.maxHp*0.14); e.shield=e.maxShield; }
    if(want===3){ e.maxShield=Math.round(e.maxHp*0.20); e.shield=e.maxShield; }
  }
}
function bossPhaseSkill(e){
  const ph=BOSS_PHASES[e.phase-1];
  e.bsT=ph.cd;
  if(e.phase===1){
    // 龟甲阵：回盾 + 召两名虎贲
    e.maxShield=Math.max(e.maxShield, Math.round(e.maxHp*0.12));
    e.shield=e.maxShield;
    for(let i=0;i<2;i++){ const c=spawnEnemy('elite', e.lane, null, Math.max(0,e.dist-30-i*30)); c.noSplit=true; }
    addRing(e.pos,'#7ecbff',170); burst(e.pos.x,e.pos.y,20,'#7ecbff',150,0.6);
  } else if(e.phase===2){
    // 鹰视狼顾：向前瞬移 + 短暂隐身 + 加速周围友军
    const jump=Math.min(150, PATHS[e.lane].total-e.dist-40);
    if(jump>0){
      burst(e.pos.x,e.pos.y,22,'#8a5cff',170,0.5);
      e.dist+=jump; e.pos=posAt(e.lane,e.dist);
      burst(e.pos.x,e.pos.y,22,'#8a5cff',170,0.5);
      addRing(e.pos,'#8a5cff',150);
    }
    e.hidden=true; setTimeout(()=>{ e.hidden=false; }, 900);
    for(const x of enemies){ if(!x.dead&&!x.boss&&Math.hypot(x.pos.x-e.pos.x,x.pos.y-e.pos.y)<220) x.rageUntil=gameTime+2.6; }
  } else {
    // 冢虎：狂暴全场 + 吸血自愈 + 召精锐
    for(const x of enemies){ if(!x.dead&&!x.boss) x.rageUntil=gameTime+3.2; }
    const heal=Math.round(e.maxHp*0.045);
    e.hp=Math.min(e.maxHp, e.hp+heal); addNum(e.pos,'+'+heal,'#ff5252');
    for(let i=0;i<2;i++){ const c=spawnEnemy('elite', i%2?'a':'b', AFFIXES.hardy); c.noSplit=true; }
    addRing(e.pos,'#ff2d55',240); burst(e.pos.x,e.pos.y,26,'#ff2d55',190,0.7);
  }
  sfx('skill');
}

function spawnAlly(t){

function update(dt){
  gameTime+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*18);
  if(streakT>0){ streakT-=dt; if(streakT<=0) streak=0; }
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) document.getElementById('banner').style.opacity=0; }
  if(summaryT>0){ summaryT-=dt; if(summaryT<=0) document.getElementById('waveSummary').style.opacity=0; }
  if(touchHintT>0){ touchHintT-=dt; if(touchHintT<=0){ const el=document.getElementById('touchHint'); if(el) el.style.opacity=0; } }
  synergy=computeSynergy(); updateSynergyLine();

  // ---- 主公技：冷却、集结余韵、火石、拒马 ----
  for(const c of COMMANDER){ if(cmdCd[c.id]>0) cmdCd[c.id]=Math.max(0,cmdCd[c.id]-dt); }
  if(rallyPulse>0) rallyPulse=Math.max(0,rallyPulse-dt*0.5);
  if(cityWave>0) cityWave=Math.max(0,cityWave-dt*0.8);
  for(const m of meteors){
    if(m.delay>0){ m.delay-=dt; continue; }
    if(m.fall>0){ m.fall-=dt; if(m.fall>0) continue;
      // 落地：范围伤害 + 冲击环 + 火星
      splash({x:m.tx,y:m.ty}, m.dmg, m.r, 'fire', false, null);
      stats.meteorHits=(stats.meteorHits||0)+1;
      addRing({x:m.tx,y:m.ty},'#ff9a3a',m.r+10);
      burst(m.tx,m.ty,10,'#ff7a2a',150,0.45); burst(m.tx,m.ty,5,'#ffe082',180,0.35);
      shake=Math.min(shake+1.6,16);
      m.done=true; continue; }
    m.done=true;
  }
  meteors=meteors.filter(m=>!m.done);
  for(const b of barricades){
    b.life-=dt;
    if(b.life<=0||b.hp<=0){ b.dead=true;
      addRing({x:b.x,y:b.y},'#b98a4a',60); burst(b.x,b.y,20,'#8a6a3a',140,0.6); }
  }
  barricades=barricades.filter(b=>!b.dead);

  if(!waveActive){ waveDelay-=dt; if(waveDelay<=0) startWave(); }
  else if(spawnQueue.length){
    spawnTimer-=dt;
    if(spawnTimer<=0){ const s=spawnQueue.shift(); spawnEnemy(s.type,s.lane,s.affix); waveSpawned++; spawnTimer=s.gap; }
  } else if(enemies.length===0) onWaveClear();

  // ---- M5：威胁图（供斥候择路、井阑挑塔）每 0.4s 重算 ----
  if(gameTime-threat.t>0.4) computeThreat();
  if(wreckWarnT>0) wreckWarnT-=dt;
  // ---- M5：每帧重建「核心 → 护卫」结阵关系 ----
  const cores=[];
  for(const e of enemies){
    if(e.dead) continue;
    const d=ENEMY[e.type];
    if(e.boss||d.heal||d.summon||d.siege){ e.guards=[]; cores.push(e); }
    else e.guards=null;
  }
  for(const e of enemies){
    const ed=ENEMY[e.type].escort;
    if(e.dead||!ed){ continue; }
    let best=null, bd=ed.r;
    for(const c of cores){
      if(c.lane!==e.lane) continue;
      const d=Math.abs(c.dist-e.dist);
      if(d<bd){ bd=d; best=c; }
    }
    e.core=best;
    if(best){ const i=best.guards.length; best.guards.push(e); e.slotL=(i%2?1:-1)*(22+Math.floor(i/2)*8); e.slotD=(i<2?20:-20); }
    else { e.slotL=0; e.slotD=0; }
  }
  // ---- M5：攻城弹道结算 ----
  for(const s of siegeShots){
    s.life-=dt;
    if(s.life<=0){
      s.done=true;
      if(towers.indexOf(s.t)>=0 && !s.src.dead) damageTower(s.t, s.dmg, s.src);
      burst(s.tx,s.ty,12,'#c98a4a',120,0.5); burst(s.tx,s.ty,6,'#ff8a00',150,0.35);
      addRing({x:s.tx,y:s.ty},'#ff8a5a',36); shake=Math.min(shake+2,14);
    }
  }
  siegeShots=siegeShots.filter(s=>!s.done);

  for(const e of enemies){
    if(e.dead) continue;
    if(e.flash>0) e.flash=Math.max(0,e.flash-dt*3.2);
    if(e.recoil>0) e.recoil=Math.max(0,e.recoil-dt*2.4);
    if(e.kb>0) e.kb=Math.max(0,e.kb-dt*40);
    if(e.spawnT>0) e.spawnT=Math.max(0,e.spawnT-dt);
    if(e.boss){
      if(ENEMY[e.type].phases) updateBossPhases(e, dt);
      e.bsT-=dt;
      if(e.bsT<=0){
        if(e.type==='boss'){
          e.bsT=7;
          for(const x of enemies){ if(!x.dead&&!x.boss&&Math.hypot(x.pos.x-e.pos.x,x.pos.y-e.pos.y)<190) x.rageUntil=gameTime+2.4; }
          addRing(e.pos,'#ff2d55',190); burst(e.pos.x,e.pos.y,16,'#ff2d55',130,0.55); sfx('skill');
        } else if(e.type==='caocao'){
          e.bsT=9;
          for(let i=0;i<2;i++) spawnEnemy('cavalry', Math.random()<0.5?'a':'b');
          addRing(e.pos,'#d4af37',150); burst(e.pos.x,e.pos.y,14,'#d4af37',120,0.5); sfx('skill');
        } else {
          bossPhaseSkill(e);
        }
      }
    }
    if(e.dash){
      e.dashT-=dt;
      if(e.dashT<=0){ e.dashT=3.4; e.dashUntil=gameTime+0.5; burst(e.pos.x,e.pos.y,6,'#c9a227',90,0.3); }
    }
    if(e.burnUntil>gameTime){
      e.burnAcc=(e.burnAcc||0)+e.burnDps*dt;
      if(e.burnAcc>=4){ applyDmg(e, Math.floor(e.burnAcc), null); e.burnAcc-=Math.floor(e.burnAcc); }
    }
    // ---- 中毒：按层数持续掉血，到期清空并解除破甲 ----
    if(e.poison>0){
      if(gameTime>e.poisonT){ e.poison=0; e.poisonArmor=0; }
      else {
        e.poisonAcc=(e.poisonAcc||0)+e.poisonDps*dt;
        if(e.poisonAcc>=3){ applyDmg(e, Math.floor(e.poisonAcc), null, false, false, e.poisonSrc); e.poisonAcc-=Math.floor(e.poisonAcc); }
      }
    }
    // ---- 医官：周期治疗周围友军（不治自己），带治疗光束 ----
    const def=ENEMY[e.type];
    if(def.heal){
      e.healT-=dt;
      if(e.healT<=0){
        e.healT=def.heal.cd;
        const amt=def.heal.amt*Math.pow(1.12, wave-1);
        let n=0;
        for(const x of enemies){
          if(x.dead||x===e||x.hp>=x.maxHp) continue;
          if(Math.hypot(x.pos.x-e.pos.x,x.pos.y-e.pos.y)>def.heal.r) continue;
          x.hp=Math.min(x.maxHp, x.hp+amt); n++;
          heals.push({x1:e.pos.x,y1:e.pos.y,x2:x.pos.x,y2:x.pos.y,life:0.4,max:0.4});
          addNum(x.pos,'+'+Math.round(amt),'#7CFF7C');
        }
        if(n) addRing(e.pos,'#7CFF7C',def.heal.r);
      }
    }
    // ---- 妖道：周期召唤小队 ----
    if(def.summon){
      e.summonT-=dt;
      if(e.summonT<=0){
        e.summonT=def.summon.cd;
        for(let i=0;i<def.summon.n;i++){
          const c=spawnEnemy(def.summon.type, e.lane, null, Math.max(0,e.dist-20-i*22));
          c.noSplit=true;
        }
        stats.summoned=(stats.summoned||0)+def.summon.n;
        addRing(e.pos,'#a06ad0',110); burst(e.pos.x,e.pos.y,14,'#a06ad0',120,0.5); sfx('skill');
      }
    }
    // ---- 玄甲：脱战 N 秒后护盾持续再生 ----
    if(def.shieldRegen && e.maxShield>0){
      if(gameTime-e.lastHitAt>def.shieldRegen.delay && e.shield<e.maxShield){
        e.shield=Math.min(e.maxShield, e.shield+def.shieldRegen.rate*dt);
        if(Math.random()<dt*6) burst(e.pos.x,e.pos.y,1,'#7ecbff',30,0.4);
      }
    }
    // ---- 潜行者：隐身/现形循环，隐身期间不可被锁定 ----
    if(def.stealth){
      e.stealthT-=dt;
      if(e.stealthT<=0){
        e.hidden=!e.hidden;
        e.stealthT=e.hidden?def.stealth.on:def.stealth.off;
        burst(e.pos.x,e.pos.y,10,'#8a5cff',100,0.4);
        addRing(e.pos,'#8a5cff',40);
      }
    }
    // ---- 爆破兵：接近终点或血量见底时自爆，震晕范围内的塔 ----
    if(def.bomb && !e.boomed){
      const near=PATHS[e.lane].total-e.dist < 150;
      if(near || e.hp<=e.maxHp*0.18){
        e.boomed=true; e.dead=true;
        stats.bombs=(stats.bombs||0)+1;
        let n=0;
        for(const t of towers){
          if(t.immuneUntil>gameTime) continue;
          if(Math.hypot(t.x-e.pos.x,t.y-e.pos.y)<=def.bomb.r){ t.disableUntil=gameTime+def.bomb.stun; n++; }
        }
        addRing(e.pos,'#ff8a00',def.bomb.r); burst(e.pos.x,e.pos.y,34,'#ff8a00',210,0.8);
        burst(e.pos.x,e.pos.y,18,'#ffe082',260,0.6);
        shake=Math.min(shake+9,16); sfx('lose');
        if(n) showBanner('爆破！'+n+' 座防御失能 '+def.bomb.stun.toFixed(1)+'s');
        continue;
      }
    }
    if(e.stunUntil>gameTime) continue;
    // 魅惑：沿路径倒退
    const charmed=e.charmUntil>gameTime;
    const terr=TERRAIN[terrainOfPoint(e.pos.x,e.pos.y)]||TERRAIN.plain;
    e.inMarsh=(terr.id==='marsh');
    // ---- M5 护卫结阵：虎卫调速贴住核心，掉队就加速追、跑过头就减速等 ----
    let escMul=1;
    if(e.core && !charmed){
      const want=e.core.dist+(e.slotD||0), diff=want-e.dist;
      escMul=Math.max(0.35, Math.min(1.85, 1+diff*0.02));
    }
    const sp=e.speed*(e.slowUntil>gameTime?0.48:1)*(e.rageUntil>gameTime?1.6:1)*(e.dashUntil>gameTime?2.1:1)*(charmed?-0.55:1)
              *escMul*envEnemySpeedMul()*(e.fly?1:(terr.speedMul||1));

    if(e.straight){
      // 鸦兵：无视土路，直飞江东城
      const dx=e.target.x-e.pos.x, dy=e.target.y-e.pos.y, d=Math.hypot(dx,dy)||1;
      e.pos={x:e.pos.x+dx/d*sp*dt, y:e.pos.y+dy/d*sp*dt};
      e.dist=e.total-d;
      e.face=dx<0?-1:1;
      if(d<=18){
        e.dead=true; lives-=1; streak=0; stats.leaked++;
        shake=Math.min(shake+6,16); sfx('lose');
        burst(e.pos.x,e.pos.y,14,'#ff2d55',120,0.6);
        if(lives<=0){ lives=0; endGame(false); return; }
      }
      continue;
    }

    // ---- 铁索拒马：同一条路上、正前方的路障会挡住非飞行敌军 ----
    let blocked=null;
    if(!e.fly && sp>0){
      for(const b of barricades){
        if(b.lane!==e.lane || b.hp<=0) continue;
        const gapNow=b.dist-e.dist;
        if(gapNow<=b.r && gapNow>-b.r){ blocked=b; break; }
      }
    }
    if(blocked){
      // 顶在拒马前：啃耐久、吃割伤、原地打转
      // 啃咬速度随敌军体量增长：后期的重甲/Boss 会更快撞碎路障，路障不会变成无脑万能解
      blocked.hp-=(16+e.maxHp*0.008)*(e.boss?6:1)*dt;
      e.barricadeAcc=(e.barricadeAcc||0)+ (20+3*wave)*dt;
      if(e.barricadeAcc>=5){ applyDmg(e, Math.floor(e.barricadeAcc), null); e.barricadeAcc-=Math.floor(e.barricadeAcc); }
      stats.barricadeBlocked=(stats.barricadeBlocked||0)+dt;
      e.dist=Math.min(e.dist, blocked.dist-blocked.r);
      e.pos=posAt(e.lane,e.dist);
      if(Math.random()<dt*7) burst(blocked.x,blocked.y,1,'#c9a227',60,0.35);
      continue;
    }
    // ---- M5 攻城：井阑/投石车停下来拆掉射程内威胁最大的塔 ----
    const sgd=def.siege;
    if(sgd && !charmed && towers.length){
      e.pickT=(e.pickT||0)-dt;
      const tgtGone=!e.siegeTarget || towers.indexOf(e.siegeTarget)<0
        || Math.hypot(e.siegeTarget.x-e.pos.x, e.siegeTarget.y-e.pos.y)>sgd.r
        || e.siegeTarget.immuneUntil>gameTime;
      if(e.pickT<=0 || tgtGone){ e.siegeTarget=siegePick(e,sgd.r); e.pickT=0.7; }
      if(e.siegeTarget){
        e.sieging=true;
        e.siegeTarget.underFireT=Math.max(e.siegeTarget.underFireT||0, 0.9);
        e.siegeCd=(e.siegeCd||0)-dt;
        if(e.siegeCd<=0){
          e.siegeCd=sgd.cd;
          const t=e.siegeTarget;
          const dmg=Math.round(sgd.dps*sgd.cd*(1+0.06*(wave-1))*DIFFICULTY[difficulty].hpMul*(e.affix?1.3:1));
          siegeShots.push({x:e.pos.x, y:e.pos.y-26, tx:t.x, ty:t.y-8, dmg, t:t, src:e, life:0.45, max:0.45});
          e.recoil=0.35; sfx('shoot');
          burst(e.pos.x,e.pos.y-26,5,'#c98a4a',80,0.3);
        }
        continue;      // 攻城期间原地不动
      }
      e.sieging=false;
    }
    e.dist=Math.max(0, e.dist+sp*dt);
    if(e.dist>=PATHS[e.lane].total){
      e.dead=true; lives-=e.boss?5:1; streak=0; stats.leaked++;
      shake=Math.min(shake+6,16); sfx('lose');
      burst(e.pos.x,e.pos.y,14,'#ff2d55',120,0.6);
      if(lives<=0){ lives=0; endGame(false); return; }
    } else {
      e.pos=posAt(e.lane,e.dist);
      const d=dirAt(e.lane,e.dist);
      // ---- M5 绕行 / 结阵横向站位 ----
      if(def.flank && !charmed) flankOffset(e,dt);
      else if(e.core) e.off=(e.off||0)+((e.slotL||0)-(e.off||0))*Math.min(1,dt*2.6);
      else if(e.off) e.off*=Math.max(0,1-dt*2);
      if(e.off) e.pos={x:e.pos.x - d.y*e.off, y:e.pos.y + d.x*e.off};
      e.face=(charmed? -d.x : d.x)<-1?-1:1;
    }
  }
  enemies=enemies.filter(e=>!e.dead);
  if(bossBar && (bossBar.dead || enemies.indexOf(bossBar)<0)) bossBar=enemies.find(e=>e.boss&&!e.dead)||null;

  for(const t of towers){
    if(t.anim>0) t.anim=Math.max(0,t.anim-dt*4);
    if(t.flashT>0) t.flashT=Math.max(0,t.flashT-dt);
    if(t.cdLeft>0) t.cdLeft=Math.max(0,t.cdLeft-dt);
    if(t.underFireT>0) t.underFireT=Math.max(0,t.underFireT-dt);
    if(t.hitFx>0) t.hitFx=Math.max(0,t.hitFx-dt*2.2);
    if(t.repairFx>0) t.repairFx=Math.max(0,t.repairFx-dt*1.4);
    if(t.wreck){                                   // 打瘫的塔完全停摆，只冒烟
      if(Math.random()<dt*9) parts.push({x:t.x+(Math.random()*22-11), y:t.y-6, vx:(Math.random()*12-6), vy:-26-Math.random()*20,
        life:0.9, max:0.9, col:'#6a6a6a', sz:2+Math.random()*2});
      continue;
    }
    const kind=DEFS[t.key].kind;
    if(kind==='aura'||kind==='econ') continue;      // 鼓楼/粮仓不参与攻击循环
    if(t.disableUntil>gameTime && !(t.immuneUntil>gameTime)) continue;   // 被爆破兵震晕；回天固城期间免疫
    t.cooldown-=dt;
    if(DEFS[t.key].spawn){
      const sp=specOf(t), spawnMul=(sp&&sp.spawnRateMul)||1;
      t.spawnT=(t.spawnT||0)-dt;
      if(t.spawnT<=0){ spawnAlly(t); t.spawnT=(2.8-t.level*0.3)/spawnMul; }
    }
    if(t.cooldown<=0){
      const target=acquire(t);
      if(target){ attack(t,target); t.cooldown=1/rateOf(t); }
      else t.cooldown=0.05;
    }
  }

  for(const a of allies){
    a.life-=dt;
    if(a.swing>0) a.swing=Math.max(0,a.swing-dt*3);
    let near=null, nd=9999;
    for(const e of enemies){
      if(e.dead||e.fly) continue;
      const d=Math.hypot(e.pos.x-a.x,e.pos.y-a.y);
      if(d<nd){ nd=d; near=e; }
    }
    if(near){
      a.face=near.pos.x>=a.x?1:-1;
      a.atkT=(a.atkT||0)-dt;
      if(nd<20){ if(a.atkT<=0){ applyDmg(near, a.dmg, 'barracks', false, false, a.src, 3); a.swing=0.25; a.atkT=0.45; } }
      else { a.x+=(near.pos.x-a.x)/nd*90*dt; a.y+=(near.pos.y-a.y)/nd*90*dt; }
    }
  }
  allies=allies.filter(a=>a.life>0);

  for(const p of projectiles){
    if(p.dead||p.target.dead){ p.dead=true; continue; }
    const dx=p.target.pos.x-p.x, dy=p.target.pos.y-8-p.y, d=Math.hypot(dx,dy), step=p.speed*dt;
    p.rot=Math.atan2(dy,dx);
    if(p.trail){ p.trail.push({x:p.x,y:p.y,l:0.22}); if(p.trail.length>7) p.trail.shift(); for(const q of p.trail) q.l-=dt; }
    if(d<=step+p.target.radius){
      if(p.dmg) applyDmg(p.target,p.dmg,p.key,p.crit,p.ignoreShield,p.src,p.knock);
      if(p.poison) applyPoison(p.src, p.target);
      if(p.charm) applyCharm(p.src, p.target);
      if(p.ground) dropGround(p.src, p.target.pos);
      addRing(p.target.pos, p.kind==='fire'?'#ff6a00':p.kind==='ice'?'#7ecbff':'#ffd54a', p.kind==='cannon'?70:28);
      burst(p.target.pos.x,p.target.pos.y, p.kind==='cannon'?18:p.kind==='fire'?12:7, p.kind==='ice'?'#a8e0ff':p.kind==='fire'?'#ff6a00':'#ffe082', 90, 0.32);
      // 方向性迸溅：弹道命中沿飞行方向甩出火星，暴击更炽更多
      sparks(p.target.pos.x,p.target.pos.y-8, p.rot||0, p.crit?12:6, p.kind==='ice'?'#dff2ff':p.kind==='fire'?'#ffb060':'#fff0c0', p.crit?300:210, p.crit?0.75:0.5);
      if(p.crit){ addRing(p.target.pos,'#ff5252',48); addRing(p.target.pos,'#fff2c0',26); shake=Math.min(shake+2.5,14);
        parts.push({x:p.target.pos.x,y:p.target.pos.y-8,vx:0,vy:0,life:0.11,max:0.11,col:'#ffffff',sz:7}); }
      if(p.kind==='cannon') shake=Math.min(shake+3,14);
      if(p.splash) splash(p.target.pos, p.dmg*p.splashPct*(p.splashMul||1), p.splash*(p.splashMul||1), p.key, p.ignoreShield, p.src);
      if(p.pierce>0){
        const hitId=p.target;
        const next=enemies.filter(e=>!e.dead&&e!==hitId&&Math.hypot(e.pos.x-hitId.pos.x,e.pos.y-hitId.pos.y)<=60).slice(0,p.pierce);
        for(const n of next) applyDmg(n, Math.round(p.dmg*0.8), p.key, false, p.ignoreShield, p.src, p.knock*0.6);
      }
      p.dead=true; sfx('hit');
    } else { p.x+=dx/d*step; p.y+=dy/d*step; }
  }
  projectiles=projectiles.filter(p=>!p.dead);

  for(const rain of rains){
    rain.life-=dt; rain.tick+=dt;
    if(rain.tick>=0.22){
      rain.tick=0;
      for(const e of enemies){
        if(!e.dead && Math.hypot(e.pos.x-rain.x,e.pos.y-rain.y)<=rain.r) applyDmg(e, rain.dmg, rain.key, false, false, rain.src);
      }
    }
  }
  rains=rains.filter(r=>r.life>0);
  // ---- 火海地带：周期结算区域伤害 ----
  for(const g of grounds){
    g.life-=dt; g.tick+=dt;
    if(g.tick>=0.35){
      g.tick=0;
      for(const e of enemies){
        if(!e.dead && Math.hypot(e.pos.x-g.x,e.pos.y-g.y)<=g.r){
          applyDmg(e, g.dmg, g.key, false, false, g.src);
          e.burnUntil=Math.max(e.burnUntil, gameTime+1.2); e.burnDps=Math.max(e.burnDps||0, g.dmg*0.7);
        }
      }
    }
    if(Math.random()<dt*22){
      parts.push({x:g.x+(Math.random()*2-1)*g.r, y:g.y+(Math.random()*2-1)*g.r*0.55,
        vx:0, vy:-40-Math.random()*40, life:0.5, max:0.5, col:'#ff8a00', sz:2+Math.random()*2});
    }
  }
  grounds=grounds.filter(g=>g.life>0);
  for(const b of bolts) b.life-=dt;
  bolts=bolts.filter(b=>b.life>0);
  for(const b of beams) b.life-=dt;
  beams=beams.filter(b=>b.life>0);
  for(const h of heals) h.life-=dt;
  heals=heals.filter(h=>h.life>0);
  for(const r of rings){ r.life-=dt; r.r+=(r.maxR-r.r)*dt*10; }
  rings=rings.filter(r=>r.life>0);
  for(const n of numbers){ n.life-=dt; n.x+=n.vx*dt; n.y+=n.vy*dt; n.vy+=115*dt; n.vx*=0.94; }
  numbers=numbers.filter(n=>n.life>0);
  for(const s of swings) s.life-=dt;
  swings=swings.filter(s=>s.life>0);
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; }
  parts=parts.filter(p=>p.life>0);
  updateHud();
}

function fmtTime(s){ const m=Math.floor(s/60), q=Math.floor(s%60); return m+'分'+(q<10?'0':'')+q+'秒'; }
function gradeOf(win,finalWave){
  if(gameMode==='endless'){
    const w=finalWave;
    if(w>=45) return 'S'; if(w>=32) return 'A'; if(w>=22) return 'B'; if(w>=12) return 'C'; return 'D';
  }
  const eff = (finalWave/FINAL_WAVE)*0.6 + (lives/Math.max(1,DIFFICULTY[difficulty].lives))*0.4;
