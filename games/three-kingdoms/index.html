/* ================= 稳定性：帧率 / 内存 采样 ================= */
const perfHud=document.createElement('div'); perfHud.id='perfHud'; document.body.appendChild(perfHud);
const PERF={frames:0, t0:performance.now(), fps:0, min:999, avg:0, samples:[], mem:0, worst:0, show:false, peakEnt:0};
function perfTick(){
  qFrame++;
  PERF.frames++;
  const now=performance.now(), dt=now-PERF.t0;
  if(dt>=1000){
    PERF.fps=Math.round(PERF.frames*1000/dt);
    PERF.samples.push(PERF.fps); if(PERF.samples.length>600) PERF.samples.shift();
    if(state==='playing'&&PERF.fps<PERF.min) PERF.min=PERF.fps;
    PERF.avg=Math.round(PERF.samples.reduce((a,b)=>a+b,0)/PERF.samples.length);
    if(performance.memory) PERF.mem=Math.round(performance.memory.usedJSHeapSize/1048576);
    const ent=enemies.length+towers.length+parts.length;
    if(ent>PERF.peakEnt) PERF.peakEnt=ent;
    PERF.frames=0; PERF.t0=now;
    if(PERF.show) perfHud.textContent=
      'FPS '+PERF.fps+'  平均 '+PERF.avg+'  最低 '+(PERF.min===999?'-':PERF.min)+
      '\n堆 '+PERF.mem+' MB   画质 '+QUAL.name+
      '\n敌 '+enemies.length+' 塔 '+towers.length+' 粒子 '+parts.length+'/'+QUAL.cap;
  }
}
window.addEventListener('keydown',e=>{
  if(e.key==='`'||e.key==='~'){ PERF.show=!PERF.show; perfHud.style.display=PERF.show?'block':'none'; }
});

const mBtn=document.getElementById('musicBtn');

const spBtn=document.getElementById('speed');
if(spBtn) spBtn.onclick=()=>{ SETTINGS.speed=SETTINGS.speed===1?2:SETTINGS.speed===2?3:1; speedMul=SETTINGS.speed; saveSettings(); syncSettingsUI(); };
speedMul=SETTINGS.speed;

// 开局：记录初始生命（BGM 强度用）+ 首次游玩自动拉起引导
const _startBtn=document.getElementById('startBtn');

_startBtn.onclick=function(ev){

// 首次进入页面：任意交互后淡入菜单 BGM
let musKick=false;
const kickMusic=()=>{ if(musKick) return; musKick=true; ensureAudio(); if(AU.ready){ AU.musicBus.gain.value=0; applyVolumes(); const tgt=AU.musicBus.gain.value; AU.musicBus.gain.value=0;
  AU.musicBus.gain.setValueAtTime(0.0001, AU.ctx.currentTime);
  AU.musicBus.gain.linearRampToValueAtTime(tgt, AU.ctx.currentTime+2.6); }
  startMusic(); };
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev, kickMusic, {once:true}));

// 关键节点音效补齐：漏怪 / 成就
const _pushAch=pushAchToast; pushAchToast=function(a){ sfx('ach'); return _pushAch(a); };
syncSettingsUI();

/* ---------- 主循环挂钩：帧率采样 · 菜单演出 · 震动开关 ---------- */
const _loop=loop;
loop=function(now){
  perfTick();

  drawMenuFx(now/1000);
  return _loop(now);
};

window.__game={

  get bonds(){ return {active:synergy.active.slice(), dmg:+synergy.dmgMul.toFixed(3),
      rate:+synergy.rateMul.toFixed(3), cd:+synergy.cdMul.toFixed(3), fire:+synergy.fireMul.toFixed(3)}; },
  get enemyTypes(){ const m={}; for(const e of enemies) m[e.type]=(m[e.type]||0)+1; return m; },

  envForWave:function(n){ const e=envForWave(n); return {weather:e.weather.id, night:e.night}; },

    if(lock!==undefined) envLocked=!!lock; updateEnvHud(); return true; },
  lockEnv:function(v){ envLocked=!!v; return envLocked; },
  get envLocked(){ return envLocked; },
  get towerTerrain(){ return towers.map(t=>({key:t.key, c:t.c, r:t.r, terrain:t.terrain,
      crit:+critOf(t).toFixed(3), range:rngOf(t), dmg:dmgOf(t)})); },
  get enemyMarsh(){ return enemies.filter(e=>e.inMarsh).length; },
  // ---- 第三轮：主公技 ----
  get morale(){ return morale; },
  get moraleMax(){ return MORALE_MAX; },
  setMorale:function(n){ morale=Math.max(0,Math.min(MORALE_MAX,n)); renderCmdBar(); return morale; },
  get commander(){ return COMMANDER.map(c=>({id:c.id, key:c.key, name:c.name, cost:c.cost, cdMax:c.cd,
      aim:!!c.aim, cd:+(cmdCd[c.id]||0).toFixed(2), ready:cmdReady(c)})); },
  get aiming(){ return aimSkill; },
  cast:function(id, x, y){
    const c=cmdOf(id); if(!c) return false;

  },
  trigger:function(id){ return triggerCommand(id); },
  get rally(){ return {active:rallyUntil>gameTime, left:+Math.max(0,rallyUntil-gameTime).toFixed(2),
      dmgMul:rallyDmgMul(), rateMul:rallyRateMul()}; },
  get barricades(){ return barricades.map(b=>({lane:b.lane, dist:Math.round(b.dist),
      hp:Math.round(b.hp), maxHp:b.maxHp, life:+b.life.toFixed(2), x:Math.round(b.x), y:Math.round(b.y)})); },
  get meteors(){ return meteors.length; },
  get towerImmune(){ return towers.filter(t=>t.immuneUntil>gameTime).length; },
  get towerDisabled(){ return towers.filter(t=>t.disableUntil>gameTime&&!(t.immuneUntil>gameTime)).length; },
  // 路径上一点的像素坐标，方便测试对准土路施放拒马
  pathPoint:function(lane,frac){ const P=PATHS[lane||'a']; return posAt(lane||'a', P.total*(frac==null?0.5:frac)); },
  // 未取整的原始状态，供精确的移动/速度断言
  get enemyRaw(){ return enemies.map(e=>({t:e.type, dist:e.dist, x:e.pos.x, y:e.pos.y,
      terr:terrainOfPoint(e.pos.x,e.pos.y), inMarsh:!!e.inMarsh, speed:e.speed,
      hp:e.hp, fly:!!e.fly, lane:e.lane})); },
  // 测试用：对第 i 个敌人（或指定类型）直接造成伤害，便于断言阶段转换等逻辑
  hurt:function(sel, amount, hitShield){
    const e = typeof sel==='number' ? enemies[sel] : enemies.find(x=>x.type===sel);
    if(!e) return null;
    applyDmg(e, amount, null, false, !hitShield);
    return {type:e.type, hp:Math.round(e.hp), shield:Math.round(e.shield), phase:e.phase, invul:e.invulUntil>gameTime};
  },
  setMode:function(m){ if(m==='campaign'||m==='endless'){ gameMode=m; return true; } return false; },
  setWave:function(n){ if(state==='playing'&&!waveActive){ wave=n; updateHud(); updatePreview(); return true; } return false; },
  previewWave:function(n){ const q=buildWave(n), c={}; for(const s of q) c[s.type]=(c[s.type]||0)+1; return c; },
  get view(){ return Object.assign({}, view, {cw:canvas.width, ch:canvas.height}); },
  get towerInfo(){ return towers.map(t=>({key:t.key, level:t.level, spec:t.spec,
      dmg:dmgOf(t), range:rngOf(t), rate:+rateOf(t).toFixed(2), dps:Math.round(dmgOf(t)*rateOf(t)),
      dealt:Math.round(t.dmgDealt||0), kills:t.kills||0, invested:t.invested})); },
  get mobile(){ return document.body.classList.contains('mobile'); },
  setGold:function(n){ gold=n; updateHud(); },

  togglePause,
  backToMenu,
