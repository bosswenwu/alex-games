/* ================= M6 美术层：统一光源 · 烘焙地表 · 有机地形 =================
   静态地表（草地纹理 / 地形团块 / 土路）一次性烘焙进离屏 canvas，
   每帧只 drawImage 一次；逐帧动的只剩云影、林间光斑、泥沼水面与天气。
   这样既能把细节堆到「像素级」，又不会每帧几万次 fillRect。 */
const LIGHT={x:-0.52,y:-0.85};        // 全局光照方向（左上打光），所有投影统一朝右下
function shadowLen(){ return env.night?2.1:1.35; }   // 夜里影子更长更软
function shadowAlpha(){ return env.night?0.30:0.42; }
// 确定性随机：同一张地图每次烘焙结果一致
function rnd(seed){ const x=Math.sin(seed*127.1+311.7)*43758.5453; return x-Math.floor(x); }
const GROUND_PAL={
  jiangdong:{base:'#3f5c2a', warm:'#5c7d38', cool:'#2c4520', tuft:'#79a94a', dry:'#8a9a4a', rim:'#c9e08a'},
  hulao:    {base:'#4a4a28', warm:'#6b6636', cool:'#33331c', tuft:'#8a8548', dry:'#a89a58', rim:'#e0d69a'},
  changban: {base:'#3a4a3e', warm:'#52665a', cool:'#28342c', tuft:'#6f8a74', dry:'#7d8a72', rim:'#b6cbb6'}
};
let groundCv=null, groundKey='';
const GSCALE=2;                      // 烘焙分辨率倍率，保证放大后依然锐利

function bakeGround(){
  const pal=GROUND_PAL[mapId]||GROUND_PAL.jiangdong;
  const cv=document.createElement('canvas');
  cv.width=W*GSCALE; cv.height=H*GSCALE;
  const g=cv.getContext('2d');
  g.scale(GSCALE,GSCALE);
  const sd=curMap.seed;

  // ---- 1. 底色 + 大块色斑，打破平铺感 ----
  g.fillStyle=pal.base; g.fillRect(0,0,W,H);
  for(let i=0;i<130;i++){
    const x=rnd(sd+i*3.1)*W, y=rnd(sd+i*7.7)*H, r=40+rnd(sd+i*1.3)*120;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, rnd(sd+i*5.5)<0.5?pal.warm:pal.cool);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=0.10+rnd(sd+i*2.2)*0.13; g.fillStyle=gr;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  g.globalAlpha=1;
  // ---- 2. 细颗粒噪点：纯色面也有材质 ----
  for(let i=0;i<5200;i++){
    const x=rnd(sd+i*1.7)*W, y=rnd(sd+i*9.1)*H;
    g.fillStyle=rnd(sd+i*3.3)<0.5?'rgba(255,255,255,0.030)':'rgba(0,0,0,0.045)';
    g.fillRect(x,y,1.2,1.2);
  }
  // ---- 3. 草簇：成丛生长（每丛 4~7 叶共根），而不是漫天散针 ----
  const onRoad=(x,y)=>{                       // 距任一路中心线 < 30px 视为路面，不长草
    for(const lane of ['a','b']){
      const P=PATHS[lane]; if(!P) continue;
      const pp=P.points;
      for(let i=1;i<pp.length;i++){
        const ax=pp[i-1].x, ay=pp[i-1].y, bx=pp[i].x, by=pp[i].y;
        const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1;
        let t=((x-ax)*dx+(y-ay)*dy)/L2; t=t<0?0:t>1?1:t;
        if(Math.hypot(x-(ax+dx*t), y-(ay+dy*t))<30) return true;
      }
    }
    return false;
  };
  for(let i=0;i<1500;i++){
    const x=rnd(sd+i*2.9)*W, y=rnd(sd+i*4.4)*H;
    const tr=terrainAt(Math.floor(x/CELL), Math.floor(y/CELL));
    if(tr==='marsh') continue;
    const dense=tr==='forest'?0.95:(tr==='hill'?0.35:0.72);
    if(rnd(sd+i*6.1)>dense) continue;
    const edge=onRoad(x,y);
    if(edge && rnd(sd+i*9.7)>0.35) continue;  // 路肩留少量杂草，路心不长
    const blades=3+Math.floor(rnd(sd+i*1.9)*4);
    const dry=rnd(sd+i*5.9)<0.24;
    for(let b=0;b<blades;b++){
      const bx=x+(rnd(sd+i*3.1+b*1.7)-0.5)*7, by=y+(rnd(sd+i*4.9+b*2.3)-0.5)*3.5;
      const h=4+rnd(sd+i*8.3+b*5.1)*(edge?4:7), lean=(rnd(sd+i*1.1+b*3.3)-0.5)*4.2;
      g.strokeStyle=dry?pal.dry:pal.tuft;
      g.globalAlpha=(0.20+rnd(sd+i*7.3+b)*0.26)*(edge?0.6:1);
      g.lineWidth=1; g.lineCap='round';
      g.beginPath(); g.moveTo(bx,by); g.quadraticCurveTo(bx+lean*0.45,by-h*0.62,bx+lean,by-h); g.stroke();
      if(b===0 && rnd(sd+i*3.7)<0.34){   // 迎光叶尖高光只给最外一叶
        g.strokeStyle=pal.rim; g.globalAlpha=0.16;
        g.beginPath(); g.moveTo(bx+lean*0.62,by-h*0.7); g.lineTo(bx+lean,by-h); g.stroke();
      }
    }
    // 丛根的环境光遮蔽，让草丛"扎在地里"
    g.globalAlpha=0.10; g.fillStyle='#000';
    g.beginPath(); g.ellipse(x,y+0.5,5.5,2,0,0,Math.PI*2); g.fill();
  }
  g.globalAlpha=1; g.lineCap='butt';

  bakeTerrainBlobs(g, pal, sd);      // 4. 有机地形团块
  bakeRoads(g, sd);                  // 5. 羽化边缘的土路

  // 6. 整体光照渐变：左上暖阳，右下沉影
  const sun=g.createLinearGradient(0,0,W,H);
  sun.addColorStop(0,'rgba(255,222,150,0.13)');
  sun.addColorStop(0.45,'rgba(255,196,100,0.04)');
  sun.addColorStop(1,'rgba(16,8,34,0.24)');
  g.fillStyle=sun; g.fillRect(0,0,W,H);

  groundCv=cv; groundKey=mapId+'_'+curMap.seed;
}
// 把地形格画成抖动的有机团块，边缘互相咬合，不再是"贴瓷砖"
function bakeTerrainBlobs(g, pal, sd){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const t=terrainAt(c,r); if(t!=='hill'&&t!=='forest') continue;
    const x=c*CELL, y=r*CELL, cx=x+CELL/2, cy=y+CELL/2;
    const N=11, pts=[];
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2, jitter=0.80+rnd(sd+c*31+r*17+i*3.7)*0.42;
      pts.push({x:cx+Math.cos(a)*CELL*0.62*jitter, y:cy+Math.sin(a)*CELL*0.55*jitter});
    }
    const path=()=>{ g.beginPath(); g.moveTo((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);
      for(let i=1;i<=N;i++){ const a=pts[i%N], b=pts[(i+1)%N];
        g.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2); } g.closePath(); };
    if(t==='hill'){
      g.save(); path(); g.clip();
      // 隆起的草坡：背光侧压暗、迎光冠部提亮，只有冠顶露出一点裸土
      g.fillStyle='rgba(24,20,8,.30)'; g.fillRect(x-CELL,y-CELL,CELL*3,CELL*3);
      g.fillStyle='rgba(96,120,52,.55)'; g.beginPath(); g.ellipse(cx+2,cy+3,CELL*0.60,CELL*0.52,0,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(126,150,64,.50)'; g.beginPath(); g.ellipse(cx-3,cy-4,CELL*0.48,CELL*0.38,0,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(168,182,96,.42)'; g.beginPath(); g.ellipse(cx-7,cy-9,CELL*0.32,CELL*0.22,0,0,Math.PI*2); g.fill();
      // 冠顶裸土（小、偏土黄、边缘羽化）
      const er=g.createRadialGradient(cx-8,cy-11,0,cx-8,cy-11,CELL*0.26);
      er.addColorStop(0,'rgba(178,158,104,.55)'); er.addColorStop(0.65,'rgba(150,132,84,.28)'); er.addColorStop(1,'rgba(150,132,84,0)');
      g.fillStyle=er; g.beginPath(); g.ellipse(cx-8,cy-11,CELL*0.26,CELL*0.17,0,0,Math.PI*2); g.fill();
      // 等高线：细、低对比
      g.strokeStyle='rgba(70,66,30,.16)'; g.lineWidth=1;
      for(let k=1;k<=2;k++){ g.beginPath(); g.ellipse(cx-k*3,cy-k*4,CELL*(0.26+k*0.15),CELL*(0.18+k*0.11),0,0,Math.PI*2); g.stroke(); }
      for(let i=0;i<22;i++){
        const px=x+rnd(sd+c*7+r*5+i)*CELL, py=y+rnd(sd+c*11+r*3+i*2)*CELL;
        g.fillStyle=rnd(sd+i*4.4)<0.5?'rgba(240,236,190,.16)':'rgba(40,36,14,.22)';
        g.fillRect(px,py,1.5,1.5);
      }
      g.restore();
      // 坡沿：迎光侧一条亮边，背光侧一条暗边，读作"高出来"而不是"挖下去"
      g.save(); g.globalAlpha=0.30; g.strokeStyle='rgba(238,244,180,1)'; g.lineWidth=1.6;
      g.translate(-1.5,-2); path(); g.stroke(); g.restore();
      g.save(); g.globalAlpha=0.26; g.strokeStyle='rgba(24,26,10,1)'; g.lineWidth=2.2;
      g.translate(2,3); path(); g.stroke(); g.restore();
    } else {
      g.save(); path(); g.clip();
      g.fillStyle='rgba(12,30,14,.55)'; g.fillRect(x-CELL,y-CELL,CELL*3,CELL*3);
      for(let i=0;i<9;i++){
        const px=x+rnd(sd+c*13+r*9+i*2.3)*CELL, py=y+rnd(sd+c*5+r*19+i*1.7)*CELL;
        const rr=10+rnd(sd+i*3.1)*12;
        g.fillStyle='rgba(20,54,24,.55)'; g.beginPath(); g.arc(px,py,rr,0,Math.PI*2); g.fill();
        g.fillStyle='rgba(46,92,40,.45)'; g.beginPath(); g.arc(px-rr*0.25,py-rr*0.3,rr*0.66,0,Math.PI*2); g.fill();
        g.fillStyle='rgba(96,150,70,.30)'; g.beginPath(); g.arc(px-rr*0.4,py-rr*0.45,rr*0.34,0,Math.PI*2); g.fill();
      }
      g.restore();
      g.strokeStyle='rgba(10,26,12,.40)'; g.lineWidth=2; path(); g.stroke();
    }
  }
}
function bakeRoads(g, sd){
  const soil=curMap.soil;
  for(const lane of ['a','b']){
    const pts=PATHS[lane].points;
    const stroke=(w,style,alpha,dash,dy)=>{
      g.save(); if(dy) g.translate(0,dy);
      g.globalAlpha=alpha; g.strokeStyle=style; g.lineWidth=w;
      g.lineJoin='round'; g.lineCap='round'; if(dash) g.setLineDash(dash);
      g.beginPath(); g.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) g.lineTo(pts[i].x,pts[i].y);
      g.stroke(); g.restore();
    };
    // 由宽到窄叠多层：路与草之间是渐变过渡而不是硬边
    stroke(56,'#2a2010',0.16); stroke(50,soil,0.30); stroke(46,soil,0.62);
    stroke(42,'#a5885a',0.55); stroke(34,'#b89a68',0.45); stroke(20,'#c8ae7e',0.30);
    stroke(3.5,'#6b5430',0.35,[16,12],-8);     // 车辙
    stroke(3.5,'#6b5430',0.30,[14,15], 8);
  }
  // 路面碎石与踩踏磨损
  for(let i=0;i<900;i++){
    const lane=i%2?'a':'b', P=PATHS[lane];
    const d=rnd(sd+i*2.7)*P.total, off=(rnd(sd+i*5.3)-0.5)*44;
    const p=posAt(lane,d), dir=dirAt(lane,d);
    const x=p.x-dir.y*off, y=p.y+dir.x*off, v=rnd(sd+i*7.1);
    if(v<0.5){ g.fillStyle='rgba(60,44,22,'+(0.10+v*0.25).toFixed(3)+')'; g.fillRect(x,y,2,1.6); }
    else if(v<0.85){ g.fillStyle='rgba(226,206,164,'+(0.06+v*0.14).toFixed(3)+')'; g.fillRect(x,y,1.6,1.4); }
    else { g.fillStyle='rgba(120,102,72,.5)'; g.beginPath(); g.arc(x,y,1.4+rnd(sd+i)*1.6,0,Math.PI*2); g.fill(); }
  }
}
function drawGroundLayer(){

// 林间光斑：保留的逐帧地形动画，随风缓移
function drawForestDapple(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(terrainAt(c,r)!=='forest') continue;
    const x=c*CELL, y=r*CELL;
    for(let i=0;i<4;i++){
      const a=i*1.31+gameTime*0.45+c*0.3+r*0.5;
      const px=x+CELL/2+Math.cos(a)*18, py=y+CELL/2+Math.sin(a*1.3)*15, rr=6+((i+c)%3)*2;
      const gr=ctx.createRadialGradient(px,py,0,px,py,rr);
      gr.addColorStop(0,'rgba(190,235,140,'+(env.night?0.05:0.13)+')');
      gr.addColorStop(1,'rgba(190,235,140,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawGrass(){
  const pal=curMap.grass;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const n=((c*19+r*31)%7);
    ctx.fillStyle=pal[n%pal.length];
    ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    // 风吹草动：草叶按位置相位轻摆
    const sway=Math.sin(gameTime*1.5+(c*0.7+r*0.4))*1.6;
    ctx.fillStyle='rgba(120,190,70,0.14)';
    ctx.fillRect(c*CELL+8+(n%5)+sway,r*CELL+12,2,11);
    ctx.fillRect(c*CELL+22-sway*0.6,r*CELL+28+(n%4),2,9);
    ctx.fillRect(c*CELL+40+sway*0.8,r*CELL+8,3,8);
    ctx.fillStyle='rgba(255,230,120,0.05)';
    if(n===2) ctx.fillRect(c*CELL+14,r*CELL+36,4,4);
    if(n===5){ ctx.fillStyle='rgba(255,210,120,0.05)'; ctx.beginPath(); ctx.arc(c*CELL+34,r*CELL+46,3,0,Math.PI*2); ctx.fill(); }
  }
  // 暖阳斜照：左上偏暖，右下沉入阴影
  const sun=ctx.createLinearGradient(0,0,W,H);
  sun.addColorStop(0,'rgba(255,214,130,0.10)');
  sun.addColorStop(0.45,'rgba(255,190,90,0.03)');
  sun.addColorStop(1,'rgba(20,10,40,0.20)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
}
// 云影缓慢横移，给静态战场加呼吸感
function drawCloudShadows(){

// ---------- 地形绘制：高地台地 / 密林暗影 / 泥沼水洼 ----------
function drawTerrain(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const t=terrainAt(c,r); if(t==='plain'||t==='marsh') continue;
    const x=c*CELL, y=r*CELL;
    if(t==='hill'){
      // 抬高的台地：亮顶 + 右下投影 + 等高线
      ctx.fillStyle='rgba(154,138,74,.42)'; ctx.fillRect(x,y,CELL,CELL);
      ctx.fillStyle='rgba(214,196,128,.26)';
      ctx.beginPath(); ctx.moveTo(x+5,y+CELL-7); ctx.lineTo(x+13,y+7);
      ctx.lineTo(x+CELL-9,y+5); ctx.lineTo(x+CELL-4,y+CELL-9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,236,170,.30)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.ellipse(x+CELL/2,y+CELL/2,CELL*0.30,CELL*0.20,0,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(255,236,170,.16)';
      ctx.beginPath(); ctx.ellipse(x+CELL/2,y+CELL/2,CELL*0.42,CELL*0.30,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(x+CELL-7,y+7,7,CELL-7); ctx.fillRect(x+7,y+CELL-7,CELL-7,7);
    } else if(t==='forest'){
      ctx.fillStyle='rgba(16,40,16,.46)'; ctx.fillRect(x,y,CELL,CELL);
      // 树冠斑驳的透光点，随时间轻微摇动
      ctx.fillStyle='rgba(150,220,120,.10)';
      for(let i=0;i<5;i++){
        const a=i*1.31+gameTime*0.6+c*0.3+r*0.5;
        ctx.beginPath(); ctx.arc(x+CELL/2+Math.cos(a)*17, y+CELL/2+Math.sin(a*1.3)*15, 5+((i+c)%3), 0, Math.PI*2); ctx.fill();
      }
    }
  }
}
// 泥沼画在土路之上（否则会被路面盖住），并且只在真正的路面范围内着色
function drawMarsh(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(terrainAt(c,r)!=='marsh') continue;
    const x=c*CELL, y=r*CELL;
    ctx.save();
    ctx.beginPath(); ctx.rect(x,y,CELL,CELL); ctx.clip();
    ctx.fillStyle='rgba(44,52,30,.72)'; ctx.fillRect(x,y,CELL,CELL);
    for(let i=0;i<4;i++){
      const ph=gameTime*0.9+i*2.1+c*0.7+r*1.1;
      const rr=10+((i*7+c+r)%7)+Math.sin(ph)*2.0;
      ctx.fillStyle='rgba(104,116,70,.55)';
      ctx.beginPath(); ctx.ellipse(x+11+i*14, y+15+((i*13+c)%26), rr, rr*0.52, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(206,224,166,.20)';
      ctx.beginPath(); ctx.ellipse(x+11+i*14, y+13+((i*13+c)%26), rr*0.52, rr*0.22, 0, 0, Math.PI*2); ctx.fill();
    }
    // 冒泡
    for(let i=0;i<2;i++){
      const bub=(gameTime*0.75+c*0.4+r*0.9+i*0.5)%1;
      if(bub<0.45){ ctx.fillStyle='rgba(226,244,196,'+(0.42*(1-bub/0.45)).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x+16+((c*7+i*23)%30), y+CELL-8-bub*26, 2.6, 0, Math.PI*2); ctx.fill(); }
    }
    // 边缘的枯苇，让泥沼段一眼可辨
    ctx.strokeStyle='rgba(150,160,96,.55)'; ctx.lineWidth=1.6;
    for(let i=0;i<5;i++){
      const sx=x+7+i*11, sy=y+CELL-3, sw=Math.sin(gameTime*1.4+i+c)*2.4;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+sw,sy-11-((i*5+r)%7)); ctx.stroke();
    }
    ctx.restore();
  }
}
// ---------- 天气与昼夜：整屏色调 + 粒子层 ----------
function drawWeather(){
  const w=env.weather;
  if(env.night && !(window.DBG&&window.DBG.c)){ ctx.fillStyle=NIGHT.tint; ctx.fillRect(0,0,W,H); }
  if(w.tint){ ctx.fillStyle=w.tint; ctx.fillRect(0,0,W,H); }
  ctx.save();
  if(w.id==='rain'){
    ctx.strokeStyle='rgba(180,212,255,.62)'; ctx.lineWidth=1.7;
    ctx.beginPath();
    for(let i=0;i<340;i++){
      const x=((i*137+gameTime*260)%(W+180))-90+((i*53)%40);
      const y=((i*211+gameTime*900)%(H+120))-60;
      ctx.moveTo(x,y); ctx.lineTo(x-7,y+19);
    }
    ctx.stroke();
    // 地面溅点
    ctx.fillStyle='rgba(190,220,255,.20)';
    for(let i=0;i<26;i++){
      const ph=(gameTime*1.6+i*0.37)%1;
      const x=(i*167+curMap.seed*31)%W, y=(i*263)%H;
      ctx.beginPath(); ctx.ellipse(x,y,3+ph*7,1.2+ph*2.4,0,0,Math.PI*2); ctx.stroke();
    }
  } else if(w.id==='snow'){
    ctx.fillStyle='rgba(240,248,255,.72)';
    for(let i=0;i<130;i++){
      const x=((i*149+gameTime*22+Math.sin(gameTime*0.9+i)*26)%(W+80))-40;
      const y=((i*197+gameTime*70)%(H+80))-40;
      ctx.beginPath(); ctx.arc(x,y,1.1+((i*3)%3)*0.7,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='rgba(230,245,255,.10)'; ctx.fillRect(0,0,W,H);
  } else if(w.id==='fog'){
    for(let i=0;i<11;i++){
      const cx=((gameTime*(9+i*3)+i*380)%(W+520))-260, cy=30+i*72;
      const g=ctx.createRadialGradient(cx,cy,10,cx,cy,230);
      g.addColorStop(0,'rgba(222,232,242,.38)'); g.addColorStop(1,'rgba(222,232,242,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,230,96,0,0,Math.PI*2); ctx.fill();
    }
  } else if(w.id==='storm'){
    ctx.strokeStyle='rgba(200,220,255,.30)'; ctx.lineWidth=1.1;
    ctx.beginPath();
    for(let i=0;i<120;i++){
      const x=((i*127+gameTime*520)%(W+240))-120;
      const y=((i*179+gameTime*760)%(H+120))-60;
      ctx.moveTo(x,y); ctx.lineTo(x-16,y+13);
    }
    ctx.stroke();
    // 随机闪电：整屏亮一下 + 天边裂纹
    const flash=(gameTime*0.7)%3.4;
    if(flash<0.13){
      ctx.fillStyle='rgba(210,225,255,'+(0.30*(1-flash/0.13))+')'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(235,245,255,.85)'; ctx.lineWidth=2.4;
      let lx=((Math.floor(gameTime/3.4)*613)%W), ly=0;
      ctx.beginPath(); ctx.moveTo(lx,ly);
      for(let i=0;i<7;i++){ lx+=((i*97+Math.floor(gameTime/3.4)*31)%50)-25; ly+=H/7; ctx.lineTo(lx,ly); }
      ctx.stroke();
    }
  }
  ctx.restore();
  // 夜战：城池与火把周围留一圈暖光，避免全屏死黑
  if(env.night && !(window.DBG&&window.DBG.b)){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const cp=cityPoint();
    const g=ctx.createRadialGradient(cp.x,cp.y,10,cp.x,cp.y,190);
    g.addColorStop(0,'rgba(255,190,90,.13)'); g.addColorStop(0.5,'rgba(255,170,70,.05)'); g.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cp.x,cp.y,190,0,Math.PI*2); ctx.fill();
    // 塔的火光已在 drawBuilding 里贴地绘制，这里只补一层极淡的空气散射，避免叠成白斑
    ctx.globalAlpha=0.5;
    for(const t of towers){
      const gg=ctx.createRadialGradient(t.x,t.y+8,18,t.x,t.y+8,70);
      gg.addColorStop(0,'rgba(255,186,104,.05)'); gg.addColorStop(1,'rgba(255,186,104,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(t.x,t.y+8,70,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }
}
function drawVignette(){

function drawRoad(points){
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#3d2814'; ctx.lineWidth=CELL+6;
  ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
  ctx.stroke();
  ctx.strokeStyle='#6b4524'; ctx.lineWidth=CELL-6; ctx.stroke();
  ctx.strokeStyle='#8a5a30'; ctx.lineWidth=CELL-20; ctx.stroke();
  ctx.strokeStyle='#a07040'; ctx.lineWidth=CELL-34; ctx.stroke();
}
function drawPath(){

  ctx.fillStyle='rgba(40,24,8,0.35)';

// ---------- M6：软阴影（统一光源 + 昼夜长度）----------
function softShadow(x,y,rx,ry,alpha){
  const a=(alpha==null?shadowAlpha():alpha), L=shadowLen();
  const ox=x+LIGHT.x*-6*L*0.35, oy=y+13+Math.abs(LIGHT.y)*2*L*0.35;
  const g=ctx.createRadialGradient(ox,oy,0,ox,oy,Math.max(rx*1.25,4));
  g.addColorStop(0,'rgba(0,0,0,'+a.toFixed(3)+')');
  g.addColorStop(0.62,'rgba(0,0,0,'+(a*0.55).toFixed(3)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(ox,oy); ctx.scale(1,Math.max(0.18,ry/Math.max(rx,1)));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,Math.max(rx*1.25,4),0,Math.PI*2); ctx.fill();
  ctx.restore();
}
// ---------- M6：分层树冠 + 迎光边缘 + 随风摆动 ----------
function drawTree(x,y){
  const ph=x*0.07+y*0.05;
  const sway=Math.sin(gameTime*1.1+ph)*0.045 + Math.sin(gameTime*2.7+ph)*0.015;
  const scale=1+((Math.sin(x*3.1+y*1.7)*0.5+0.5)*0.28);      // 每棵树大小略有差异
  softShadow(x,y+2,13*scale,5*scale);
  ctx.save(); ctx.translate(x,y+14); ctx.scale(scale,scale);
  // 树干：上细下粗 + 树皮暗纹 + 根部环境光遮蔽
  ctx.fillStyle='rgba(20,12,4,.35)';
  ctx.beginPath(); ctx.ellipse(0,0,7,3,0,0,Math.PI*2); ctx.fill();
  const tg=ctx.createLinearGradient(-5,0,5,0);
  tg.addColorStop(0,'#5c3a16'); tg.addColorStop(0.42,'#7a5222'); tg.addColorStop(1,'#3a2410');
  ctx.fillStyle=tg;
  ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-3,-20); ctx.lineTo(3,-20); ctx.lineTo(5,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(30,18,6,.5)'; ctx.lineWidth=0.8;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-3+i*3,-3-i*2); ctx.lineTo(-2.4+i*3,-15-i); ctx.stroke(); }
  // 树冠：底暗 → 主体 → 迎光高光 → 边缘轮廓
  ctx.save(); ctx.translate(0,-20); ctx.rotate(sway);
  const v=(Math.sin(x*1.7+y*2.9)*0.5+0.5);                  // 每棵树固定的"个体差异"
  const j=(k)=>1+((Math.sin(x*0.9+y*1.3+k*2.1)*0.5+0.5)-0.5)*0.34;
  const blobs=[[0,-8,16*j(1)],[-9*j(2),-3,11*j(3)],[9*j(4),-5,12*j(5)],[2,-15*j(6),10*j(7)],[-5,-13,8*j(8)]];
  const hue=(a,b,c2)=>'rgb('+Math.round(a+v*14)+','+Math.round(b+v*26)+','+Math.round(c2+v*10)+')';
  ctx.fillStyle=hue(8,44,14);
  for(const b of blobs){ ctx.beginPath(); ctx.arc(b[0],b[1]+2,b[2],0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle=hue(24,96,32);
  for(const b of blobs){ ctx.beginPath(); ctx.arc(b[0],b[1],b[2]*0.94,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle=hue(42,126,44);
  for(const b of blobs){ ctx.beginPath(); ctx.arc(b[0]+LIGHT.x*b[2]*0.28,b[1]+LIGHT.y*b[2]*0.28,b[2]*0.62,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='rgba(150,210,110,.55)';
  for(const b of blobs){ ctx.beginPath(); ctx.arc(b[0]+LIGHT.x*b[2]*0.46,b[1]+LIGHT.y*b[2]*0.46,b[2]*0.30,0,Math.PI*2); ctx.fill(); }
  // 零星叶尖
  ctx.strokeStyle='rgba(120,190,90,.5)'; ctx.lineWidth=1;
  for(let i=0;i<6;i++){ const a=i*1.05+ph; const rr=13+((i*7)%5);
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*rr*0.8,Math.sin(a)*rr*0.7-6); ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr-6); ctx.stroke(); }
  ctx.restore(); ctx.restore();
}
// ---------- M6：多面岩石（受光面/背光面/苔痕）----------
function drawRock(x,y){
  const sc=0.85+((Math.sin(x*2.3+y*3.7)*0.5+0.5)*0.5);
  softShadow(x,y-4,11*sc,4*sc,0.34);
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  const face=[[-11,4],[-6,-9],[1,-13],[9,-7],[10,4]];
  ctx.beginPath(); ctx.moveTo(face[0][0],face[0][1]);
  for(let i=1;i<face.length;i++) ctx.lineTo(face[i][0],face[i][1]);
  ctx.closePath();
  const gr=ctx.createLinearGradient(-8,-12,8,5);
  gr.addColorStop(0,'#9a968c'); gr.addColorStop(0.45,'#6e6a62'); gr.addColorStop(1,'#403c36');
  ctx.fillStyle=gr; ctx.fill();
  ctx.strokeStyle='rgba(24,22,18,.65)'; ctx.lineWidth=1.2; ctx.stroke();
  // 受光顶面
  ctx.fillStyle='rgba(226,222,208,.55)';
  ctx.beginPath(); ctx.moveTo(-6,-9); ctx.lineTo(1,-13); ctx.lineTo(6,-8); ctx.lineTo(-2,-5); ctx.closePath(); ctx.fill();
  // 裂纹与苔痕
  ctx.strokeStyle='rgba(20,18,14,.45)'; ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.moveTo(-3,-6); ctx.lineTo(0,0); ctx.lineTo(5,2); ctx.stroke();
  ctx.fillStyle='rgba(94,132,62,.45)';
  ctx.beginPath(); ctx.ellipse(-6,2,4,2,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,3,3,1.6,-0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
// ---------- M6：灌木 ----------
function drawBush(x,y){
  const sway=Math.sin(gameTime*1.6+x*0.1)*1.2;
  softShadow(x,y-6,10,4,0.30);
  const blobs=[[0,0,9],[-6,2,6.5],[6,1,7.5],[1,-5,6]];
  ctx.fillStyle='#12381a';
  for(const b of blobs){ ctx.beginPath(); ctx.arc(x+b[0]+sway*0.3,y+b[1]+1.5,b[2],0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#22682a';
  for(const b of blobs){ ctx.beginPath(); ctx.arc(x+b[0]+sway*0.3,y+b[1],b[2]*0.9,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='rgba(126,190,88,.45)';
  for(const b of blobs){ ctx.beginPath(); ctx.arc(x+b[0]+LIGHT.x*b[2]*0.4+sway*0.3,y+b[1]+LIGHT.y*b[2]*0.4,b[2]*0.34,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='rgba(150,200,110,.4)'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ const a=-1.2-i*0.5;
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*5+sway*0.5,y+Math.sin(a)*5);
    ctx.lineTo(x+Math.cos(a)*11+sway,y+Math.sin(a)*11-2); ctx.stroke(); }
}
// ---------- M6：火把（含地面光晕，夜里更亮）----------
function drawTorch(x,y){
  const flicker=0.72+Math.sin(gameTime*13+x)*0.18+Math.sin(gameTime*29+x*2)*0.10;
  const glowR=(env.night?92:52)*(0.92+flicker*0.12);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y-8,0,x,y-8,glowR);
  g.addColorStop(0,'rgba(255,176,70,'+(env.night?0.34:0.16)+')');
  g.addColorStop(0.45,'rgba(255,120,30,'+(env.night?0.13:0.06)+')');
  g.addColorStop(1,'rgba(255,90,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y-8,glowR,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // 杆
  ctx.fillStyle='#2e1c0c'; ctx.fillRect(x-2.5,y-6,5,18);
  ctx.fillStyle='#4a2f14'; ctx.fillRect(x-2.5,y-6,2,18);
  ctx.strokeStyle='#7a5a2a'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(x-4,y-4); ctx.lineTo(x+4,y-2); ctx.stroke();
  // 焰心三层
  const fy=y-12-flicker*2;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,110,20,'+(0.55*flicker+0.3)+')';
  ctx.beginPath(); ctx.moveTo(x,fy-11*flicker); ctx.quadraticCurveTo(x+6,fy-2,x,fy+5); ctx.quadraticCurveTo(x-6,fy-2,x,fy-11*flicker); ctx.fill();
  ctx.fillStyle='rgba(255,196,60,'+(0.6*flicker+0.3)+')';
  ctx.beginPath(); ctx.moveTo(x,fy-7*flicker); ctx.quadraticCurveTo(x+3.4,fy-1,x,fy+3); ctx.quadraticCurveTo(x-3.4,fy-1,x,fy-7*flicker); ctx.fill();
  ctx.fillStyle='rgba(255,248,210,'+(0.7*flicker)+')';
  ctx.beginPath(); ctx.arc(x,fy-1,1.8,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // 余烬
  if(Math.random()<0.25) parts.push({x:x+(Math.random()*4-2),y:fy-6,vx:(Math.random()*10-5),vy:-24-Math.random()*22,

    ctx.translate(9,2); ctx.rotate(swing*0.8);

      ctx.lineTo(px,py);
    }

    ctx.strokeStyle='rgba(255,220,240,.7)'; ctx.lineWidth=1.2; ctx.stroke();
  }
  ctx.restore(); ctx.restore();
}

function drawPad(x,y,col){

/* ================= M6：建筑塔美术重制 =================
   统一的中式营造语言：石基座 → 木构塔身 → 飞檐瓦顶 → 军旗 → 器械顶部。
   Lv1→Lv4 通过「层数 / 屋顶 / 旗帜 / 铜金饰边」肉眼可辨地演进，而不是只加颗星。 */
function mOutline(w){ ctx.strokeStyle='rgba(22,14,6,.75)'; ctx.lineWidth=w||1.4; ctx.stroke(); }
// 木构件：竖向渐变 + 木纹 + 描边
function mWood(x,y,w,h,c1,c2){
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,c2||'#4a3018'); g.addColorStop(0.38,c1||'#7a5228'); g.addColorStop(1,c2||'#3c2612');
  ctx.fillStyle=g; ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); mOutline();
  ctx.strokeStyle='rgba(30,18,6,.30)'; ctx.lineWidth=0.8;
  for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+2,y+h*i/3); ctx.lineTo(x+w-2,y+h*i/3+0.6); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,226,170,.16)';
  ctx.beginPath(); ctx.moveTo(x+1.5,y+1.5); ctx.lineTo(x+1.5,y+h-1.5); ctx.stroke();
}
// 石构件：砖缝 + 颗粒
function mStone(x,y,w,h){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#8e8a80'); g.addColorStop(0.5,'#6d6960'); g.addColorStop(1,'#4a4740');
  ctx.fillStyle=g; ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); mOutline();
  ctx.strokeStyle='rgba(28,26,22,.35)'; ctx.lineWidth=0.8;
  for(let r=1;r<Math.max(2,h/5);r++){
    const yy=y+r*5; if(yy>y+h-1) break;
    ctx.beginPath(); ctx.moveTo(x+1,yy); ctx.lineTo(x+w-1,yy); ctx.stroke();
    const off=(r%2)?w/3:w*0.66;
    ctx.beginPath(); ctx.moveTo(x+off,yy); ctx.lineTo(x+off,Math.min(y+h-1,yy+5)); ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,240,.16)';
  ctx.beginPath(); ctx.moveTo(x+1,y+1); ctx.lineTo(x+w-1,y+1); ctx.stroke();
}
// 金属：高光带
function mMetal(x,y,w,h,tint){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,tint?'#e6c86a':'#b9c0c8'); g.addColorStop(0.35,tint?'#c9a227':'#8e959d');
  g.addColorStop(0.62,tint?'#8a6c14':'#5c6169'); g.addColorStop(1,tint?'#5f4a0c':'#3b3f45');
  ctx.fillStyle=g; ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); mOutline(1.1);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(x+1,y+h*0.18,w-2,Math.max(1,h*0.12));
}
// 中式飞檐瓦顶
function mRoof(cx,y,w,h,col,gold){
  ctx.beginPath();
  ctx.moveTo(cx-w/2,y);
  ctx.quadraticCurveTo(cx-w*0.32,y-h*0.30,cx,y-h);
  ctx.quadraticCurveTo(cx+w*0.32,y-h*0.30,cx+w/2,y);
  ctx.quadraticCurveTo(cx+w*0.30,y+h*0.22,cx,y+h*0.16);
  ctx.quadraticCurveTo(cx-w*0.30,y+h*0.22,cx-w/2,y);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,y-h,0,y+h*0.2);
  g.addColorStop(0,col||'#7d3a2a'); g.addColorStop(0.5,col?col:'#5e2a1e'); g.addColorStop(1,'#3a190f');
  ctx.fillStyle=g; ctx.fill(); mOutline(1.3);
  // 瓦楞
  ctx.strokeStyle='rgba(20,10,6,.35)'; ctx.lineWidth=0.9;
  for(let i=-2;i<=2;i++){
    ctx.beginPath(); ctx.moveTo(cx+i*w*0.16, y-h*0.72+Math.abs(i)*h*0.18);
    ctx.lineTo(cx+i*w*0.20, y+h*0.10); ctx.stroke();
  }
  // 屋脊高光
  ctx.strokeStyle=gold?'rgba(255,220,120,.85)':'rgba(255,214,150,.35)'; ctx.lineWidth=gold?2:1.2;
  ctx.beginPath(); ctx.moveTo(cx-w*0.44,y-h*0.06); ctx.quadraticCurveTo(cx,y-h*0.92,cx+w*0.44,y-h*0.06); ctx.stroke();
  // 翘角兽吻
  ctx.fillStyle=gold?'#ffd54a':'#c9a227';
  ctx.beginPath(); ctx.arc(cx-w/2,y,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+w/2,y,2.2,0,Math.PI*2); ctx.fill();
}
// 军旗：飘动的三角旗
function mBanner(x,y,h,col,phase,gold){
  ctx.strokeStyle=gold?'#e6c86a':'#6b5430'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-h); ctx.stroke();
  if(gold){ ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.arc(x,y-h-2,2.4,0,Math.PI*2); ctx.fill(); }
  const w=Math.sin(gameTime*4+phase)*2.6, w2=Math.sin(gameTime*4+phase+1)*2.2;
  ctx.beginPath();
  ctx.moveTo(x,y-h);
  ctx.quadraticCurveTo(x+7,y-h+2+w, x+14,y-h+4+w2);
  ctx.quadraticCurveTo(x+7,y-h+8+w, x,y-h+10);
  ctx.closePath();
  const g=ctx.createLinearGradient(x,0,x+14,0);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=col; ctx.fill();
  ctx.fillStyle=g; ctx.globalAlpha=0.45; ctx.fill(); ctx.globalAlpha=1;
  mOutline(1);
}
// 基座 + 塔身分层：等级越高，层数与体量越大
function towerFrame(t, opt){
  const lv=t.level, evo=lv>=4;
  const bw=opt.bw||34;
  // 石台基（Lv3+ 加宽加高）
  const pw=bw+10+(lv>=3?4:0), ph=lv>=3?11:8;
  mStone(-pw/2, 6, pw, ph);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(-pw/2,6+ph-2,pw,2);
  if(evo){ mMetal(-pw/2-1,4,pw+2,3,true); }         // 铜包边
  // 塔身：Lv1 一层，Lv2 两层，Lv3+ 三层（逐层收分）
  const tiers=Math.min(3, lv);
  let y=6, w=bw;
  for(let i=0;i<tiers;i++){
    const hgt=opt.tierH||13;
    mWood(-w/2, y-hgt, w, hgt, opt.wood1, opt.wood2);
    // 四角立柱：让塔身有结构而不是一块板
    ctx.fillStyle='rgba(40,24,10,.75)';
    ctx.fillRect(-w/2-1.2, y-hgt, 2.6, hgt); ctx.fillRect(w/2-1.4, y-hgt, 2.6, hgt);
    ctx.fillStyle='rgba(255,222,170,.14)';
    ctx.fillRect(-w/2+0.4, y-hgt, 1.2, hgt);
    if(i===0){
      // 底层门洞 + 门内暗部
      ctx.fillStyle='#241606'; ctx.beginPath();
      ctx.moveTo(-5,y); ctx.lineTo(-5,y-hgt*0.55); ctx.quadraticCurveTo(0,y-hgt*0.86,5,y-hgt*0.55); ctx.lineTo(5,y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(180,140,80,.45)'; ctx.lineWidth=1; ctx.stroke();
    } else {
      // 上层窗洞
      ctx.fillStyle='#2a1a0a';
      ctx.fillRect(-w*0.28, y-hgt*0.72, w*0.20, hgt*0.42);
      ctx.fillRect( w*0.08, y-hgt*0.72, w*0.20, hgt*0.42);
      ctx.strokeStyle='rgba(180,140,80,.35)'; ctx.lineWidth=0.8;
      ctx.strokeRect(-w*0.28, y-hgt*0.72, w*0.20, hgt*0.42);
      ctx.strokeRect( w*0.08, y-hgt*0.72, w*0.20, hgt*0.42);
    }
    // 层间腰檐（带下沿投影）
    if(i<tiers-1){
      ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(-w/2-2, y-hgt-0.6, w+4, 1.6);
      ctx.fillStyle='#4a3018'; ctx.fillRect(-w/2-3, y-hgt-3.2, w+6, 3.2); mOutline(1);
      ctx.fillStyle='rgba(255,226,170,.20)'; ctx.fillRect(-w/2-3, y-hgt-3.2, w+6, 0.9);
    }
    y-=hgt+2; w-=4;
  }
  // 顶层女墙垛口
  ctx.fillStyle='#5a3d20';
  for(let i=-2;i<=2;i++){ ctx.fillRect(i*(w*0.24)-2, y-3.4, 4, 3.6); }
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-w/2-1, y-0.6, w+2, 1.4);
  // 屋顶（Lv3 起）
  if(lv>=3) mRoof(0, y+2, w+16, 12, opt.roof, evo);
  // 旗（Lv2 起一面，Lv4 双面）
  if(lv>=2) mBanner(-w/2-1, y-(lv>=3?8:0), 16, opt.flag||'#c0392b', t.x*0.1, evo);
  if(evo)   mBanner(w/2+1, y-8, 16, opt.flag||'#c0392b', t.x*0.1+2, true);
  return {topY:y-(lv>=3?10:0), w:w};
}
function drawBuilding(t, ghost){
  const h=DEFS[t.key];
  const evo=t.level>=4;
  if(!ghost) drawPad(t.x,t.y,h.color);
  softShadow(t.x,t.y,(evo?20:16), (evo?8:6));
  if(ghost) ctx.globalAlpha=0.6;
  ctx.save(); ctx.translate(t.x,t.y);
  if(evo) ctx.scale(1.16,1.16);
  // 受击/修复时整塔抖动
  if(t.hitFx>0) ctx.translate((Math.random()*2-1)*t.hitFx*3,(Math.random()*2-1)*t.hitFx*2);
  const recoil=(t.anim||0)*4;
  const lv=t.level;

  if(t.key==='arrow'){
    const f=towerFrame(t,{bw:30,wood1:'#8a5a30',wood2:'#4a3018',roof:'#7d3a2a',flag:'#c0392b'});
    // 顶部箭垛与弩手窗
    ctx.fillStyle='#2a1a0c'; ctx.fillRect(-8,f.topY-6,16,6); mOutline(1);
    mMetal(2-recoil, f.topY-5, 20, 3.4);                    // 搭在窗上的箭
    ctx.fillStyle='#d8dde4'; ctx.beginPath();
    ctx.moveTo(22-recoil,f.topY-3.3); ctx.lineTo(29-recoil,f.topY-1.6); ctx.lineTo(22-recoil,f.topY); ctx.fill();
  } else if(t.key==='ballista'){
    const f=towerFrame(t,{bw:36,wood1:'#6b4a28',wood2:'#3a2612',roof:'#4a3a2a',flag:'#8a6a2f',tierH:12});

  }
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(e.pos.x-w/2,y0,w,4);
  ctx.fillStyle=ratio>0.5?'#3ddc5a':ratio>0.25?'#f0c419':'#e74c3c';
  ctx.fillRect(e.pos.x-w/2,y0,w*ratio,4);
}
const FILTER_OK=(function(){ try{ return typeof ctx.filter==='string'; }catch(err){ return false; } })();
function drawEnemy(e){
  // 命中闪白 + 击退位移 + 出场缩放，全部走同一层包装
  const kbOff=e.kb?Math.min(e.kb,9):0;
  const pop=e.spawnT>0?(1+e.spawnT*0.9):1;
  ctx.save();
  if(kbOff||pop!==1){
    ctx.translate(e.pos.x,e.pos.y); ctx.scale(pop,pop);
    ctx.translate(-e.pos.x+(-kbOff*e.face), -e.pos.y);
  }
  if(e.flash>0 && FILTER_OK) ctx.filter='brightness('+(1+e.flash*7).toFixed(2)+') saturate('+(1-Math.min(0.9,e.flash*4)).toFixed(2)+')';
  drawEnemyBody(e);
  ctx.filter='none';
  ctx.restore();
  if(e.affix){
    ctx.strokeStyle=e.affix.color; ctx.lineWidth=1.6; ctx.globalAlpha=0.55+Math.sin(gameTime*5)*0.2;
    ctx.beginPath(); ctx.arc(e.pos.x,e.pos.y,e.radius+9,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=e.affix.color; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(e.affix.name, e.pos.x, e.pos.y-e.radius-26);
  }
  drawHpBar(e);
}

  if(e.type==='shieldman' && e.shield>0){ ctx.strokeStyle='rgba(126,203,255,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.pos.x,e.pos.y,e.radius+6,0,Math.PI*2); ctx.stroke(); }

    ctx.beginPath(); ctx.arc(e.pos.x,e.pos.y,e.radius+16,0,Math.PI*2); ctx.stroke();
  }
}
// 鸦兵：越野飞行，投影落在地面标示它不走土路
function drawRaven(e){
  const fl=Math.sin(gameTime*16+e.pos.x*0.1);
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(e.pos.x,e.pos.y+8,11,4,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#1c1a22';
  ctx.beginPath(); ctx.ellipse(0,0,11,6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-2,-2); ctx.quadraticCurveTo(-14,-10+fl*7,-20,2+fl*3); ctx.quadraticCurveTo(-10,0,-2,3); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2,-2); ctx.quadraticCurveTo(14,-10-fl*7,20,2-fl*3); ctx.quadraticCurveTo(10,0,2,3); ctx.fill();
  ctx.fillStyle='#2a2632'; ctx.beginPath(); ctx.arc(9,-3,4.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e0a020'; ctx.beginPath(); ctx.moveTo(13,-3); ctx.lineTo(20,-1); ctx.lineTo(13,1); ctx.fill();
  ctx.fillStyle='#ff5252'; ctx.beginPath(); ctx.arc(10,-4.5,1.3,0,Math.PI*2); ctx.fill();

}

function drawProj(p){
  if(p.trail && p.trail.length>1){
    const col=p.kind==='fire'?'#ff8a00':p.kind==='ice'?'#a8e0ff':p.kind==='cannon'?'#8a8a8a':'#ffe082';
    for(let i=0;i<p.trail.length;i++){
      const q=p.trail[i]; if(q.l<=0) continue;
      ctx.globalAlpha=(i/p.trail.length)*0.42;
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(q.x,q.y,(i/p.trail.length)*3.4+0.6,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(p.crit){
    ctx.globalAlpha=0.4+Math.sin(gameTime*22)*0.2; ctx.fillStyle='#ff5252';
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
  if(p.kind==='arrow'||p.kind==='bolt'){
    ctx.fillStyle='#5a3414'; ctx.fillRect(-16,-2,28,4);
    ctx.fillStyle='#f0f4f8'; ctx.beginPath(); ctx.moveTo(12,-7); ctx.lineTo(26,0); ctx.lineTo(12,7); ctx.fill();
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(-22,-5); ctx.lineTo(-18,0); ctx.lineTo(-22,5); ctx.fill();
    ctx.fillStyle='rgba(255,230,150,.35)'; ctx.fillRect(-10,-1,20,2);
  } else if(p.kind==='cannon'){
    ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#666'; ctx.beginPath(); ctx.arc(-2,-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,120,0,.4)'; ctx.beginPath(); ctx.arc(-8,0,6,0,Math.PI*2); ctx.fill();
  } else if(p.kind==='ice'){
    ctx.fillStyle='#c8f0ff'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(0,-7); ctx.lineTo(-10,0); ctx.lineTo(0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  } else if(p.kind==='venom'){
    const g=ctx.createRadialGradient(0,0,1,0,0,9);
    g.addColorStop(0,'#e6ffb0'); g.addColorStop(0.45,'#7cc44a'); g.addColorStop(1,'rgba(40,90,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4b8a3a'; ctx.beginPath(); ctx.arc(-5,1,3,0,Math.PI*2); ctx.fill();
  } else if(p.kind==='silk'){
    ctx.strokeStyle='#ff9ad0'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-14,0);
    for(let i=0;i<5;i++) ctx.lineTo(-14+i*7, Math.sin(gameTime*16+i)*4);
    ctx.stroke();
    ctx.fillStyle='#ffd0e4'; ctx.beginPath(); ctx.arc(14,0,4,0,Math.PI*2); ctx.fill();
  } else if(p.kind==='bolt2'){
    ctx.fillStyle='#c8e4ff'; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-6,-5); ctx.lineTo(-2,0); ctx.lineTo(-6,5); ctx.fill();
  } else {
    const g=ctx.createRadialGradient(0,0,1,0,0,16);
    g.addColorStop(0,'#fffbe6'); g.addColorStop(0.35,'#ffb000'); g.addColorStop(1,'rgba(180,20,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawSwing(s){
  const k=s.kind==='dragon'||s.kind==='roar'||s.kind==='charge'?0.7:0.28;
  ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a||0); ctx.globalAlpha=Math.max(0,s.life/k);
  if(s.kind==='dragon'){
    ctx.strokeStyle='#5cff88'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(8,0,48,-1.4,1.6); ctx.stroke();
    ctx.strokeStyle='#d4ffd8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(8,0,36,-1.2,1.4); ctx.stroke();
    ctx.strokeStyle='#1f7a32'; ctx.lineWidth=10; ctx.globalAlpha*=0.4; ctx.beginPath(); ctx.arc(8,0,58,-1.5,1.7); ctx.stroke();
  } else if(s.kind==='slash'){
    ctx.strokeStyle='#7CFF7C'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(22,0,30,-1.1,1.3); ctx.stroke();
  } else if(s.kind==='spear'){
    ctx.strokeStyle='#e8eef4'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(52,0); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(52,0); ctx.lineTo(42,-6); ctx.lineTo(42,6); ctx.fill();
  } else if(s.kind==='charge'){
    ctx.fillStyle='rgba(80,255,200,0.25)'; ctx.fillRect(0,-16,80,32);
    ctx.strokeStyle='#3dffc8'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(90,0); ctx.stroke();
  } else if(s.kind==='charm'){
    ctx.strokeStyle='#ff9ad0'; ctx.lineWidth=4;
    const rr=40+(1-s.life/k)*130;
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(255,208,228,.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,rr*0.72,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4+gameTime*1.4, hx=Math.cos(a)*rr*0.86, hy=Math.sin(a)*rr*0.86;
      ctx.fillStyle='#ff9ad0';
      ctx.beginPath();
      ctx.moveTo(hx,hy+3); ctx.bezierCurveTo(hx-5,hy-2,hx-2.5,hy-6,hx,hy-2.5);
      ctx.bezierCurveTo(hx+2.5,hy-6,hx+5,hy-2,hx,hy+3); ctx.fill();
    }
  } else if(s.kind==='roar'){
    ctx.strokeStyle='#ffd54a'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,30+(1-s.life/k)*40,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,18+(1-s.life/k)*28,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha=1;
}
// ---- 周瑜火海：地面燃烧区，径向渐变 + 跳动火舌 ----
function drawGrounds(){
  for(const g of grounds){
    const k=Math.min(1, g.life/Math.min(1.2,g.max));
    const grd=ctx.createRadialGradient(g.x,g.y,2,g.x,g.y,g.r);
    grd.addColorStop(0,'rgba(255,190,60,'+(0.34*k)+')');
    grd.addColorStop(0.55,'rgba(255,90,0,'+(0.24*k)+')');
    grd.addColorStop(1,'rgba(140,20,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.ellipse(g.x,g.y,g.r,g.r*0.62,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,140,30,'+(0.35*k)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(g.x,g.y,g.r*0.92,g.r*0.56,0,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<10;i++){
      const a=i*0.63+gameTime*1.5, rr=g.r*(0.3+((i*37)%10)/14);
      const fx=g.x+Math.cos(a)*rr, fy=g.y+Math.sin(a)*rr*0.6;
      const h=7+Math.sin(gameTime*11+i*1.7)*5;
      ctx.globalAlpha=0.55*k;
      ctx.fillStyle=i%2?'#ff8a00':'#ffd54a';
      ctx.beginPath(); ctx.moveTo(fx-2.6,fy); ctx.quadraticCurveTo(fx,fy-h,fx+2.6,fy); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}
// ---- 雷台连锁：锯齿状电弧 ----
function drawBolts(){
  ctx.lineCap='round';
  for(const b of bolts){
    const k=b.life/b.max;
    const dx=b.x2-b.x1, dy=b.y2-b.y1, seg=6;
    const pts=[{x:b.x1,y:b.y1}];
    for(let i=1;i<seg;i++){
      const t=i/seg, jx=(Math.random()*2-1)*11, jy=(Math.random()*2-1)*11;
      pts.push({x:b.x1+dx*t+jx, y:b.y1+dy*t+jy});
    }
    pts.push({x:b.x2,y:b.y2});
    ctx.globalAlpha=k*0.5; ctx.strokeStyle='#4a90ff'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(const p of pts) ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.globalAlpha=k; ctx.strokeStyle='#c8e4ff'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(const p of pts) ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.globalAlpha=k; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(const p of pts) ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
// ---- 孙尚香贯穿光矢 ----
function drawBeams(){
  for(const b of beams){
    const k=b.life/b.max;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
    const g=ctx.createLinearGradient(0,0,b.len,0);
    g.addColorStop(0,'rgba(255,255,255,'+(0.85*k)+')');
    g.addColorStop(0.35,b.col);
    g.addColorStop(1,'rgba(255,120,160,0)');
    ctx.globalAlpha=k;
    ctx.fillStyle=g; ctx.fillRect(0,-b.w/2,b.len,b.w);
    ctx.fillStyle='rgba(255,255,255,'+(0.9*k)+')'; ctx.fillRect(0,-b.w/6,b.len,b.w/3);
    ctx.restore(); ctx.globalAlpha=1;
  }
}
// ---- 医官治疗光束 ----
function drawHeals(){
  for(const h of heals){
    const k=h.life/h.max;
    ctx.globalAlpha=k*0.85; ctx.strokeStyle='#7CFF7C'; ctx.lineWidth=2.4;
    ctx.setLineDash([5,4]); ctx.lineDashOffset=-gameTime*30;
    ctx.beginPath(); ctx.moveTo(h.x1,h.y1); ctx.lineTo(h.x2,h.y2); ctx.stroke();
    ctx.setLineDash([]);
    // 十字标记
    ctx.fillStyle='#7CFF7C';
    const mx=(h.x1+h.x2)/2, my=(h.y1+h.y2)/2;
    ctx.fillRect(mx-5,my-1.6,10,3.2); ctx.fillRect(mx-1.6,my-5,3.2,10);
  }
  ctx.globalAlpha=1;
}

// 拒马：真实的木栅 + 铁索，耐久条随啃食下降，濒危时抖动
function drawBarricades(){
  for(const b of barricades){
    const k=Math.max(0,b.hp/b.maxHp);
    const shk=k<0.35?(Math.random()*2-1)*1.8:0;
    ctx.save(); ctx.translate(b.x+shk,b.y+shk);
    ctx.fillStyle='rgba(0,0,0,.40)'; ctx.beginPath(); ctx.ellipse(0,16,30,9,0,0,Math.PI*2); ctx.fill();
    // 三根交叉木桩
    for(let i=-1;i<=1;i++){
      ctx.save(); ctx.translate(i*17,0);
      ctx.strokeStyle='#6b4a24'; ctx.lineWidth=6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-11,12); ctx.lineTo(11,-16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(11,12); ctx.lineTo(-11,-16); ctx.stroke();
      ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-11,12); ctx.lineTo(11,-16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(11,12); ctx.lineTo(-11,-16); ctx.stroke();
      // 尖头
      ctx.fillStyle='#d8d0c0';
      ctx.beginPath(); ctx.moveTo(11,-16); ctx.lineTo(15,-21); ctx.lineTo(13,-13); ctx.fill();
      ctx.restore();
    }
    // 横向铁索
    ctx.strokeStyle='#9aa0aa'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-28,-2); ctx.lineTo(28,-2); ctx.stroke();
    ctx.fillStyle='#c8ced8';
    for(let i=-4;i<=4;i++){ ctx.beginPath(); ctx.arc(i*6.5,-2,2,0,Math.PI*2); ctx.fill(); }
    // 耐久条
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(-26,-30,52,5);
    ctx.fillStyle=k>0.5?'#b98a4a':k>0.25?'#e08a2a':'#c9483a'; ctx.fillRect(-26,-30,52*k,5);
    ctx.restore();
  }
}
// 火雨：带拖尾的下坠火石 + 落点预警圈
function drawMeteors(){
  for(const m of meteors){
    if(m.delay>0) continue;
    const k=Math.max(0,m.fall/0.42);      // 1 → 0 下坠进度
    // 地面预警圈
    ctx.strokeStyle='rgba(255,140,40,'+(0.30+0.5*(1-k)).toFixed(2)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(m.tx,m.ty,m.r*(0.45+0.55*(1-k)),m.r*0.34*(0.45+0.55*(1-k)),0,0,Math.PI*2); ctx.stroke();
    const fx=m.tx+26*k, fy=m.ty-230*k;
    // 拖尾
    const g=ctx.createLinearGradient(fx+26*0.35,fy-70,fx,fy);
    g.addColorStop(0,'rgba(255,120,20,0)'); g.addColorStop(1,'rgba(255,190,80,.85)');
    ctx.strokeStyle=g; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(fx+18,fy-72); ctx.lineTo(fx,fy); ctx.stroke();
    // 火石本体
    const gg=ctx.createRadialGradient(fx,fy,1,fx,fy,11);
    gg.addColorStop(0,'#fff4c0'); gg.addColorStop(0.4,'#ff9a3a'); gg.addColorStop(1,'rgba(200,40,0,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(fx,fy,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5a2a10'; ctx.beginPath(); ctx.arc(fx,fy,4.2,0,Math.PI*2); ctx.fill();
  }
}
// 虎啸三军：金色战鼓波纹 + 每座塔头顶的军旗光
function drawRally(){
  if(rallyUntil<=gameTime && rallyPulse<=0) return;
  const on=rallyUntil>gameTime;
  const left=Math.max(0,rallyUntil-gameTime);
  const a=on?(0.30+Math.sin(gameTime*7)*0.10):rallyPulse*0.3;
  ctx.save();
  for(const t of towers){
    ctx.strokeStyle='rgba(255,213,74,'+a.toFixed(2)+')'; ctx.lineWidth=2;
    const rr=26+Math.sin(gameTime*6+t.x*0.05)*3;
    ctx.beginPath(); ctx.ellipse(t.x,t.y+10,rr,rr*0.42,0,0,Math.PI*2); ctx.stroke();
    if(on){
      // 上升的金色火星
      const ph=(gameTime*1.6+t.x*0.07)%1;
      ctx.fillStyle='rgba(255,235,150,'+(0.7*(1-ph)).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(t.x+Math.sin(ph*7+t.y)*7, t.y-14-ph*30, 2.2, 0, Math.PI*2); ctx.fill();
    }
  }
  if(on){
    // 顶部的持续时间条
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(W/2-90,H-26,180,7);
    ctx.fillStyle='#ffd54a'; ctx.fillRect(W/2-90,H-26,180*Math.min(1,left/(RALLY.dur+META.rally)),7);
    ctx.fillStyle='#ffe9a0'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('虎啸三军 '+left.toFixed(1)+'s', W/2, H-30); ctx.textAlign='left';
  }
  ctx.restore();
}
// 回天固城：从城门向外扩散的绿色治愈波
function drawCityWave(){
  if(cityWave<=0) return;
  const cp=cityPoint(), k=1-cityWave;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const rr=(k*1.05+i*0.16)*420;
    if(rr<=0) continue;
    ctx.strokeStyle='rgba(124,255,124,'+(0.42*cityWave*(1-i*0.28)).toFixed(3)+')'; ctx.lineWidth=5-i;
    ctx.beginPath(); ctx.arc(cp.x,cp.y,rr,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}
// 瞄准态：跟随鼠标的技能范围预览
function drawAim(){
  if(!aimSkill||!hoverPix) return;
  const c=cmdOf(aimSkill);
  ctx.save();
  if(aimSkill==='meteor'){
    const R=130;
    ctx.strokeStyle='rgba(255,122,42,.9)'; ctx.lineWidth=2.5; ctx.setLineDash([9,7]);
    ctx.beginPath(); ctx.arc(hoverPix.x,hoverPix.y,R,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,122,42,.13)'; ctx.beginPath(); ctx.arc(hoverPix.x,hoverPix.y,R,0,Math.PI*2); ctx.fill();
    // 十字准星
    ctx.strokeStyle='rgba(255,200,140,.85)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(hoverPix.x-R-12,hoverPix.y); ctx.lineTo(hoverPix.x-R+14,hoverPix.y);
    ctx.moveTo(hoverPix.x+R-14,hoverPix.y); ctx.lineTo(hoverPix.x+R+12,hoverPix.y);
    ctx.moveTo(hoverPix.x,hoverPix.y-R-12); ctx.lineTo(hoverPix.x,hoverPix.y-R+14);
    ctx.moveTo(hoverPix.x,hoverPix.y+R-14); ctx.lineTo(hoverPix.x,hoverPix.y+R+12); ctx.stroke();
  } else if(aimSkill==='barricade'){
    // 吸附预览：显示会钉在哪一段路上
    let best=null;
    for(const lane of ['a','b']){
      const P=PATHS[lane]; const stepN=Math.max(24, Math.floor(P.total/12));
      for(let i=0;i<=stepN;i++){
        const d=P.total*(i/stepN), pt=posAt(lane,d);
        const dd=Math.hypot(pt.x-hoverPix.x, pt.y-hoverPix.y);
        if(!best||dd<best.dd) best={dd, pt};
      }
    }
    const ok=best&&best.dd<=110;
    ctx.strokeStyle=ok?'rgba(185,138,74,.95)':'rgba(220,60,60,.9)'; ctx.lineWidth=3; ctx.setLineDash([7,6]);
    const pt=ok?best.pt:hoverPix;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,30,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    if(ok){
      ctx.globalAlpha=0.55; drawBarricadeGhost(pt.x,pt.y); ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(185,138,74,.45)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(hoverPix.x,hoverPix.y); ctx.lineTo(pt.x,pt.y); ctx.stroke();
    } else {
      ctx.fillStyle='rgba(255,120,120,.9)'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('须钉在土路上', hoverPix.x, hoverPix.y-40); ctx.textAlign='left';
    }
  }
  ctx.restore();
}
function drawBarricadeGhost(x,y){
  ctx.save(); ctx.translate(x,y);
  for(let i=-1;i<=1;i++){
    ctx.save(); ctx.translate(i*17,0);
    ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-11,12); ctx.lineTo(11,-16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11,12); ctx.lineTo(-11,-16); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawGate(x,y){
  ctx.fillStyle='#3a2414'; ctx.fillRect(x-4,y-38,22,76);
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x,y-28,16,22); ctx.fillRect(x,y+6,16,22);
  ctx.fillStyle='#c0392b'; ctx.fillRect(x+6,y-62,5,26);
  ctx.fillStyle='#e6b800'; ctx.beginPath(); ctx.moveTo(x+11,y-62); ctx.lineTo(x+28,y-54); ctx.lineTo(x+11,y-46); ctx.fill();
}

// ---- M5 演出：耐久条 / 被拆预警 / 瘫痪废墟 / 攻城弹道 / 结阵连线 ----
function drawTowerStatus(t){
  const hurt=t.hp<t.maxHp-0.5 || t.wreck;
  if(t.wreck){
    // 废墟：倾斜的断木 + 焦痕
    ctx.save(); ctx.translate(t.x,t.y);
    ctx.fillStyle='rgba(20,14,8,.55)'; ctx.beginPath(); ctx.ellipse(0,10,20,8,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#5a4630'; ctx.lineWidth=4; ctx.lineCap='round';
    for(let i=0;i<3;i++){ const a=-0.9+i*0.75; ctx.beginPath(); ctx.moveTo(-10+i*9,8); ctx.lineTo(-10+i*9+Math.cos(a)*13, 8-Math.abs(Math.sin(a))*15); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle='#ff8a5a'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('瘫痪 · 修复 '+repairCost(t)+'金', t.x, t.y-30+Math.sin(gameTime*3)*1.5);
  }
  if(t.underFireT>0){
    const a=0.35+Math.sin(gameTime*12)*0.25;
    ctx.strokeStyle='rgba(255,60,60,'+a.toFixed(2)+')'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(t.x,t.y,30+Math.sin(gameTime*8)*3,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,90,60,'+(0.6+Math.sin(gameTime*12)*0.35).toFixed(2)+')';
    ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText('!', t.x, t.y-38);
  }
  if(t.immuneUntil>gameTime){
    ctx.strokeStyle='rgba(126,203,255,'+(0.35+Math.sin(gameTime*9)*0.2).toFixed(2)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(t.x,t.y,27,0,Math.PI*2); ctx.stroke();
  }
  if(hurt){
    const w=34, r=Math.max(0,t.hp/t.maxHp), y=t.y-30;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(t.x-w/2-1,y-1,w+2,5);
    ctx.fillStyle=r>0.55?'#8ad08a':r>0.28?'#ffd54a':'#ff5252';
    ctx.fillRect(t.x-w/2,y,w*r,3);
    if(t.wreck){ ctx.fillStyle='rgba(255,60,60,.75)'; ctx.fillRect(t.x-w/2,y,w*Math.min(1,(t.ruinAcc||0)/(t.maxHp*0.7)),3); }
  }
  if(t.hitFx>0){
    ctx.globalAlpha=t.hitFx; ctx.fillStyle='#ff6a3a';
    ctx.beginPath(); ctx.arc(t.x,t.y-6,20,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  }
  if(t.repairFx>0){
    ctx.globalAlpha=t.repairFx*0.5; ctx.strokeStyle='#7CFF7C'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(t.x,t.y,24+ (1-t.repairFx)*22,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
  }
}
function drawSiegeShots(){
  for(const s of siegeShots){
    const k=1-s.life/s.max;
    const x=s.x+(s.tx-s.x)*k, y=s.y+(s.ty-s.y)*k - Math.sin(k*Math.PI)*52;   // 抛物线
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(x, s.y+(s.ty-s.y)*k+8, 6,3,0,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(x,y); ctx.rotate(k*7);
    ctx.fillStyle='#6b6258'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8a8076'; ctx.beginPath(); ctx.arc(-2,-2,3.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // 落点预警圈
    ctx.strokeStyle='rgba(255,90,60,'+(0.25+k*0.5).toFixed(2)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(s.tx,s.ty+6, 22*(1-k*0.5), 0, Math.PI*2); ctx.stroke();
  }
}
function drawEscortLinks(){
  for(const e of enemies){
    if(e.dead||!e.core||e.core.dead) continue;
    ctx.strokeStyle='rgba(255,213,74,.28)'; ctx.lineWidth=1.6; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(e.pos.x,e.pos.y-4); ctx.lineTo(e.core.pos.x,e.core.pos.y-4); ctx.stroke();
    ctx.setLineDash([]);
  }
  for(const e of enemies){
    if(e.dead||!e.guards||!e.guards.length) continue;
    const alive=e.guards.filter(g=>!g.dead).length; if(!alive) continue;
    ctx.strokeStyle='rgba(255,213,74,'+(0.3+Math.sin(gameTime*4)*0.12).toFixed(2)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(e.pos.x,e.pos.y,e.radius+13,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#ffd54a'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('结阵×'+alive, e.pos.x, e.pos.y-e.radius-32);
  }
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#080602'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const s=view.scale*view.dpr;
  const shx=shake?(Math.random()*2-1)*shake:0, shy=shake?(Math.random()*2-1)*shake:0;
  ctx.setTransform(s,0,0,s, view.ox*view.dpr+shx, view.oy*view.dpr+shy);
  ctx.clearRect(-20,-20,W+40,H+40);
  drawGroundLayer(); drawMarsh(); drawForestDapple();
  const gyA=PATHS.a.points[0].y, gyB=PATHS.b.points[0].y;
  drawGate(0,gyA); drawGate(0,gyB);
  const cy=PATHS.a.points[PATHS.a.points.length-1].y;
  ctx.fillStyle='#3a3834'; ctx.fillRect(W-42,cy-48,48,96);
  ctx.fillStyle='#5a564e';
  for(let i=0;i<4;i++) ctx.fillRect(W-40+i*12,cy-60,8,14);
  ctx.fillStyle='#120e0a'; ctx.fillRect(W-28,cy-8,20,36);
  ctx.fillStyle='#c0392b'; ctx.fillRect(W-18,cy-78,4,20);
  ctx.fillStyle='#e6b800'; ctx.beginPath(); ctx.moveTo(W-14,cy-78); ctx.lineTo(W+2,cy-70); ctx.lineTo(W-14,cy-62); ctx.fill();
  drawTorch(28, gyA-20); drawTorch(28, gyB-20); drawTorch(W-50, cy-20);
  for(const d of deco){ if(d.t==='tree') drawTree(d.x,d.y); else if(d.t==='rock') drawRock(d.x,d.y); else drawBush(d.x,d.y); }
  drawCloudShadows();

  if(buildKey){
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
      if(isBuildable(c,r)&&!towerAt(c,r)){
        const tr=terrainAt(c,r);
        ctx.fillStyle=tr==='hill'?'rgba(255,225,120,.24)':tr==='forest'?'rgba(120,255,180,.20)':'rgba(90,220,120,.14)';
        ctx.fillRect(c*CELL+3,r*CELL+3,CELL-6,CELL-6);
        if(tr!=='plain'){
          ctx.fillStyle=tr==='hill'?'rgba(255,240,180,.85)':'rgba(150,255,200,.85)';
          ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
          ctx.fillText(tr==='hill'?'高':'林', c*CELL+CELL/2, r*CELL+CELL-7);
          ctx.textAlign='left';
        }
      }
    }
    if(hoverCell){
      const ok=isBuildable(hoverCell.c,hoverCell.r)&&!towerAt(hoverCell.c,hoverCell.r)&&gold>=DEFS[buildKey].cost;
      ctx.fillStyle=ok?'rgba(80,220,120,.35)':'rgba(220,50,50,.35)';
      ctx.fillRect(hoverCell.c*CELL+2,hoverCell.r*CELL+2,CELL-4,CELL-4);
      const p=cellCenter(hoverCell.c,hoverCell.r);
      const ghost={x:p.x,y:p.y,key:buildKey,level:1,anim:0,face:1,spec:null};
      if(DEFS[buildKey].cat==='hero') drawHeroT(ghost,true); else drawBuilding(ghost,true);
      ctx.beginPath(); ctx.arc(p.x,p.y,rngOf(ghost),0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.stroke();
    }
  }

  // ---- 鼓楼光环：常驻脉动圈 + 受益塔连线，让"看不见的增益"可见 ----
  for(const a of towers){
    if(DEFS[a.key].kind!=='aura') continue;
    const R=rngOf(a), pulse=(gameTime*0.55)%1;
    ctx.strokeStyle='rgba(255,213,74,'+(0.16-pulse*0.13)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(a.x,a.y,R*(0.55+pulse*0.45),0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([7,9]); ctx.strokeStyle='rgba(255,213,74,0.13)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(a.x,a.y,R,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,213,74,0.022)'; ctx.fill();
    for(const t of towers){
      const k=DEFS[t.key].kind;
      if(t===a||k==='aura'||k==='econ') continue;
      if(Math.hypot(t.x-a.x,t.y-a.y)>R) continue;
      ctx.strokeStyle='rgba(255,213,74,'+(0.16+Math.sin(gameTime*3+t.x*0.05)*0.08)+')'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(a.x,a.y-6); ctx.lineTo(t.x,t.y-6); ctx.stroke();
    }
  }
  const sprites=[];
  for(const t of towers) sprites.push({y:t.y,d:()=>{
    if(t.wreck){ ctx.globalAlpha=0.42; }
    DEFS[t.key].cat==='hero'?drawHeroT(t,false):drawBuilding(t,false);
    ctx.globalAlpha=1; drawTowerStatus(t);
  }});
  for(const e of enemies) sprites.push({y:e.pos.y,d:()=>drawEnemy(e)});
  for(const a of allies) sprites.push({y:a.y,d:()=>{
    shadow(a.x,a.y,9,4);
    drawDude(a.x,a.y-2,{s:1.0,face:a.face,walk:gameTime*9,attack:a.swing||0,cloth:'#1f6b32',armor:'#d4af37',helm:'iron',plume:'#2ecc71',weapon:'spear',cape:'#145022'});
    const lr=Math.max(0,a.life/7);
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(a.x-10,a.y-26,20,3);
    ctx.fillStyle='#2ecc71'; ctx.fillRect(a.x-10,a.y-26,20*lr,3);
  }});
  sprites.sort((a,b)=>a.y-b.y); for(const s of sprites) s.d();
  drawEscortLinks(); drawSiegeShots();

  for(const rain of rains){
    ctx.globalAlpha=Math.min(0.28, rain.life*0.4);
    ctx.fillStyle='#ff4a00'; ctx.beginPath(); ctx.arc(rain.x,rain.y,rain.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    for(let i=0;i<22;i++){
      const px=rain.x-rain.r+((i*67+gameTime*260)% (rain.r*2));
      const py=rain.y-70+(i*23+gameTime*180)%140;
      ctx.fillStyle='#ffb347'; ctx.fillRect(px, py, 4, 14);
      ctx.fillStyle='#ff6a00'; ctx.fillRect(px+1, py+10, 3, 8);
    }
  }
  for(const p of projectiles) drawProj(p);
  drawGrounds(); drawBolts(); drawBeams(); drawHeals();
  for(const s of swings) drawSwing(s);
  for(const r of rings){
    ctx.globalAlpha=Math.max(r.life/0.45,0);
    ctx.strokeStyle=r.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha*=0.4; ctx.lineWidth=8; ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const k=Math.max(p.life/p.max,0);
    ctx.globalAlpha=k*0.85;
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(0.35+k*0.85),0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  drawBarricades();
  drawMeteors();
  drawRally();
  drawCityWave();
  drawAim();
  drawWeather();
  drawVignette();
  ctx.textAlign='center';
  for(const n of numbers){
    const t=1-n.life/n.max;                        // 0→1
    const pop=t<0.16 ? 0.55+ (t/0.16)*0.65 : 1.2-(t-0.16)*0.24;   // 弹出缓动
    ctx.globalAlpha=Math.min(1,n.life/0.35);
    ctx.save(); ctx.translate(n.x,n.y); ctx.scale(pop,pop);
    ctx.font='bold '+(n.big?18:14)+'px sans-serif';
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(0,0,0,.72)';
    ctx.strokeText(String(n.val),0,0);
    ctx.fillStyle=n.color; ctx.fillText(String(n.val),0,0);
    ctx.restore(); ctx.globalAlpha=1;
  }
  drawCanvasHud();
}

// ---- Canvas 内 HUD：Boss 血条 + 波次进度条 ----
function drawCanvasHud(){
  if(state!=='playing') return;
  if(waveActive && waveTotal>0){
    const bw=300, bx=W/2-bw/2, by=12;
    // 剩余 = 未出场 + 场上存活（Boss 召唤的援军会让存活数超过队列总数，故双向 clamp）
    const remain=Math.min(waveTotal, spawnQueue.length+enemies.length);
    const killedRatio=Math.max(0,Math.min(1,(waveTotal-remain)/waveTotal));
    const spawnRatio=Math.min(1,waveSpawned/waveTotal);
    ctx.fillStyle='rgba(8,5,2,.72)'; ctx.fillRect(bx-3,by-3,bw+6,16);
    ctx.strokeStyle='#8a6a2f'; ctx.lineWidth=1.4; ctx.strokeRect(bx-3,by-3,bw+6,16);
    ctx.fillStyle='rgba(200,160,60,.28)'; ctx.fillRect(bx,by,bw*spawnRatio,10);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,'#7CFF7C'); g.addColorStop(1,'#2f8f3c');
    ctx.fillStyle=g; ctx.fillRect(bx,by,bw*killedRatio,10);
    ctx.fillStyle='#ffe9b0'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('第 '+wave+' 波 · 剩余 '+remain+' / '+waveTotal, W/2, by+9);
  }
  if(bossBar && !bossBar.dead){
    const bw=460, bx=W/2-bw/2, by=W?40:40;
    const r=Math.max(0,bossBar.hp/bossBar.maxHp);
    ctx.fillStyle='rgba(8,5,2,.8)'; ctx.fillRect(bx-4,by-4,bw+8,26);
    ctx.strokeStyle='#ffd54a'; ctx.lineWidth=2; ctx.strokeRect(bx-4,by-4,bw+8,26);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,'#ff2d55'); g.addColorStop(1,'#8a0c28');
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(bx,by,bw,18);
    ctx.fillStyle=g; ctx.fillRect(bx,by,bw*r,18);
    ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(bx,by,bw*r,6);
    ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('⚔ '+ENEMY[bossBar.type].name+'  '+Math.ceil(bossBar.hp)+' / '+Math.round(bossBar.maxHp), W/2, by+13);
  }
}

function stamp(cv, key){
  const c=cv.getContext('2d'); c.fillStyle='#1c140a'; c.fillRect(0,0,48,48);
  c.save(); c.translate(24,30); c.scale(1.05,1.05);
  if(DEFS[key].cat==='hero'){
    const o=heroLook(key);
    c.fillStyle=o.cloth; c.fillRect(-7,-7,14,14);
    if(o.armor){ c.fillStyle=o.armor; c.fillRect(-6,-5,12,8); }
    c.fillStyle='#e0b088'; c.beginPath(); c.arc(1,-13,6,0,Math.PI*2); c.fill();
  } else {
    c.fillStyle=DEFS[key].color; c.fillRect(-10,-8,20,16);
    c.fillStyle='#c9a227'; c.fillRect(-6,-16,12,8);
  }
  c.restore();
}

// 按下按钮/热键的统一入口：需要选点的先进瞄准态，其余立即释放
function triggerCommand(id){
  const c=cmdOf(id); if(!c) return false;
  if(aimSkill===id){ cancelAim(); return false; }
  if(!cmdReady(c)){
    if((cmdCd[c.id]||0)>0) showTouchHint(c.name+' 冷却中 '+ (cmdCd[c.id]).toFixed(1)+'s');
    else showTouchHint(c.name+' 士气不足（需 '+c.cost+'，现 '+Math.floor(morale)+'）');
    return false;
  }
  if(c.aim) return enterAim(id);
  return castCommand(id);
}
function renderCmdBar(){
  if(!cmdBarBuilt) buildCmdBar();
  const bar=document.getElementById('cmdBar'); if(!bar) return;
  bar.style.display=(state==='playing')?'flex':'none';
  const fill=document.getElementById('moraleFill'), txt=document.getElementById('moraleTxt');
  if(fill) fill.style.width=(morale/MORALE_MAX*100).toFixed(1)+'%';
  if(txt) txt.textContent=Math.floor(morale)+' / '+MORALE_MAX;
  document.querySelectorAll('.cmdBtn').forEach(b=>{

    const cd=cmdCd[c.id]||0;
    const sweep=b.querySelector('.cmdSweep'), cdTxt=b.querySelector('.cmdCdTxt');
    sweep.style.height=(cd>0?(cd/c.cd*100):0).toFixed(1)+'%';
    cdTxt.textContent=cd>0?Math.ceil(cd):'';
    b.classList.toggle('ready', cd<=0 && morale>=c.cost);
    b.classList.toggle('poor', morale<c.cost);

  });
}

// 用真实属性函数模拟下一级，避免 UI 数字与战斗逻辑脱节
function nextLevelStats(t){
  if(t.level>=4) return null;
  // 带上坐标，让鼓楼光环也算进预览
  const probe={key:t.key, level:t.level+1, spec:t.spec, x:t.x, y:t.y};
  const rate=rateOf(probe);
  return {dmg:dmgOf(probe), range:rngOf(probe), rate, dps:Math.round(dmgOf(probe)*rate)};
}
// 鼓楼/粮仓不是 DPS 单位，属性面板换一套指标
function supportRows(t){
  const h=DEFS[t.key], sp=specOf(t), lv=1+(t.level-1)*0.25;
  if(h.kind==='aura'){
    const d=((sp&&sp.auraDmg)||h.aura.dmg)*lv, r=((sp&&sp.auraRate)||h.aura.rate)*lv;
    const nx=t.level<4?(1+(t.level)*0.25):null;
    const covered=towers.filter(x=>{
      const k=DEFS[x.key].kind;
      return x!==t && k!=='aura' && k!=='econ' && Math.hypot(x.x-t.x,x.y-t.y)<=rngOf(t);
    }).length;
    return '<div class="attrs">'
      +'<div class="arow"><span>光环增伤</span><b>+'+(d*100).toFixed(0)+'%</b>'+(nx?' <span class="gain">→ +'+(((sp&&sp.auraDmg)||h.aura.dmg)*nx*100).toFixed(0)+'% ▲</span>':'')+'</div>'
      +'<div class="arow"><span>光环增速</span><b>+'+(r*100).toFixed(0)+'%</b>'+(nx?' <span class="gain">→ +'+(((sp&&sp.auraRate)||h.aura.rate)*nx*100).toFixed(0)+'% ▲</span>':'')+'</div>'
      +'<div class="arow"><span>覆盖半径</span><b>'+rngOf(t)+'</b></div>'
      +'<div class="arow hi"><span>受益塔</span><b>'+covered+' 座</b></div>'
      +'</div>';
  }
  const base=(sp&&sp.income)||h.income;
  const now=Math.round(base*(1+(t.level-1)*0.45));
  const nxt=t.level<4?Math.round(base*(1+(t.level)*0.45)):null;
  return '<div class="attrs">'
    +'<div class="arow hi"><span>每波产金</span><b>'+now+'</b>'+(nxt?' <span class="gain">→ '+nxt+' ▲</span>':'')+'</div>'
    +'<div class="arow"><span>累计产出</span><b>'+(t.produced||0)+' 金</b></div>'
    +'<div class="arow"><span>回本进度</span><b>'+Math.min(100,Math.round((t.produced||0)/Math.max(1,t.invested)*100))+'%</b></div>'
    +'</div>';
}

// 塔面板里的「立地 + 天候」行：把两条隐形的乘区摊开给玩家看
function terrainRow(t){
  const tr=terrainOf(t), w=env.weather;
  const parts=[];
  if(tr.id!=='plain') parts.push('<b style="color:'+(tr.id==='hill'?'#ffd54a':'#8ce8b0')+'">'+tr.name+'</b> '+tr.desc);
  const envBits=[];
  const dm=envDmgMul(t.key), rm=envRangeMul(), ra=envRateMul(), ca=envCritAdd();
  if(Math.abs(dm-1)>0.001) envBits.push('伤害 ×'+dm.toFixed(2));
  if(Math.abs(rm-1)>0.001) envBits.push('射程 ×'+rm.toFixed(2));
  if(Math.abs(ra-1)>0.001) envBits.push('攻速 ×'+ra.toFixed(2));
  if(ca>0.001) envBits.push('暴击 +'+Math.round(ca*100)+'%');
  if(envBits.length) parts.push('<b style="color:#9ad0ff">'+(env.night?'夜战 ':'')+w.icon+w.name+'</b> '+envBits.join(' · '));
  if(!parts.length) return '';
  return '<div class="specBox envBox">'+parts.join('<br>')+'</div>';
}

function makeTower(c,r,key){

  const tw={x:pc.x,y:pc.y,c:c,r:r,terrain:terrainAt(c,r),key,level:1,cooldown:0,anim:0,face:1,invested:h.cost,cdLeft:0,
    spawnT:1.2,targetMode:'first',spec:null,dmgDealt:0,kills:0,shots:0,flashT:0,born:gameTime,
    wreck:false,ruinAcc:0,underFireT:0,hitFx:0,repairFx:0,immuneUntil:0,disableUntil:0};
  tw.maxHp=towerMaxHp(tw); tw.hp=tw.maxHp;
  towers.push(tw);

function tryUpgrade(t){

}
function chooseSpec(t,id){
  const arr=SPECS[t.key]||[]; if(!arr.some(s=>s.id===id)) return;
  const uc=upCost(t); if(gold<uc) return;
  spend(uc); t.invested+=uc; t.level=2; t.spec=id;
  specPickTower=null; sfx('place'); showBanner('专精 · '+SPECS[t.key].find(s=>s.id===id).name);
  burst(t.x,t.y,18,'#9ad0ff',130,0.6); addRing(t,'#9ad0ff',56);
  renderDetail(); updateHud();

function upgrade(t){
  const uc=upCost(t); if(t.level>=4||gold<uc) return;
  spend(uc); t.invested+=uc; t.level++;
  refreshTowerHp(t, true); t.wreck=false; t.ruinAcc=0;   // 升级＝重修，耐久上限提升并补满
  burst(t.x,t.y,14,'#7CFF7C',120,0.5);
  if(t.level===4){ sfx('skill'); showBanner(DEFS[t.key].name+' 神威觉醒'); shake=10; burst(t.x,t.y,32,'#ffd700',190,0.8); addRing(t,'#ffd700',70); }

    if(!hovering && gameTime-(hudCache.detailT||0)>0.6){ hudCache.detailT=gameTime; renderDetail(); }

}

window.addEventListener('keydown',e=>{

  if(k==='q' && selectedTower) castSkill(selectedTower);
  if(k==='f' && selectedTower) tryUpgrade(selectedTower);
  if(k==='d' && selectedTower) sell(selectedTower);

function achContext(win, grade){
  let maxLevel=0, heroBuilt=0, bldBuilt=0;
  for(const t of towers){ if(t.level>maxLevel) maxLevel=t.level; }
  heroBuilt=stats.heroBuilt||0; bldBuilt=stats.bldBuilt||0;
  return {
    win:!!win, grade:grade||stats.grade||null, diff:difficulty, mode:gameMode,
    wave:wave, lives:lives, maxLives:DIFFICULTY[difficulty].lives+META.lives,
    towers:towers.length, maxLevel:maxLevel, relics:relicsPicked.length,
    bonds:synergy.active, cmdCast:stats.cmdCast||0, streak:stats.bestStreak||0,
    goldEarned:stats.goldEarned||0, farmGold:stats.farmGold||0, bossPhases:stats.bossPhases||0,
    heroBuilt:heroBuilt, bldBuilt:bldBuilt, clearedWeather:lastClearWeather,
    lifeKills:(meta.kills||0)+kills, mapWins:Object.keys(meta.mapWins||{}).length,
    techPts:Object.keys(meta.tech).reduce((a,k)=>a+meta.tech[k],0), techMax:TECH_MAX_PTS,
    wrecked:(stats.towersWrecked||0)+(stats.towersLost||0), repairs:stats.repairs||0, siegeKills:stats.siegeKills||0
  };
}
function checkAch(win, grade){
  const ctx=achContext(win, grade);
  let gained=0, got=[];
  for(const a of ACHIEVEMENTS){
    if(meta.ach[a.id]) continue;
    let ok=false; try{ ok=!!a.c(ctx); }catch(e){ ok=false; }
    if(!ok) continue;
    meta.ach[a.id]=Date.now(); meta.renown+=a.r; meta.earned+=a.r;
    gained+=a.r; got.push(a); pushAchToast(a);
  }
  if(got.length){ saveMeta(); stats.achGot=(stats.achGot||0)+got.length; stats.achRenown=(stats.achRenown||0)+gained; }
  return got;
}

      tm:t.targetMode,dd:Math.round(t.dmgDealt||0),kl:t.kills||0,pr:t.produced||0,
      hp:Math.round(t.hp),wr:!!t.wreck,ra:Math.round(t.ruinAcc||0)}))

function saveLabel(){

function resumeRun(){
  const s=meta.save; if(!hasSave()) return false;

  resetGame();
  wave=s.wave; gold=s.gold; lives=s.lives; kills=s.kills; gameTime=s.gameTime;

  relicsPicked=s.relics.slice(); RELIC=relicMul();

    tw.dmgDealt=d.dd; tw.kills=d.kl; tw.produced=d.pr;
    refreshTowerHp(tw, true);
    if(d.hp!=null) tw.hp=Math.min(tw.maxHp, Math.max(0,d.hp));
    tw.wreck=!!d.wr; tw.ruinAcc=d.ra||0;
  }
  // makeTower 会扣钱、加统计，恢复后要抹平
  gold=s.gold; stats=Object.assign(newStats(), s.stats);

const MAX_STEP=1/60;
function stepGame(total){
  // 固定子步长推进：2x/3x 加速时不会跳过碰撞判定
  let left=Math.min(total, 0.5);
  let guard=0;
  while(left>0 && guard++<64){
    const dt=Math.min(left, MAX_STEP);
    update(dt);
    if(state!=='playing') return;
    left-=dt;
  }
}
function loop(now){
  // 布局可能因侧栏折叠/旋屏改变，逐帧比对一次尺寸（只在真变了时重建 backing store）

    lastBoxW=box.clientWidth; lastBoxH=box.clientHeight; resizeCanvas();
  }
  const raw=Math.min((now-last)/1000,0.05); last=now;
  let scl=1;
  if(hitstop>0){ if(state==='playing'&&!paused&&!relicOpen){ hitstop=Math.max(0,hitstop-raw); scl=HITSTOP_SCALE; } else hitstop=0; }
  if(state==='playing'&&!paused&&!relicOpen) stepGame(raw*speedMul*scl);

/* ================= 音频重制 =================
   master → (music / sfx) 双总线，各自独立音量与静音；
   一条合成混响支路让音色不干；每个音效 2~3 个变体 + 音高抖动，避免听腻。 */
let AU={ctx:null, master:null, musicBus:null, sfxBus:null, wet:null, ready:false};
function makeIR(ac, sec, decay){
  const len=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return b;
}
ensureAudio=function(){
  if(!AU.ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC();
    const master=ac.createGain(); master.gain.value=1; master.connect(ac.destination);
    const musicBus=ac.createGain(), sfxBus=ac.createGain();
    musicBus.connect(master); sfxBus.connect(master);
    const conv=ac.createConvolver(); conv.buffer=makeIR(ac,1.6,2.6);
    const wet=ac.createGain(); wet.gain.value=0.16; wet.connect(conv); conv.connect(master);
    AU={ctx:ac, master, musicBus, sfxBus, wet, ready:true};
    actx=ac;
    applyVolumes();
  }
  if(AU.ctx.state==='suspended') AU.ctx.resume();
};
function applyVolumes(){
  if(!AU.ready) return;
  const m=SETTINGS.mute?0:1;
  AU.musicBus.gain.value=SETTINGS.music*m;
  AU.sfxBus.gain.value  =SETTINGS.sfx*m;
  musicOn=!SETTINGS.mute && SETTINGS.music>0.001;
}
// 基础发声：一个带包络的振荡器
function tone(o){
  if(!AU.ready||SETTINGS.mute) return;
  const ac=AU.ctx, t=ac.currentTime+(o.at||0);
  const osc=ac.createOscillator(), g=ac.createGain();
  osc.type=o.type||'triangle';
  osc.frequency.setValueAtTime(o.f, t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t+o.dur);
  const v=Math.max(0.0001,(o.v==null?0.2:o.v));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v, t+(o.atk||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t+o.dur);
  osc.connect(g);
  const bus=o.bus||AU.sfxBus;
  g.connect(bus);
  if(o.rev) g.connect(AU.wet);
  osc.start(t); osc.stop(t+o.dur+0.02);
}
function noiseHit(o){
  if(!AU.ready||SETTINGS.mute) return;
  const ac=AU.ctx, dur=o.dur||0.08, t=ac.currentTime+(o.at||0);
  const buf=ac.createBuffer(1, Math.max(1,Math.floor(ac.sampleRate*dur)), ac.sampleRate);
  const d=buf.getChannelData(0), sh=o.shape==null?2:o.shape;
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length, sh);
  const s=ac.createBufferSource(); s.buffer=buf;
  const f=ac.createBiquadFilter(); f.type=o.filter||'lowpass'; f.frequency.value=o.cut||2200;
  const g=ac.createGain(); g.gain.value=o.v==null?0.18:o.v;
  s.connect(f); f.connect(g); g.connect(o.bus||AU.sfxBus);
  if(o.rev) g.connect(AU.wet);
  s.start(t);
}
// 变体库：同一事件多种写法，随机挑一个 + 音高抖动
const SFX_LIB={

  wave: [ ()=>{ [392,494,587].forEach((f,i)=>tone({f,dur:0.5,type:'triangle',v:0.13,at:i*0.07,rev:1})); noiseHit({dur:0.5,cut:400,v:0.10,shape:0.6}); } ],

  lose: [ ()=>{ [196,165,131,98].forEach((f,i)=>tone({f,dur:1.0,type:'sawtooth',v:0.13,at:i*0.22,rev:1})); noiseHit({dur:1.2,cut:300,v:0.12,shape:0.5,rev:1}); } ],
  leak: [ ()=>{tone({f:110,to:70,dur:0.5,type:'sawtooth',v:0.16,rev:1}); noiseHit({dur:0.4,cut:400,v:0.14});} ],
  ach:  [ ()=>{ [784,988,1175].forEach((f,i)=>tone({f,dur:0.4,type:'sine',v:0.12,at:i*0.08,rev:1})); } ],
  ui:   [ ()=>tone({f:660,dur:0.05,type:'sine',v:0.07}), ()=>tone({f:720,dur:0.05,type:'sine',v:0.07}) ]
};
let _sfxLast={};
sfx=function(k){
  if(!AU.ready||SETTINGS.mute||SETTINGS.sfx<=0.001) return;
  const lib=SFX_LIB[k]; if(!lib) return;
  let i=Math.floor(Math.random()*lib.length);
  if(lib.length>1 && i===_sfxLast[k]) i=(i+1)%lib.length;   // 不连着放同一个变体
  _sfxLast[k]=i;
  const det=AU.ctx.createGain ? 1 : 1;                       // 音高抖动通过 detune 实现见 tone
  _pitchJitter=0.96+Math.random()*0.08;
  try{ lib[i](); }catch(e){}
  _pitchJitter=1;
};
let _pitchJitter=1;
const _tone=tone;
tone=function(o){ o=Object.assign({},o); o.f*=_pitchJitter; if(o.to) o.to*=_pitchJitter; return _tone(o); };

/* ---------- 自适应 BGM ----------
   三层：低音鼓点(drone) / 五声音阶主旋律 / 紧张时加入的战鼓与铜锣。
   强度 intensity 由 场上敌人数 · Boss · 剩余生命 决定，实时改变调式、速度与配器。 */
const PENTA=[0,2,4,7,9], BASE_A=196.00, BASE_B=174.61;
let MUS={id:null, step:0, intensity:0, target:0, mode:'calm'};
function musIntensity(){
  if(state!=='playing') return 0;
  let v=Math.min(1, enemies.length/14)*0.55;
  if(bossBar) v+=0.35;
  const lr=lives/Math.max(1,startLives||25);
  if(lr<0.4) v+=0.25;
  if(rallyUntil>gameTime) v+=0.15;
  return Math.min(1.35, v);
}
function musNote(semi, oct){ const base=MUS.mode==='tense'?BASE_B:BASE_A; return base*Math.pow(2,(semi+(oct||0)*12)/12); }
startMusic=function(){
  ensureAudio();
  if(!AU.ready) return;
  if(MUS.id) return;
  MUS.step=0;
  const tick=()=>{
    if(SETTINGS.mute||SETTINGS.music<=0.001) return;
    if(state!=='playing'&&state!=='menu') return;
    if(state==='playing'&&(paused||relicOpen)) return;
    MUS.target=state==='menu'?0.12:musIntensity();
    MUS.intensity+=(MUS.target-MUS.intensity)*0.18;
    const I=MUS.intensity;
    MUS.mode = I>0.62?'tense':'calm';
    const s=MUS.step++;
    const bus=AU.musicBus;
    // 层 1：低音持续音，每 4 拍换一次根音
    if(s%4===0){
      const root=musNote(PENTA[(s/4)%PENTA.length], -2);
      tone({f:root, dur:1.5, type:'sine', v:0.16+I*0.10, atk:0.25, bus, rev:1});
    }
    // 层 2：五声音阶主旋律
    if(state!=='menu' || s%2===0){
      const step=PENTA[(s*3+ (s>>2))%PENTA.length];
      const oct=(s%8<4)?0:1;
      tone({f:musNote(step,oct), dur:0.34+ (I>0.6?0:0.10), type:I>0.62?'sawtooth':'triangle',
            v:(0.10+I*0.07)*(state==='menu'?0.7:1), bus, rev:1});
    }
    // 层 3：战鼓（紧张时才进），Boss 时再加铜锣
    if(I>0.45 && s%2===0) noiseHit({dur:0.12, cut:220+I*260, v:0.10+I*0.10, shape:1.2, bus});
    if(I>0.9 && s%8===0){ noiseHit({dur:0.9, cut:1400, v:0.10, shape:0.5, bus, rev:1}); tone({f:musNote(0,-1),dur:0.9,type:'square',v:0.07,bus,rev:1}); }
  };
  const period=()=>Math.round(420-MUS.intensity*150);
  const run=()=>{ tick(); MUS.id=setTimeout(run, period()); };
  run();
};
stopMusic=function(){ if(MUS.id){ clearTimeout(MUS.id); MUS.id=null; } };

// ---- 主菜单动态背景：远山剪影 + 行军旗队 + 飘散余烬 ----
const menuFx=document.createElement('canvas'); menuFx.id='menuFx';
document.getElementById('overlay').insertBefore(menuFx, document.getElementById('overlay').firstChild);
const mfx=menuFx.getContext('2d');
const embers=[]; for(let i=0;i<70;i++) embers.push({x:Math.random(),y:Math.random(),s:0.4+Math.random()*1.6,v:0.02+Math.random()*0.07,p:Math.random()*6.3});
function drawMenuFx(t){
  const el=document.getElementById('overlay');
  if(!el || el.style.display==='none' || getComputedStyle(el).display==='none') return;
  const w=menuFx.clientWidth||el.clientWidth, h=menuFx.clientHeight||el.clientHeight;
  if(!w||!h) return;
  const dpr=Math.min(2, window.devicePixelRatio||1);
  if(menuFx.width!==Math.round(w*dpr)||menuFx.height!==Math.round(h*dpr)){ menuFx.width=Math.round(w*dpr); menuFx.height=Math.round(h*dpr); }
  mfx.setTransform(dpr,0,0,dpr,0,0);
  // 天空：暮色渐变 + 低垂云带
  const sky=mfx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#120a06'); sky.addColorStop(0.46,'#2e1608'); sky.addColorStop(0.72,'#5a2a0c'); sky.addColorStop(1,'#0d0703');
  mfx.fillStyle=sky; mfx.fillRect(0,0,w,h);
  // 落日
  const sx=w*0.72, sy=h*0.60;
  const sg=mfx.createRadialGradient(sx,sy,0,sx,sy,h*0.42);
  sg.addColorStop(0,'rgba(255,196,96,.42)'); sg.addColorStop(0.35,'rgba(255,120,40,.16)'); sg.addColorStop(1,'rgba(255,90,20,0)');
  mfx.fillStyle=sg; mfx.beginPath(); mfx.arc(sx,sy,h*0.42,0,Math.PI*2); mfx.fill();
  mfx.fillStyle='rgba(255,214,140,.55)'; mfx.beginPath(); mfx.arc(sx,sy,h*0.055,0,Math.PI*2); mfx.fill();
  // 云带
  for(let i=0;i<5;i++){
    const cy=h*(0.20+i*0.075), off=((t*(5+i*3))%(w+400))-200;
    mfx.fillStyle='rgba(30,14,6,'+(0.24+i*0.05)+')';
    mfx.beginPath(); mfx.ellipse(off,cy,150+i*40,9+i*3,0,0,Math.PI*2); mfx.fill();
    mfx.beginPath(); mfx.ellipse(off+w*0.55,cy+7,120+i*30,7+i*2,0,0,Math.PI*2); mfx.fill();
  }
  // 三层远山：越远越淡，制造纵深
  const ridge=(base, amp, col, seed, k)=>{
    mfx.fillStyle=col; mfx.beginPath(); mfx.moveTo(0,h);
    for(let x=0;x<=w;x+=8){
      const y=base - Math.abs(Math.sin(x*0.0042+seed))*amp - Math.sin(x*0.011+seed*2)*amp*0.30
              - Math.sin(x*0.0025+seed*3)*amp*0.55;
      mfx.lineTo(x,y);
    }
    mfx.lineTo(w,h); mfx.closePath(); mfx.fill();
    // 山脊迎光边
    mfx.strokeStyle='rgba(255,180,110,'+(0.16*k)+')'; mfx.lineWidth=1.2;
    mfx.beginPath();
    for(let x=0;x<=w;x+=8){
      const y=base - Math.abs(Math.sin(x*0.0042+seed))*amp - Math.sin(x*0.011+seed*2)*amp*0.30
              - Math.sin(x*0.0025+seed*3)*amp*0.55;
      x?mfx.lineTo(x,y):mfx.moveTo(x,y);
    }
    mfx.stroke();
  };
  ridge(h*0.74, h*0.16, 'rgba(46,24,12,.82)', 1.2, 1);
  ridge(h*0.83, h*0.13, 'rgba(28,14,7,.90)',  2.7, 0.7);
  ridge(h*0.94, h*0.10, 'rgba(12,7,3,.96)',   4.1, 0.4);
  // 行军旗队：地平线上缓缓移动的剪影
  const marchY=h*0.905;
  for(let i=0;i<16;i++){
    const x=((t*16 + i*74)%(w+180))-90;
    const bob=Math.sin(t*3.4+i)*1.4;
    mfx.fillStyle='rgba(8,5,2,.92)';
    mfx.fillRect(x-1.6, marchY-9+bob, 3.2, 9);              // 身
    mfx.beginPath(); mfx.arc(x, marchY-11+bob, 2.1,0,Math.PI*2); mfx.fill();   // 头
    if(i%3===0){                                            // 每三人一杆旗
      mfx.fillRect(x+2.6, marchY-24+bob, 1.2, 16);
      const fl=Math.sin(t*4+i)*2.2;
      mfx.fillStyle='rgba(150,32,20,.92)';
      mfx.beginPath(); mfx.moveTo(x+3.6, marchY-24+bob);
      mfx.quadraticCurveTo(x+11+fl, marchY-21+bob, x+3.6, marchY-15+bob); mfx.fill();
    }
  }
  // 余烬上飘
  mfx.globalCompositeOperation='lighter';
  for(const e of embers){
    e.y-=e.v*0.006; if(e.y<-0.02){ e.y=1.02; e.x=Math.random(); }
    const px=(e.x*w+Math.sin(t*0.8+e.p)*16), py=e.y*h;
    const a=0.30+Math.sin(t*2.4+e.p)*0.22;
    mfx.fillStyle='rgba(255,'+(150+Math.floor(e.s*40))+',70,'+a.toFixed(2)+')';
    mfx.beginPath(); mfx.arc(px,py,e.s,0,Math.PI*2); mfx.fill();
  }
  mfx.globalCompositeOperation='source-over';
  // 底部压暗，保证文字对比度
  const vg=mfx.createLinearGradient(0,h*0.55,0,h);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  mfx.fillStyle=vg; mfx.fillRect(0,h*0.55,w,h*0.45);
}

    (tutorIdx>0?'<button class="ghost" id="tPrev">上一步</button>':'')+
    '<button id="tNext">'+(tutorIdx===TUTOR.length-1?'开始征战':'下一步')+'</button></div>';
  tutorCard.querySelector('#tSkip').onclick=()=>{ sfx('ui'); endTutorial(); };
  const pv=tutorCard.querySelector('#tPrev'); if(pv) pv.onclick=()=>{ sfx('ui'); tutorIdx--; renderTutor(); };
  tutorCard.querySelector('#tNext').onclick=()=>{ sfx('ui'); tutorIdx++; if(tutorIdx>=TUTOR.length) endTutorial(); else renderTutor(); };
  requestAnimationFrame(()=>placeTutorCard(s.at));
}
function startTutorial(force){
  if(!force && SETTINGS.tutorialDone) return false;
  tutorIdx=0; tutorMask.style.display='block'; renderTutor(); return true;
}
function endTutorial(){
  tutorMask.style.display='none';
  SETTINGS.tutorialDone=true; saveSettings();
}
