<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>HAVEN</title>
<style>
  html,body{height:100%;margin:0;background:#0b100c;color:#fff6dc;font:20px/1.6 "Microsoft YaHei",sans-serif}
  .box{max-width:560px;margin:12vh auto;padding:28px;text-align:center}
  a{color:#e8c56a}
  .btn{display:inline-block;margin-top:18px;padding:12px 28px;background:#e8c56a;color:#2a1c0c;text-decoration:none;font-weight:700;border-radius:8px}
</style>
<script type="text/javascript">
(function () {
  var ua = navigator.userAgent || "";
  var here = String(location.href || "");
  var game = here.replace(/index\.html(\?.*)?$/i, "haven.html");
  if (game === here) {
    if (here.charAt(here.length - 1) === "/") game = here + "haven.html";
    else game = here + "/haven.html";
  }
  var modern = /Edg\/|Chrome\/|Firefox\/|Safari\//.test(ua) && !/Trident|MSIE/.test(ua);
  if (modern) { location.replace(game); return; }
  var jumped = false;
  try { location.href = "microsoft-edge:" + game; jumped = true; } catch (e) {}
  window.onload = function () {
    var tip = document.getElementById("tip");
    if (tip) tip.innerHTML = jumped
      ? "已请求用 Edge 打开。若没有跳转，请右键 <b>haven.html</b> → 打开方式 → Microsoft Edge。"
      : "请右键 <b>haven.html</b> → 打开方式 → Microsoft Edge 或 Chrome。<br>不要用 Internet Explorer。";
    var a = document.getElementById("go");
    if (a) a.href = game;
  };
})();
</script>
</head>
<body>
  <div class="box">
    <h1>HAVEN</h1>
    <p id="tip">正在打开游戏…</p>
    <a class="btn" id="go" href="haven.html">进入游戏</a>
    <p style="margin-top:22px;font-size:14px;opacity:.75">这台电脑双击 html 会调用 IE，IE 跑不了这个游戏。<br>请用 Edge / Chrome 打开 haven.html</p>
  </div>
</body>
</html>
